name: One-time Apple Secret Migration

on:
  workflow_dispatch:

permissions: {}

jobs:
  migrate:
    name: Copy repository Apple secrets into the protected environment
    if: >-
      github.repository == 'QubeTX/qube-machine-report' &&
      github.actor_id == '30877743' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: apple-signing
    steps:
      # This intentionally has no checkout and invokes no third-party action.
      # RELEASE_SECRET_MIGRATION_TOKEN is installed temporarily as an
      # apple-signing environment secret from the operator's authenticated
      # workstation. After this name/policy copy succeeds, the operator must
      # run native ARM/Intel credential preflights, delete the repository Apple
      # secrets and this token, rerun environment-only preflight, then remove
      # this temporary workflow through a protected PR.
      - name: Require an empty destination and the exact environment policy
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SECRET_MIGRATION_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_ACTOR_ID: ${{ github.actor_id }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$EVENT_NAME" == workflow_dispatch &&
             "$EXPECTED_ACTOR_ID" == 30877743 &&
             "$EXPECTED_REF" == refs/heads/main &&
             "$EXPECTED_REPOSITORY" == QubeTX/qube-machine-report &&
             "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ &&
             -n ${GH_TOKEN:-} ]]
          remote_main=$(gh api "repos/$EXPECTED_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$remote_main" == "$EXPECTED_SHA" ]]

          environment=$(gh api "repos/$EXPECTED_REPOSITORY/environments/apple-signing")
          jq -e '
            .name == "apple-signing" and
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true
          ' <<< "$environment" >/dev/null
          mapfile -t policies < <(
            gh api "repos/$EXPECTED_REPOSITORY/environments/apple-signing/deployment-branch-policies" \
              --jq '.branch_policies | sort_by(.type, .name)[] | [.type, .name] | @tsv'
          )
          [[ ${#policies[@]} -eq 2 &&
             "${policies[0]}" == $'branch\tmain' &&
             "${policies[1]}" == $'tag\tv*' ]]

          mapfile -t existing_names < <(
            gh api --paginate \
              "repos/$EXPECTED_REPOSITORY/environments/apple-signing/secrets?per_page=100" \
              --jq '.secrets[].name' | sort
          )
          [[ ${#existing_names[@]} -eq 1 &&
             "${existing_names[0]}" == RELEASE_SECRET_MIGRATION_TOKEN ]]

      - name: Copy the exact Apple secret set into apple-signing
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SECRET_MIGRATION_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_ACTOR_ID: ${{ github.actor_id }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$EVENT_NAME" == workflow_dispatch &&
             "$EXPECTED_ACTOR_ID" == 30877743 &&
             "$EXPECTED_REF" == refs/heads/main &&
             "$EXPECTED_REPOSITORY" == QubeTX/qube-machine-report &&
             "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ &&
             -n ${GH_TOKEN:-} ]]

          remote_main=$(gh api "repos/$EXPECTED_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$remote_main" == "$EXPECTED_SHA" ]]

          environment=$(gh api "repos/$EXPECTED_REPOSITORY/environments/apple-signing")
          jq -e '
            .name == "apple-signing" and
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true
          ' <<< "$environment" >/dev/null
          mapfile -t policies < <(
            gh api "repos/$EXPECTED_REPOSITORY/environments/apple-signing/deployment-branch-policies" \
              --jq '.branch_policies | sort_by(.type, .name)[] | [.type, .name] | @tsv'
          )
          [[ ${#policies[@]} -eq 2 &&
             "${policies[0]}" == $'branch\tmain' &&
             "${policies[1]}" == $'tag\tv*' ]]

          secret_names=(
            APPLE_API_ISSUER_ID
            APPLE_API_KEY_ID
            APPLE_API_KEY_P8_BASE64
            APPLE_CERTIFICATE_P12_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_INSTALLER_CERTIFICATE_P12_BASE64
            APPLE_INSTALLER_CERTIFICATE_PASSWORD
          )
          for name in "${secret_names[@]}"; do
            [[ -n ${!name:-} ]] || {
              echo "required repository secret is unavailable: $name" >&2
              exit 78
            }
            printf '%s' "${!name}" \
              | gh secret set "$name" --env apple-signing --repo "$EXPECTED_REPOSITORY"
            unset "$name"
          done

          mapfile -t actual_names < <(
            gh api --paginate \
              "repos/$EXPECTED_REPOSITORY/environments/apple-signing/secrets?per_page=100" \
              --jq '.secrets[].name' | sort
          )
          expected_names=("${secret_names[@]}" RELEASE_SECRET_MIGRATION_TOKEN)
          mapfile -t expected_names < <(printf '%s\n' "${expected_names[@]}" | sort)
          [[ ${#actual_names[@]} -eq ${#expected_names[@]} ]]
          printf '%s\n' "${actual_names[@]}" | cmp -s - <(
            printf '%s\n' "${expected_names[@]}"
          )
