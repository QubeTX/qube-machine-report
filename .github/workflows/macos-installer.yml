          PY
          gh api "repos/$REPOSITORY/actions/artifacts/$validation_proof_artifact_id" \
            > "$work_directory/validation-proof-artifact-after.json"
          validate_validation_proof_artifact "$work_directory/validation-proof-artifact-after.json"
          cmp "$work_directory/validation-proof-artifact-before.json" \
