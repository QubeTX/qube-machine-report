          mapfile -t expected_sorted < <(printf '%s\n' "${expected_before[@]}" | sort)
          [[ ${#existing_assets[@]} -eq 30 ]]
          [[ "$(printf '%s\n' "${existing_assets[@]}")" == "$(printf '%s\n' "${expected_sorted[@]}")" ]]
          public_windows="$work_directory/public-windows"
          mkdir -m 700 "$public_windows"
          windows_download_args=()
          for name in "${windows_names[@]}"; do windows_download_args+=(--pattern "$name"); done
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" \
            --dir "$public_windows" "${windows_download_args[@]}"
          for name in "${windows_names[@]}"; do
            cmp "$windows_directory/$name" "$public_windows/$name"
          done

          for name in "${asset_names[@]}"; do
            [[ ! -e "$public_windows/$name" ]]
          done
          validate_windows_validation_run "$validation_run_id" "$validation_event"
          [[ "$validation_run_attempt" == "$bound_validation_run_attempt" ]]
          validate_windows_run "$windows_run_id" "$windows_event"
          [[ "$validated_windows_run_attempt" == "$windows_run_attempt" ]]
          gh api "repos/$REPOSITORY/actions/artifacts/$validation_proof_artifact_id" \
            > "$work_directory/validation-proof-artifact-pre-upload.json"
          validate_validation_proof_artifact "$work_directory/validation-proof-artifact-pre-upload.json"
          gh api "repos/$REPOSITORY/actions/artifacts/$validation_input_artifact_id" \
            > "$work_directory/validation-input-artifact-pre-upload.json"
          validate_validation_input_artifact "$work_directory/validation-input-artifact-pre-upload.json"
          gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$work_directory/release-pre-upload.json"
          jq -e --arg sha "$EXPECTED_SHA" --slurpfile manifest "$validation_manifest" '
              .target_commitish == $sha and .draft == true and .prerelease == false and
              ([.assets[] | {id, name, size, digest}] | sort_by(.name)) ==
                ($manifest[0].release_assets | sort_by(.name))
            ' "$work_directory/release-pre-upload.json" >/dev/null
          gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" \
            "$ASSET_DIRECTORY/tr300-universal-apple-darwin.pkg" \
            "$ASSET_DIRECTORY/tr300-universal-apple-darwin.pkg.sha256" \
            "$ASSET_DIRECTORY/tr300-universal-apple-darwin.dmg" \
            "$ASSET_DIRECTORY/tr300-universal-apple-darwin.dmg.sha256"

          final_names=("${initial_names[@]}" "${windows_names[@]}" "${asset_names[@]}")
          final_directory="$work_directory/final-release"
          mkdir -m 700 "$final_directory"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir "$final_directory"
          mapfile -d '' -t final_entries < <(find "$final_directory" -mindepth 1 -maxdepth 1 -print0)
          [[ ${#final_entries[@]} -eq 34 ]]
          declare -A final_by_name=()
          for path in "${final_entries[@]}"; do
            name=${path##*/}
            [[ -f "$path" && ! -L "$path" && -s "$path" && -z ${final_by_name[$name]+present} ]]
            final_by_name["$name"]=$path
          done
          for name in "${final_names[@]}"; do [[ -n ${final_by_name[$name]+present} ]]; done
          for name in "${windows_names[@]}"; do cmp "$windows_directory/$name" "$final_directory/$name"; done
          for name in "${asset_names[@]}"; do cmp "$ASSET_DIRECTORY/$name" "$final_directory/$name"; done
          (
            cd "$final_directory"
            sha256sum -c sha256.sum
            for sidecar in ./*.sha256; do sha256sum -c "${sidecar#./}"; done
          )

          # Rebind once more after the multi-file draft upload, then atomically
          # change only the Release visibility. A failure above leaves a private
          # draft and never exposes a partial stable release.
          [[ "$(resolve_tag_commit "$RELEASE_TAG")" == "$EXPECTED_SHA" ]]
          [[ "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$EXPECTED_SHA" ]]
          gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" > "$work_directory/release-complete.json"
          release_id=$(jq -r .id "$work_directory/release-complete.json")
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          jq -e --arg sha "$EXPECTED_SHA" --argjson names \
            "$(printf '%s\n' "${final_names[@]}" | jq -R . | jq -s 'sort')" '
              .target_commitish == $sha and .draft == true and .prerelease == false and
              ([.assets[].name] | sort) == $names and ([.assets[].size > 0] | all) and
              ([.assets[].digest | type == "string" and test("^sha256:[0-9a-f]{64}$")] | all)
            ' "$work_directory/release-complete.json" >/dev/null
          jq -e --slurpfile manifest "$validation_manifest" '
              ($manifest[0].release_assets | map(.name)) as $validated_names |
              ([.assets[] | select(.name as $name | $validated_names | index($name)) |
                {id, name, size, digest}] | sort_by(.name)) ==
                ($manifest[0].release_assets | sort_by(.name))
            ' "$work_directory/release-complete.json" >/dev/null
          validate_windows_validation_run "$validation_run_id" "$validation_event"
          [[ "$validation_run_attempt" == "$bound_validation_run_attempt" ]]
          validate_windows_run "$windows_run_id" "$windows_event"
          [[ "$validated_windows_run_attempt" == "$windows_run_attempt" ]]
          gh api "repos/$REPOSITORY/actions/artifacts/$validation_proof_artifact_id" \
            > "$work_directory/validation-proof-artifact-pre-publish.json"
          validate_validation_proof_artifact "$work_directory/validation-proof-artifact-pre-publish.json"
          gh api "repos/$REPOSITORY/actions/artifacts/$validation_input_artifact_id" \
            > "$work_directory/validation-input-artifact-pre-publish.json"
          validate_validation_input_artifact "$work_directory/validation-input-artifact-pre-publish.json"
          set +e
          gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=true > "$work_directory/release-patch-response.json"
          patch_status=$?
          set -e
          gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$work_directory/release-published.json"
          jq -e --arg sha "$EXPECTED_SHA" --argjson names \
            "$(printf '%s\n' "${final_names[@]}" | jq -R . | jq -s 'sort')" '
              .target_commitish == $sha and .draft == false and .prerelease == false and
              ([.assets[].name] | sort) == $names and ([.assets[].size > 0] | all) and
              ([.assets[].digest | type == "string" and test("^sha256:[0-9a-f]{64}$")] | all)
            ' "$work_directory/release-published.json" >/dev/null
          jq -e --slurpfile manifest "$validation_manifest" '
              ($manifest[0].release_assets | map(.name)) as $validated_names |
              ([.assets[] | select(.name as $name | $validated_names | index($name)) |
                {id, name, size, digest}] | sort_by(.name)) ==
                ($manifest[0].release_assets | sort_by(.name))
            ' "$work_directory/release-published.json" >/dev/null
          while IFS=$'\t' read -r name digest size; do
            [[ "$digest" =~ ^sha256:([0-9a-f]{64})$ && "$size" =~ ^[1-9][0-9]*$ ]]
            path="$final_directory/$name"
            [[ "$(stat -c %s "$path")" == "$size" ]]
            actual=$(sha256sum "$path"); actual=${actual%% *}
            [[ "$actual" == "${BASH_REMATCH[1]}" ]]
          done < <(jq -r '.assets[] | [.name, .digest, .size] | @tsv' \
            "$work_directory/release-published.json")
          if [[ $patch_status -ne 0 ]]; then
            echo "release PATCH returned $patch_status, but the authoritative follow-up GET proves exact publication" >&2
          fi

  smoke-published-managed-linux:
    name: Smoke the exact published managed Linux installer
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download, bind, install, and update through the public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TR300_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          DOWNLOAD_DIRECTORY: ${{ runner.temp }}/published-managed-installer
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/public-release.json"
          jq -e --arg sha "$EXPECTED_SHA" '
            .target_commitish == $sha and .draft == false and .prerelease == false and
            (.assets | length) == 34 and ([.assets[].size > 0] | all)
          ' "$RUNNER_TEMP/public-release.json" >/dev/null
          [[ "$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)" == "$RELEASE_TAG" ]]
          mkdir "$DOWNLOAD_DIRECTORY"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" \
            --pattern tr300-installer.sh --dir "$DOWNLOAD_DIRECTORY"
          installer="$DOWNLOAD_DIRECTORY/tr300-installer.sh"
          [[ -f "$installer" && ! -L "$installer" && -s "$installer" ]]
          smoke_home=$(mktemp -d "$RUNNER_TEMP/tr300-managed-linux.XXXXXXXX")
          trap 'rm -rf "$smoke_home"' EXIT
          export HOME="$smoke_home"
          export CARGO_HOME="$smoke_home/.cargo"
          export XDG_CONFIG_HOME="$smoke_home/.config"
          sh "$installer"
          test "$("$CARGO_HOME/bin/tr300" --version)" = "tr300 ${RELEASE_TAG#v}"
          jq -e --arg version "${RELEASE_TAG#v}" '
            .provider.source == "cargo-dist" and .source.app_name == "tr300" and
            .version == $version and .modify_path == true
          ' "$XDG_CONFIG_HOME/tr300/tr300-receipt.json"
          test -f "$CARGO_HOME/env"
          # shellcheck disable=SC2016
          grep -Fq '. "$HOME/.cargo/env"' "$HOME/.profile"
          update=$("$CARGO_HOME/bin/tr300" update --json)
          jq -e '
            .success == true and .update_available == false and
            .install_channel == "shell-installer" and .requires_user_action == false
          ' <<< "$update"

  legacy-bridge:
    name: Validate v4.1.x DMG bridge (${{ matrix.name }})
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
          - name: Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install immutable v4.1.3 package baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir baseline
          gh release download v4.1.3 --repo '${{ github.repository }}' \
            --dir baseline \
            --pattern 'tr300-universal-apple-darwin.dmg' \
            --pattern 'tr300-universal-apple-darwin.dmg.sha256'
          (cd baseline && shasum -a 256 -c tr300-universal-apple-darwin.dmg.sha256)
          mount="$RUNNER_TEMP/tr300-v413-mount"
          mkdir "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" \
            baseline/tr300-universal-apple-darwin.dmg
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          sudo installer -pkg "$mount/tr300.pkg" -target /
          test "$(/usr/local/bin/tr300 --version)" = 'tr300 4.1.3'
          grep -Fqx 'package-id: com.qubetx.tr300.pkg' \
            < <(pkgutil --pkg-info com.qubetx.tr300.pkg)

      - name: Update the immutable client through its compatibility DMG
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          expected_tag=$RELEASE_TAG
          expected_version=$RELEASE_VERSION
          for attempt in {1..12}; do
            latest=$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)
            [[ $latest == "$expected_tag" ]] && break
            if [[ $attempt -eq 12 ]]; then
              echo "latest release is $latest, expected $expected_tag" >&2
              exit 1
            fi
            sleep 5
          done

          # The immutable updater correctly opens Apple Installer, whose visible
          # prompts cannot be driven on a clean hosted runner. Replace only the
          # `open` launcher with a fixture that runs the exact already-verified
          # nested PKG through Apple's command-line installer. All old-client
          # release discovery, DMG download/checksum/trust/mount, receipt, and
          # post-install verification code remains real.
          fake_bin="$RUNNER_TEMP/tr300-fake-open"
          mkdir "$fake_bin"
          cat > "$fake_bin/open" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          pkg=${!#}
          exec sudo installer -pkg "$pkg" -target /
          EOF
          chmod 755 "$fake_bin/open"

          set +e
          update=$(PATH="$fake_bin:$PATH" /usr/local/bin/tr300 update --json)
          update_status=$?
          set -e
          printf 'Legacy updater JSON (exit %s): %s\n' "$update_status" "$update" >&2
          test "$update_status" -eq 0
          jq -e --arg version "$expected_version" '
            .success == true and
            .latest_version == $version and
            .strategy == "mac_dmg_pkg" and
            .install_channel == "macos-dmg-pkg" and
            .requires_user_action == false
          ' <<< "$update"
          test "$(/usr/local/bin/tr300 --version)" = "tr300 $expected_version"
          package_info=$(pkgutil --pkg-info com.qubetx.tr300.pkg)
          grep -Fqx "version: $expected_version" <<< "$package_info"
          test "$(command -v tr300)" = /usr/local/bin/tr300
          test ! -e "$HOME/.cargo/bin/tr300"

      - name: Remove the validation package
        shell: bash
        run: |
          sudo rm -f /usr/local/bin/tr300
          sudo pkgutil --forget com.qubetx.tr300.pkg
          test ! -e /usr/local/bin/tr300
