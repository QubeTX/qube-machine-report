name: macOS Universal Package

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the PKG and compatibility DMG to (for example vX.Y.Z)"
        required: false
        default: ""
        type: string
      preflight_only:
        description: "Only prove the Installer identity; do not build or publish"
        required: false
        default: true
        type: boolean
      release_run_id:
        description: "Exact successful Release workflow run ID (required for tagged recovery publication)"
        required: false
        default: ""
        type: string
      windows_run_id:
        description: "Exact successful Windows Installers run ID (required for manual final publication)"
        required: false
        default: ""
        type: string
      windows_validation_run_id:
        description: "Exact successful private-draft Windows validation run ID (required for manual final publication)"
        required: false
        default: ""
        type: string

concurrency:
  group: macos-release-${{ github.event.workflow_run.head_sha || inputs.tag || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve-release:
    name: Resolve trusted release provenance
    if: |
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.repository == 'QubeTX/qube-machine-report' &&
       github.actor_id == '30877743') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.release.outputs.build }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      run_id: ${{ steps.release.outputs.run_id }}
      run_attempt: ${{ steps.release.outputs.run_attempt }}
      custody_required: ${{ steps.release.outputs.custody_required }}
    steps:
      - name: Resolve a trusted source before Apple credential use
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_RUN_ID: ${{ inputs.release_run_id }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_TAG: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          ACTOR_ID: ${{ github.actor_id }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local tag=$1
            local object_type source_sha
            IFS=$'\t' read -r object_type source_sha < <(
              gh api "repos/$EXPECTED_REPOSITORY/git/ref/tags/$tag" \
                --jq '.object | [.type, .sha] | @tsv'
            )
            for _ in 1 2 3 4 5; do
              case "$object_type" in
                commit)
                  printf '%s\n' "$source_sha"
                  return 0
                  ;;
                tag)
                  IFS=$'\t' read -r object_type source_sha < <(
                    gh api "repos/$EXPECTED_REPOSITORY/git/tags/$source_sha" \
                      --jq '.object | [.type, .sha] | @tsv'
                  )
                  ;;
                *)
                  echo "release tag resolves to unsupported object type: $object_type" >&2
                  return 65
                  ;;
              esac
            done
            echo 'release tag did not resolve to a commit' >&2
            return 65
          }

          require_release_target() {
            local tag=$1
            local source_sha=$2
            local release_target release_draft release_prerelease
            IFS=$'\t' read -r release_target release_draft release_prerelease < <(
              gh api "repos/$EXPECTED_REPOSITORY/releases/tags/$tag" \
                --jq '[.target_commitish, .draft, .prerelease] | @tsv'
            )
            [[ "$release_target" =~ ^[0-9a-f]{40}$ ]] || {
              echo "release $tag does not record an immutable target commit" >&2
              return 65
            }
            [[ "$release_target" == "$source_sha" ]] || {
              echo "release $tag targets $release_target, not tag commit $source_sha" >&2
              return 65
            }
            [[ "$release_draft" == true && "$release_prerelease" == false ]] || {
              echo "release $tag must be the private stable draft assembled by Release" >&2
              return 65
            }
          }

          validate_release_run() {
            local expected_run_id=$1
            local expected_tag=$2
            local expected_sha=$3
            local expected_attempt=${4:-}
            local trusted_workflow_id
            local actual_run_id workflow_id run_name run_path event status conclusion
            local repository head_repository head_branch head_sha run_attempt

            [[ "$expected_run_id" =~ ^[1-9][0-9]*$ ]] || {
              echo 'Release workflow run ID is malformed' >&2
              return 65
            }
            [[ -z "$expected_attempt" || "$expected_attempt" =~ ^[1-9][0-9]*$ ]] || {
              echo 'Release workflow run attempt is malformed' >&2
              return 65
            }
            trusted_workflow_id=$(
              gh api "repos/$EXPECTED_REPOSITORY/actions/workflows/release.yml" --jq .id
            )
            [[ "$trusted_workflow_id" =~ ^[1-9][0-9]*$ ]] || {
              echo 'trusted Release workflow ID is malformed' >&2
              return 65
            }
            IFS=$'\t' read -r \
              actual_run_id workflow_id run_name run_path event status conclusion \
              repository head_repository head_branch head_sha run_attempt < <(
                gh api "repos/$EXPECTED_REPOSITORY/actions/runs/$expected_run_id" \
                  --jq '[.id, .workflow_id, .name, .path, .event, .status, .conclusion, .repository.full_name, .head_repository.full_name, .head_branch, .head_sha, .run_attempt] | @tsv'
              )
            [[ "$actual_run_id" == "$expected_run_id" &&
               "$workflow_id" == "$trusted_workflow_id" &&
               "$run_name" == Release &&
               "$run_path" == .github/workflows/release.yml &&
               "$event" == push &&
               "$status" == completed &&
               "$conclusion" == success &&
               "$repository" == "$EXPECTED_REPOSITORY" &&
               "$head_repository" == "$EXPECTED_REPOSITORY" &&
               "$head_branch" == "$expected_tag" &&
               "$head_sha" == "$expected_sha" &&
               "$run_attempt" =~ ^[1-9][0-9]*$ &&
               (-z "$expected_attempt" || "$run_attempt" == "$expected_attempt") ]] || {
              echo "Release run $expected_run_id is not the exact successful trusted push for $expected_tag at $expected_sha" >&2
              return 65
            }
            printf '%s\n' "$run_attempt"
          }

          resolve_unique_release_run() {
            local tag=$1
            local source_sha=$2
            local trusted_workflow_id
            local endpoint
            local -a candidate_ids

            trusted_workflow_id=$(
              gh api "repos/$EXPECTED_REPOSITORY/actions/workflows/release.yml" --jq .id
            )
            [[ "$trusted_workflow_id" =~ ^[1-9][0-9]*$ ]] || return 65
            endpoint="repos/$EXPECTED_REPOSITORY/actions/workflows/release.yml/runs?event=push&status=success&head_sha=$source_sha&per_page=100"
            mapfile -t candidate_ids < <(
              gh api "$endpoint" --jq \
                ".workflow_runs[] | select(.workflow_id == $trusted_workflow_id and .name == \"Release\" and .path == \".github/workflows/release.yml\" and .event == \"push\" and .status == \"completed\" and .conclusion == \"success\" and .repository.full_name == \"$EXPECTED_REPOSITORY\" and .head_repository.full_name == \"$EXPECTED_REPOSITORY\" and .head_branch == \"$tag\" and .head_sha == \"$source_sha\") | .id"
            )
            [[ ${#candidate_ids[@]} -eq 1 && "${candidate_ids[0]}" =~ ^[1-9][0-9]*$ ]] || {
              echo "expected exactly one trusted successful Release run for $tag at $source_sha; found ${#candidate_ids[@]}" >&2
              return 65
            }
            printf '%s\n' "${candidate_ids[0]}"
          }

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_REPOSITORY" == QubeTX/qube-machine-report &&
               "$WORKFLOW_REF" == refs/heads/main && "$ACTOR_ID" == 30877743 &&
               "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
            remote_main=$(gh api "repos/$EXPECTED_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            [[ "$remote_main" == "$WORKFLOW_SHA" ]]
            tag=$DISPATCH_TAG
            if [[ -z "$tag" ]]; then
              [[ "$PREFLIGHT_ONLY" == true ]] || {
                echo 'a stable release tag is required when preflight_only is false' >&2
                exit 64
              }
              default_branch=$(gh api "repos/$EXPECTED_REPOSITORY" --jq .default_branch)
              source_sha=$(gh api "repos/$EXPECTED_REPOSITORY/commits/$default_branch" --jq .sha)
              version=''
              build=false
              run_id=''
              run_attempt=''
              custody_required=false
            else
              [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
                echo "invalid stable release tag: $tag" >&2
                exit 64
              }
              source_sha=$(resolve_tag_commit "$tag")
              require_release_target "$tag" "$source_sha"
              version=${tag#v}
              custody_required=true
              run_id=$DISPATCH_RUN_ID
              if [[ -z "$run_id" ]]; then
                [[ "$PREFLIGHT_ONLY" == true ]] || {
                  echo 'release_run_id is required for tagged recovery publication' >&2
                  exit 64
                }
                run_id=$(resolve_unique_release_run "$tag" "$source_sha")
              fi
              run_attempt=$(validate_release_run "$run_id" "$tag" "$source_sha")
              if [[ "$PREFLIGHT_ONLY" == true ]]; then
                build=false
              else
                build=true
              fi
            fi
          else
            [[ "$UPSTREAM_CONCLUSION" == success ]] || {
              echo 'upstream Release did not succeed' >&2
              exit 65
            }
            [[ "$UPSTREAM_EVENT" == push ]] || {
              echo "refusing upstream event: $UPSTREAM_EVENT" >&2
              exit 65
            }
            [[ "$UPSTREAM_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || {
              echo "refusing upstream repository: $UPSTREAM_REPOSITORY" >&2
              exit 65
            }
            [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'upstream Release SHA is malformed' >&2
              exit 65
            }
            tag=$UPSTREAM_TAG
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "invalid stable release tag: $tag" >&2
              exit 64
            }
            source_sha=$(resolve_tag_commit "$tag")
            require_release_target "$tag" "$source_sha"
            [[ "$source_sha" == "$UPSTREAM_SHA" ]] || {
              echo "release tag $tag targets $source_sha, not upstream SHA $UPSTREAM_SHA" >&2
              exit 65
            }
            version=${tag#v}
            build=true
            custody_required=true
            run_id=$UPSTREAM_RUN_ID
            run_attempt=$(validate_release_run "$run_id" "$tag" "$source_sha" "$UPSTREAM_RUN_ATTEMPT")
          fi

          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'trusted source SHA is malformed' >&2
            exit 65
          }
          {
            echo "build=$build"
            echo "tag=$tag"
            echo "version=$version"
            echo "source_sha=$source_sha"
            echo "run_id=$run_id"
            echo "run_attempt=$run_attempt"
            echo "custody_required=$custody_required"
          } >> "$GITHUB_OUTPUT"

  source-custody:
    name: Bind exact Release-run Apple artifacts
    needs: resolve-release
    if: needs.resolve-release.outputs.custody_required == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.trusted-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.trusted-upload.outputs.artifact-digest }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download by immutable artifact ID and normalize fixed Apple inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          EXPECTED_SHA: ${{ needs.resolve-release.outputs.source_sha }}
          RELEASE_RUN_ID: ${{ needs.resolve-release.outputs.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ needs.resolve-release.outputs.run_attempt }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/trusted-apple-inputs
        shell: bash
        run: |
          set -euo pipefail

          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          repository_id=$(gh api "repos/$EXPECTED_REPOSITORY" --jq .id)
          workflow_id=$(
            gh api "repos/$EXPECTED_REPOSITORY/actions/workflows/release.yml" --jq .id
          )
          [[ "$repository_id" =~ ^[1-9][0-9]*$ && "$workflow_id" =~ ^[1-9][0-9]*$ ]]

          work_directory=$(mktemp -d "$RUNNER_TEMP/tr300-release-custody.XXXXXXXX")
          trap 'rm -rf "$work_directory"' EXIT
          mkdir -m 700 "$OUTPUT_DIRECTORY"

          validate_run_json() {
            local path=$1
            jq -e \
              --argjson run_id "$RELEASE_RUN_ID" \
              --argjson workflow_id "$workflow_id" \
              --argjson run_attempt "$RELEASE_RUN_ATTEMPT" \
              --arg repository "$EXPECTED_REPOSITORY" \
              --arg tag "$RELEASE_TAG" \
              --arg sha "$EXPECTED_SHA" '
                .id == $run_id and
                .workflow_id == $workflow_id and
                .name == "Release" and
                .path == ".github/workflows/release.yml" and
                .event == "push" and
                .status == "completed" and
                .conclusion == "success" and
                .repository.full_name == $repository and
                .head_repository.full_name == $repository and
                .head_branch == $tag and
                .head_sha == $sha and
                .run_attempt == $run_attempt
              ' "$path" >/dev/null
          }

          artifact_record() {
            local inventory=$1
            local name=$2
            jq -r --arg name "$name" '
              [.artifacts[] | select(.name == $name)] |
              if length != 1 then error("expected exactly one artifact named " + $name)
              else .[0] |
                [.id, .digest, .expired, .size_in_bytes,
                 .workflow_run.id, .workflow_run.repository_id,
                 .workflow_run.head_repository_id, .workflow_run.head_branch,
                 .workflow_run.head_sha] | @tsv
              end
            ' "$inventory"
          }

          validate_inventory_shape() {
            local inventory=$1
            local total returned
            total=$(jq -r .total_count "$inventory")
            returned=$(jq -r '.artifacts | length' "$inventory")
            [[ "$total" =~ ^[0-9]+$ && "$total" -le 100 && "$returned" == "$total" ]]
            mapfile -t apple_names < <(
              jq -r '.artifacts[].name | select(test("apple-darwin"))' "$inventory"
            )
            [[ ${#apple_names[@]} -eq 4 ]]
            printf '%s\n' "${apple_names[@]}" | sort -u | cmp -s - <(
              printf '%s\n' \
                artifacts-build-local-aarch64-apple-darwin \
                artifacts-build-local-x86_64-apple-darwin \
                unsigned-artifacts-build-local-aarch64-apple-darwin \
                unsigned-artifacts-build-local-x86_64-apple-darwin
            )
          }

          gh api "repos/$EXPECTED_REPOSITORY/actions/runs/$RELEASE_RUN_ID" \
            > "$work_directory/run-before.json"
          gh api "repos/$EXPECTED_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100" \
            > "$work_directory/artifacts-before.json"
          validate_run_json "$work_directory/run-before.json"
          validate_inventory_shape "$work_directory/artifacts-before.json"

          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            artifact_name="artifacts-build-local-$target"
            IFS=$'\t' read -r \
              artifact_id artifact_digest expired size run_id artifact_repository_id \
              head_repository_id head_branch head_sha < <(
                artifact_record "$work_directory/artifacts-before.json" "$artifact_name"
              )
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ &&
               "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ &&
               "$expired" == false &&
               "$size" =~ ^[1-9][0-9]*$ && "$size" -le 33554432 &&
               "$run_id" == "$RELEASE_RUN_ID" &&
               "$artifact_repository_id" == "$repository_id" &&
               "$head_repository_id" == "$repository_id" &&
               "$head_branch" == "$RELEASE_TAG" &&
               "$head_sha" == "$EXPECTED_SHA" ]]

            zip_path="$work_directory/$target.zip"
            gh api "repos/$EXPECTED_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$zip_path"
            zip_sha=$(sha256sum -- "$zip_path")
            zip_sha=${zip_sha%% *}
            [[ "sha256:$zip_sha" == "$artifact_digest" ]]

            extracted="$work_directory/$target"
            mkdir -m 700 "$extracted"
            archive="tr300-$target.tar.xz"
            sidecar="$archive.sha256"
            manifest="$target-dist-manifest.json"
            python3 - "$zip_path" "$extracted" "$manifest" "$archive" "$sidecar" <<'PY'
          import os
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive_path, output_path, *expected = sys.argv[1:]
          expected_names = set(expected)
          output = Path(output_path)
          with zipfile.ZipFile(archive_path) as source:
              members = source.infolist()
              names = [member.filename for member in members]
              if len(names) != len(expected_names) or set(names) != expected_names:
                  raise SystemExit(f"unexpected artifact members: {names!r}")
              if sum(member.file_size for member in members) > 64 * 1024 * 1024:
                  raise SystemExit("artifact expands beyond the custody limit")
              for member in members:
                  pure = PurePosixPath(member.filename)
                  mode = member.external_attr >> 16
                  if (
                      pure.name != member.filename
                      or pure.is_absolute()
                      or ".." in pure.parts
                      or member.is_dir()
                      or member.file_size <= 0
                      or member.file_size > 64 * 1024 * 1024
                      or stat.S_ISLNK(mode)
                  ):
                      raise SystemExit(f"unsafe artifact member: {member.filename!r}")
                  destination = output / member.filename
                  flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
                  if hasattr(os, "O_NOFOLLOW"):
                      flags |= os.O_NOFOLLOW
                  descriptor = os.open(destination, flags, 0o600)
                  try:
                      with source.open(member) as src, os.fdopen(descriptor, "wb") as dst:
                          descriptor = -1
                          shutil.copyfileobj(src, dst, length=1024 * 1024)
                  finally:
                      if descriptor >= 0:
                          os.close(descriptor)
          PY

            payload_hash=$(sha256sum -- "$extracted/$archive")
            payload_hash=${payload_hash%% *}
            expected_sidecar="$payload_hash *$archive"
            sidecar_size=$(wc -c < "$extracted/$sidecar" | tr -d '[:space:]')
            expected_size=$((${#expected_sidecar} + 1))
            IFS= read -r actual_sidecar < "$extracted/$sidecar"
            [[ "$payload_hash" =~ ^[0-9a-f]{64}$ &&
               "$sidecar_size" == "$expected_size" &&
               "$actual_sidecar" == "$expected_sidecar" ]]
            jq -e \
              --arg tag "$RELEASE_TAG" \
              --arg archive "$archive" \
              --arg sidecar "$sidecar" \
              --arg hash "$payload_hash" '
                .dist_version == "0.31.0" and
                .announcement_tag == $tag and
                (.upload_files | length) == 2 and
                ([.upload_files[] | select(type == "string") | split("/")[-1]] | sort) ==
                  ([$archive, $sidecar] | sort) and
                .artifacts[$archive].checksums.sha256 == $hash
              ' "$extracted/$manifest" >/dev/null
            install -m 0644 "$extracted/$archive" "$OUTPUT_DIRECTORY/$archive"
            install -m 0644 "$extracted/$sidecar" "$OUTPUT_DIRECTORY/$sidecar"
          done

          # A rerun can replace artifacts under the same run ID. Re-read both
          # identities after download and reject any mid-flight attempt or
          # immutable-ID/digest change before the normalized bytes leave this job.
          gh api "repos/$EXPECTED_REPOSITORY/actions/runs/$RELEASE_RUN_ID" \
            > "$work_directory/run-after.json"
          gh api "repos/$EXPECTED_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100" \
            > "$work_directory/artifacts-after.json"
          validate_run_json "$work_directory/run-after.json"
          validate_inventory_shape "$work_directory/artifacts-after.json"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            artifact_name="artifacts-build-local-$target"
            before=$(artifact_record "$work_directory/artifacts-before.json" "$artifact_name")
            after=$(artifact_record "$work_directory/artifacts-after.json" "$artifact_name")
            [[ "$after" == "$before" ]]
          done
          mapfile -d '' -t normalized < <(
            find "$OUTPUT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          [[ ${#normalized[@]} -eq 4 ]]

      - name: Upload normalized trusted Apple archives
        id: trusted-upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tr300-trusted-apple-release-inputs
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ runner.temp }}/trusted-apple-inputs/tr300-aarch64-apple-darwin.tar.xz
            ${{ runner.temp }}/trusted-apple-inputs/tr300-aarch64-apple-darwin.tar.xz.sha256
            ${{ runner.temp }}/trusted-apple-inputs/tr300-x86_64-apple-darwin.tar.xz
            ${{ runner.temp }}/trusted-apple-inputs/tr300-x86_64-apple-darwin.tar.xz.sha256

  prepare-installer-inputs:
    name: Prepare fixed universal PKG inputs without Apple credentials
    needs: [resolve-release, source-custody]
    if: |
      needs.resolve-release.outputs.build == 'true' &&
      needs.source-custody.result == 'success'
    runs-on: macos-15-intel
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.prepared-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.prepared-upload.outputs.artifact-digest }}
    steps:
      - name: Checkout exact reviewed package sources without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          path: verified-source
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Download the exact normalized Release-run archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.source-custody.outputs.artifact_id }}
          merge-multiple: true
          path: upstream

      - name: Safely prepare a fixed data-only universal installer payload
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
          TRUSTED_INPUT_DIGEST: ${{ needs.source-custody.outputs.artifact_digest }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/tr300-prepared-installer-inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_VERSION" == "${RELEASE_TAG#v}" ]]
          [[ "$TRUSTED_INPUT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(git -C verified-source rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          [[ -z "$(git -C verified-source status --porcelain=v1 --untracked-files=no)" ]]

          expected=(
            tr300-aarch64-apple-darwin.tar.xz
            tr300-aarch64-apple-darwin.tar.xz.sha256
            tr300-x86_64-apple-darwin.tar.xz
            tr300-x86_64-apple-darwin.tar.xz.sha256
          )
          declare -A remaining=()
          for name in "${expected[@]}"; do remaining["$name"]=1; done
          mapfile -d '' -t entries < <(find upstream -mindepth 1 -maxdepth 1 -print0)
          [[ ${#entries[@]} -eq ${#expected[@]} ]]
          for path in "${entries[@]}"; do
            name=${path##*/}
            [[ -n ${remaining[$name]+present} && -f "$path" && ! -L "$path" && -s "$path" ]]
            unset 'remaining[$name]'
          done
          [[ ${#remaining[@]} -eq 0 ]]
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            archive="tr300-$target.tar.xz"
            payload_hash=$(shasum -a 256 "upstream/$archive" | awk '{print $1}')
            expected_sidecar="$payload_hash *$archive"
            sidecar_size=$(wc -c < "upstream/$archive.sha256" | tr -d '[:space:]')
            expected_size=$((${#expected_sidecar} + 1))
            IFS= read -r actual_sidecar < "upstream/$archive.sha256"
            [[ "$payload_hash" =~ ^[0-9a-f]{64}$ &&
               "$sidecar_size" == "$expected_size" &&
               "$actual_sidecar" == "$expected_sidecar" ]]
          done

          work_directory=$(mktemp -d "$RUNNER_TEMP/tr300-installer-prep.XXXXXXXX")
          trap 'rm -rf "$work_directory"' EXIT
          mkdir -m 700 "$OUTPUT_DIRECTORY"
          python3 - upstream "$work_directory" <<'PY'
          import os
          import shutil
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          input_dir, output_dir = map(Path, sys.argv[1:])
          for target in ("aarch64-apple-darwin", "x86_64-apple-darwin"):
              root = f"tr300-{target}"
              expected = {
                  root,
                  f"{root}/LICENSE",
                  f"{root}/CHANGELOG.md",
                  f"{root}/README.md",
                  f"{root}/tr300",
              }
              destination_root = output_dir / target
              destination_root.mkdir(mode=0o700)
              with tarfile.open(input_dir / f"{root}.tar.xz", mode="r:xz") as source:
                  members = source.getmembers()
                  names = [member.name for member in members]
                  if len(names) != len(expected) or set(names) != expected:
                      raise SystemExit(f"unexpected archive members for {target}: {names!r}")
                  if sum(member.size for member in members) > 64 * 1024 * 1024:
                      raise SystemExit("archive expands beyond the preparation limit")
                  for member in members:
                      pure = PurePosixPath(member.name)
                      if pure.is_absolute() or ".." in pure.parts or member.issym() or member.islnk():
                          raise SystemExit(f"unsafe archive member: {member.name!r}")
                      if member.isdir():
                          if member.name != root or member.mode != 0o755:
                              raise SystemExit("unexpected archive directory metadata")
                          continue
                      expected_mode = 0o755 if member.name == f"{root}/tr300" else 0o644
                      if not member.isfile() or member.size <= 0 or member.mode != expected_mode:
                          raise SystemExit(f"unexpected archive file metadata: {member.name!r}")
                      if member.name != f"{root}/tr300":
                          continue
                      extracted = source.extractfile(member)
                      if extracted is None:
                          raise SystemExit("could not read the architecture binary")
                      binary = destination_root / "tr300"
                      flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
                      if hasattr(os, "O_NOFOLLOW"):
                          flags |= os.O_NOFOLLOW
                      descriptor = os.open(binary, flags, 0o700)
                      try:
                          with extracted, os.fdopen(descriptor, "wb") as target_file:
                              descriptor = -1
                              shutil.copyfileobj(extracted, target_file, length=1024 * 1024)
                      finally:
                          if descriptor >= 0:
                              os.close(descriptor)
          PY

          lipo -create \
            "$work_directory/aarch64-apple-darwin/tr300" \
            "$work_directory/x86_64-apple-darwin/tr300" \
            -output "$OUTPUT_DIRECTORY/tr300-universal"
          chmod 0755 "$OUTPUT_DIRECTORY/tr300-universal"
          lipo "$OUTPUT_DIRECTORY/tr300-universal" -verify_arch arm64 x86_64

          xcrun clang -std=c11 -Wall -Wextra -Werror -O2 \
            -mmacosx-version-min=11.0 -arch arm64 -arch x86_64 \
            verified-source/scripts/macos-pkg-rollback.c \
            -o "$OUTPUT_DIRECTORY/tr300-pkg-rollback"
          chmod 0755 "$OUTPUT_DIRECTORY/tr300-pkg-rollback"
          lipo "$OUTPUT_DIRECTORY/tr300-pkg-rollback" -verify_arch arm64 x86_64

          python3 - verified-source/scripts/build-sign-notarize-macos-installer.sh \
            "$OUTPUT_DIRECTORY/preinstall" "$OUTPUT_DIRECTORY/postinstall" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          source_path, preinstall_path, postinstall_path = map(Path, sys.argv[1:])
          source = source_path.read_text(encoding="utf-8")
          for name, marker, destination in (
              ("preinstall", "PREINSTALL", preinstall_path),
              ("postinstall", "POSTINSTALL", postinstall_path),
          ):
              pattern = re.compile(
                  rf'^cat > "\$\{{pkg_scripts\}}/{name}" <<\'{marker}\'\n(.*?)\n{marker}$',
                  re.MULTILINE | re.DOTALL,
              )
              matches = pattern.findall(source)
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one {name} package-script template")
              payload = matches[0] + "\n"
              if not payload.startswith("#!/bin/sh\n") or "\x00" in payload or len(payload) > 32768:
                  raise SystemExit(f"unsafe {name} package-script template")
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(destination, flags, 0o700)
              with os.fdopen(descriptor, "w", encoding="utf-8", newline="\n") as output:
                  output.write(payload)
          PY

          printf 'source_sha=%s\nrelease_tag=%s\nversion=%s\n' \
            "$EXPECTED_SOURCE_SHA" "$RELEASE_TAG" "$RELEASE_VERSION" \
            > "$OUTPUT_DIRECTORY/PROVENANCE"
          chmod 0644 "$OUTPUT_DIRECTORY/PROVENANCE"
          (
            cd "$OUTPUT_DIRECTORY"
            shasum -a 256 \
              tr300-universal tr300-pkg-rollback preinstall postinstall PROVENANCE \
              > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )
          mapfile -d '' -t prepared < <(
            find "$OUTPUT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          [[ ${#prepared[@]} -eq 6 ]]
          for path in "${prepared[@]}"; do
            [[ -f "$path" && ! -L "$path" && -s "$path" ]]
          done

      - name: Upload the fixed prepared installer inputs
        id: prepared-upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tr300-prepared-universal-installer-inputs
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ runner.temp }}/tr300-prepared-installer-inputs/tr300-universal
            ${{ runner.temp }}/tr300-prepared-installer-inputs/tr300-pkg-rollback
            ${{ runner.temp }}/tr300-prepared-installer-inputs/preinstall
            ${{ runner.temp }}/tr300-prepared-installer-inputs/postinstall
            ${{ runner.temp }}/tr300-prepared-installer-inputs/PROVENANCE
            ${{ runner.temp }}/tr300-prepared-installer-inputs/SHA256SUMS

  credential-preflight:
    name: Installer identity preflight (${{ matrix.name }})
    needs: [resolve-release, source-custody]
    if: |
      always() &&
      needs.resolve-release.result == 'success' &&
      (needs.resolve-release.outputs.custody_required == 'false' ||
       needs.source-custody.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
          - name: Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    environment: apple-signing
    steps:
      - name: Import Installer identity and sign disposable PKG
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ vars.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          required_vars=(
            APPLE_CERTIFICATE_P12_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_INSTALLER_CERTIFICATE_P12_BASE64
            APPLE_INSTALLER_CERTIFICATE_PASSWORD
            APPLE_API_KEY_P8_BASE64
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
            APPLE_SIGNING_IDENTITY
            APPLE_INSTALLER_SIGNING_IDENTITY
            APPLE_TEAM_ID
          )
          for name in "${required_vars[@]}"; do
            [[ -n ${!name:-} ]] || {
              echo "required Apple Installer credential is unavailable: $name" >&2
              exit 78
            }
          done

          work_directory=$(mktemp -d "$RUNNER_TEMP/tr300-installer-preflight.XXXXXXXX")
          keychain="$work_directory/tr300-installer-preflight.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          app_p12="$work_directory/developer-id-application.p12"
          installer_p12="$work_directory/developer-id-installer.p12"
          api_key="$work_directory/AuthKey_${APPLE_API_KEY_ID}.p8"
          original_user_keychains=()
          while IFS= read -r line; do
            keychain_path=${line#*\"}
            keychain_path=${keychain_path%\"*}
            [[ -z $keychain_path ]] || original_user_keychains+=("$keychain_path")
          done < <(security list-keychains -d user)
          cleanup() {
            security list-keychains -d user -s "${original_user_keychains[@]}" \
              >/dev/null 2>&1 || true
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$work_directory"
          }
          trap cleanup EXIT INT TERM

          chmod 700 "$work_directory"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | \
            /usr/bin/base64 -D > "$app_p12"
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE_P12_BASE64" | \
            /usr/bin/base64 -D > "$installer_p12"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | \
            /usr/bin/base64 -D > "$api_key"
          chmod 600 "$app_p12" "$installer_p12" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$app_p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -f pkcs12
          security import "$installer_p12" -k "$keychain" \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -A -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "${original_user_keychains[@]}"

          identity_lines=$(security find-identity -v -p codesigning "$keychain" \
            | grep -E '^[[:space:]]*[0-9]+\) [[:xdigit:]]{40} "[^"]+"$' || true)
          identity_count=$(printf '%s\n' "$identity_lines" | grep -c . || true)
          [[ $identity_count -eq 1 ]]
          signing_fingerprint=$(printf '%s\n' "$identity_lines" | awk '{print $2}')
          imported_identity=$(printf '%s\n' "$identity_lines" | sed -E 's/^[^"]*"([^"]+)".*$/\1/')
          [[ "$signing_fingerprint" =~ ^[[:xdigit:]]{40}$ ]]
          [[ "$APPLE_SIGNING_IDENTITY" == "$signing_fingerprint" ||
             "$APPLE_SIGNING_IDENTITY" == "$imported_identity" ]]
          application_probe="$work_directory/application-credential-preflight"
          cp /usr/bin/true "$application_probe"
          codesign --force --identifier com.qubetx.tr300.application-credential-preflight \
            --options runtime --timestamp --keychain "$keychain" \
            --sign "$signing_fingerprint" "$application_probe"
          codesign --verify --strict --verbose=4 "$application_probe"
          application_details=$(codesign -d --verbose=4 "$application_probe" 2>&1)
          grep -Fqx 'Identifier=com.qubetx.tr300.application-credential-preflight' \
            <<< "$application_details"
          grep -Fqx -- "TeamIdentifier=$APPLE_TEAM_ID" <<< "$application_details"
          grep -Fqx -- "Authority=$imported_identity" <<< "$application_details"
          grep -Eq '^CodeDirectory .*flags=.*\(runtime\)' <<< "$application_details"
          grep -Eq '^Timestamp=.+' <<< "$application_details"

          leaf_pem="$work_directory/installer-leaf.pem"
          security find-certificate -c "$APPLE_INSTALLER_SIGNING_IDENTITY" \
            -p "$keychain" > "$leaf_pem"
          subject=$(openssl x509 -in "$leaf_pem" -noout -subject -nameopt RFC2253)
          issuer=$(openssl x509 -in "$leaf_pem" -noout -issuer -nameopt RFC2253)
          details=$(openssl x509 -in "$leaf_pem" -noout -text)
          grep -Fq -- "CN=$APPLE_INSTALLER_SIGNING_IDENTITY" <<< "$subject"
          grep -Eq -- "(^|,)OU=$APPLE_TEAM_ID(,|$)" <<< "$subject"
          grep -Eq '(^|,)OU=G2(,|$)' <<< "$issuer"
          grep -Fq 'Public-Key: (2048 bit)' <<< "$details"
          grep -Fq '1.2.840.113635.100.4.13' <<< "$details"
          openssl x509 -in "$leaf_pem" -checkend 86400 -noout

          payload="$work_directory/payload"
          mkdir -p "$payload/usr/local/share/tr300"
          printf '%s\n' 'TR-300 Apple Installer credential preflight' \
            > "$payload/usr/local/share/tr300/preflight.txt"
          package="$work_directory/installer-credential-preflight.pkg"
          pkgbuild --root "$payload" \
            --identifier com.qubetx.tr300.installer-credential-preflight \
            --version 0 --install-location / \
            --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" \
            --keychain "$keychain" "$package"
          signature=$(pkgutil --check-signature "$package")
          grep -Fq 'Developer ID Installer: ' <<< "$signature"
          grep -Fq -- "$APPLE_INSTALLER_SIGNING_IDENTITY" <<< "$signature"
          grep -Fq -- "($APPLE_TEAM_ID)" <<< "$signature"
          xcrun notarytool history --key "$api_key" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --output-format json \
            > "$work_directory/notary-history.json"
          jq -e '.history | type == "array"' "$work_directory/notary-history.json" \
            >/dev/null

  build:
    name: Build, sign, and notarize universal PKG
    needs: [resolve-release, source-custody, prepare-installer-inputs, credential-preflight]
    runs-on: macos-15-intel
    environment: apple-signing
    if: |
      needs.credential-preflight.result == 'success' &&
      needs.source-custody.result == 'success' &&
      needs.prepare-installer-inputs.result == 'success' &&
      needs.resolve-release.outputs.build == 'true'
    outputs:
      tag: ${{ needs.resolve-release.outputs.tag }}
      version: ${{ needs.resolve-release.outputs.version }}
      source_sha: ${{ needs.resolve-release.outputs.source_sha }}
      artifact_id: ${{ steps.macos-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.macos-upload.outputs.artifact-digest }}
    steps:
      - name: Download and revalidate the exact prepared artifact before credential use
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          PREPARED_ARTIFACT_ID: ${{ needs.prepare-installer-inputs.outputs.artifact_id }}
          PREPARED_ARTIFACT_DIGEST: ${{ needs.prepare-installer-inputs.outputs.artifact_digest }}
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
          PREPARED_DIRECTORY: ${{ runner.temp }}/tr300-prepared-installer-inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CURRENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PREPARED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PREPARED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_VERSION" == "${RELEASE_TAG#v}" ]]

          work_directory=$(mktemp -d "$RUNNER_TEMP/tr300-prepared-custody.XXXXXXXX")
          trap 'rm -rf "$work_directory"' EXIT
          repository_id=$(gh api "repos/$REPOSITORY" --jq .id)
          [[ "$repository_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$REPOSITORY/actions/artifacts/$PREPARED_ARTIFACT_ID" \
            > "$work_directory/artifact-before.json"
          validate_artifact() {
            local path=$1
            jq -e \
              --argjson artifact_id "$PREPARED_ARTIFACT_ID" \
              --argjson run_id "$CURRENT_RUN_ID" \
              --argjson repository_id "$repository_id" \
              --arg digest "sha256:$PREPARED_ARTIFACT_DIGEST" '
                .id == $artifact_id and
                .name == "tr300-prepared-universal-installer-inputs" and
                .expired == false and
                (.size_in_bytes > 0 and .size_in_bytes <= 134217728) and
                .digest == $digest and
                .workflow_run.id == $run_id and
                .workflow_run.repository_id == $repository_id and
                .workflow_run.head_repository_id == $repository_id
              ' "$path" >/dev/null
          }
          validate_artifact "$work_directory/artifact-before.json"

          zip_path="$work_directory/prepared-inputs.zip"
          gh api "repos/$REPOSITORY/actions/artifacts/$PREPARED_ARTIFACT_ID/zip" \
            > "$zip_path"
          zip_hash=$(shasum -a 256 "$zip_path" | awk '{print $1}')
          [[ "$zip_hash" == "$PREPARED_ARTIFACT_DIGEST" ]]
          mkdir -m 700 "$PREPARED_DIRECTORY"
          expected=(
            tr300-universal
            tr300-pkg-rollback
            preinstall
            postinstall
            PROVENANCE
            SHA256SUMS
          )
          python3 - "$zip_path" "$PREPARED_DIRECTORY" "${expected[@]}" <<'PY'
          import os
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          zip_path, output_path, *expected = sys.argv[1:]
          expected_names = set(expected)
          output = Path(output_path)
          with zipfile.ZipFile(zip_path) as source:
              members = source.infolist()
              names = [member.filename for member in members]
              if len(names) != len(expected_names) or set(names) != expected_names:
                  raise SystemExit(f"unexpected prepared artifact members: {names!r}")
              if sum(member.file_size for member in members) > 128 * 1024 * 1024:
                  raise SystemExit("prepared artifact expands beyond the custody limit")
              for member in members:
                  pure = PurePosixPath(member.filename)
                  mode = member.external_attr >> 16
                  if (
                      pure.name != member.filename
                      or pure.is_absolute()
                      or ".." in pure.parts
                      or member.is_dir()
                      or member.file_size <= 0
                      or member.file_size > 128 * 1024 * 1024
                      or stat.S_ISLNK(mode)
                  ):
                      raise SystemExit(f"unsafe prepared artifact member: {member.filename!r}")
                  destination = output / member.filename
                  flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
                  if hasattr(os, "O_NOFOLLOW"):
                      flags |= os.O_NOFOLLOW
                  descriptor = os.open(destination, flags, 0o600)
                  try:
                      with source.open(member) as src, os.fdopen(descriptor, "wb") as dst:
                          descriptor = -1
                          shutil.copyfileobj(src, dst, length=1024 * 1024)
                  finally:
                      if descriptor >= 0:
                          os.close(descriptor)
          PY

          gh api "repos/$REPOSITORY/actions/artifacts/$PREPARED_ARTIFACT_ID" \
            > "$work_directory/artifact-after.json"
          validate_artifact "$work_directory/artifact-after.json"
          cmp "$work_directory/artifact-before.json" "$work_directory/artifact-after.json"

          mapfile -d '' -t prepared < <(
            find "$PREPARED_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          [[ ${#prepared[@]} -eq ${#expected[@]} ]]
          for path in "${prepared[@]}"; do
            [[ -f "$path" && ! -L "$path" && -s "$path" ]]
          done
          expected_provenance=$(printf 'source_sha=%s\nrelease_tag=%s\nversion=%s' \
            "$EXPECTED_SOURCE_SHA" "$RELEASE_TAG" "$RELEASE_VERSION")
          [[ "$(cat "$PREPARED_DIRECTORY/PROVENANCE")" == "$expected_provenance" ]]
          (
            cd "$PREPARED_DIRECTORY"
            [[ $(wc -l < SHA256SUMS | tr -d '[:space:]') == 5 ]]
            shasum -a 256 -c SHA256SUMS
          )
          mapfile -t checksum_names < <(awk '{print $2}' "$PREPARED_DIRECTORY/SHA256SUMS" | sort)
          [[ ${#checksum_names[@]} -eq 5 ]]
          printf '%s\n' "${checksum_names[@]}" | cmp -s - <(
            printf '%s\n' PROVENANCE postinstall preinstall tr300-pkg-rollback tr300-universal
          )
          awk 'length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || NF != 2 { exit 1 }' \
            "$PREPARED_DIRECTORY/SHA256SUMS"
          [[ $(head -n 1 "$PREPARED_DIRECTORY/preinstall") == '#!/bin/sh' ]]
          [[ $(head -n 1 "$PREPARED_DIRECTORY/postinstall") == '#!/bin/sh' ]]
          [[ $(wc -c < "$PREPARED_DIRECTORY/preinstall") -le 32768 ]]
          [[ $(wc -c < "$PREPARED_DIRECTORY/postinstall") -le 32768 ]]
          lipo "$PREPARED_DIRECTORY/tr300-universal" -verify_arch arm64 x86_64
          lipo "$PREPARED_DIRECTORY/tr300-pkg-rollback" -verify_arch arm64 x86_64

      - name: Build direct PKG and legacy DMG bridge
        timeout-minutes: 45
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ vars.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
          PREPARED_DIRECTORY: ${{ runner.temp }}/tr300-prepared-installer-inputs
          OUTPUT_DIRECTORY: ${{ runner.temp }}/tr300-macos-installer-output
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          required_vars=(
            APPLE_CERTIFICATE_P12_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_INSTALLER_CERTIFICATE_P12_BASE64
            APPLE_INSTALLER_CERTIFICATE_PASSWORD
            APPLE_API_KEY_P8_BASE64
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
            APPLE_SIGNING_IDENTITY
            APPLE_INSTALLER_SIGNING_IDENTITY
            APPLE_TEAM_ID
          )
          for name in "${required_vars[@]}"; do
            [[ -n ${!name:-} ]] || {
              echo "required Apple release credential is unavailable: $name" >&2
              exit 78
            }
          done
          for name in tr300-universal tr300-pkg-rollback preinstall postinstall; do
            path="$PREPARED_DIRECTORY/$name"
            [[ -f "$path" && ! -L "$path" && -s "$path" ]]
          done

          work_directory=$(mktemp -d "$RUNNER_TEMP/tr300-macos-installer.XXXXXXXX")
          credential_directory="$work_directory/credentials"
          keychain="$work_directory/tr300-release.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          mkdir -m 700 "$credential_directory" "$OUTPUT_DIRECTORY"
          chmod 700 "$work_directory"
          original_user_keychains=()
          while IFS= read -r line; do
            keychain_path=${line#*\"}
            keychain_path=${keychain_path%\"*}
            [[ -z $keychain_path ]] || original_user_keychains+=("$keychain_path")
          done < <(security list-keychains -d user)
          cleanup() {
            security list-keychains -d user -s "${original_user_keychains[@]}" \
              >/dev/null 2>&1 || true
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$work_directory"
          }
          trap cleanup EXIT INT TERM

          app_p12="$credential_directory/developer-id-application.p12"
          installer_p12="$credential_directory/developer-id-installer.p12"
          api_key="$credential_directory/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$app_p12"
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$installer_p12"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | /usr/bin/base64 -D > "$api_key"
          chmod 600 "$app_p12" "$installer_p12" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$app_p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -f pkcs12
          security import "$installer_p12" -k "$keychain" \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -A -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "${original_user_keychains[@]}"

          identity_lines=$(security find-identity -v -p codesigning "$keychain" \
            | grep -E '^[[:space:]]*[0-9]+\) [[:xdigit:]]{40} "[^"]+"$' || true)
          identity_count=$(printf '%s\n' "$identity_lines" | grep -c . || true)
          [[ $identity_count -eq 1 ]]
          signing_fingerprint=$(printf '%s\n' "$identity_lines" | awk '{print $2}')
          [[ "$signing_fingerprint" =~ ^[[:xdigit:]]{40}$ ]]
          imported_identity=$(printf '%s\n' "$identity_lines" | sed -E 's/^[^"]*"([^"]+)".*$/\1/')
          [[ "$APPLE_SIGNING_IDENTITY" == "$signing_fingerprint" ||
             "$APPLE_SIGNING_IDENTITY" == "$imported_identity" ]]
          security find-certificate -c "$APPLE_INSTALLER_SIGNING_IDENTITY" \
            "$keychain" >/dev/null

          universal="$work_directory/tr300"
          rollback_helper="$work_directory/tr300-pkg-rollback"
          install -m 0755 "$PREPARED_DIRECTORY/tr300-universal" "$universal"
          install -m 0755 "$PREPARED_DIRECTORY/tr300-pkg-rollback" "$rollback_helper"
          lipo "$universal" -verify_arch arm64 x86_64
          lipo "$rollback_helper" -verify_arch arm64 x86_64
          codesign --force --identifier com.qubetx.tr300 --options runtime --timestamp \
            --keychain "$keychain" --sign "$signing_fingerprint" "$universal"
          codesign --force --identifier com.qubetx.tr300.pkg-rollback \
            --options runtime --timestamp --keychain "$keychain" \
            --sign "$signing_fingerprint" "$rollback_helper"

          verify_code_signature() {
            local path=$1
            local identifier=$2
            local details certificate_prefix embedded_fingerprint
            codesign --verify --strict --verbose=4 "$path"
            details=$(codesign -d --verbose=4 "$path" 2>&1)
            grep -Fqx "Identifier=$identifier" <<< "$details"
            grep -Fqx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$details"
            grep -Fqx "Authority=$imported_identity" <<< "$details"
            grep -Eq '^CodeDirectory .*flags=.*\(runtime\)' <<< "$details"
            grep -Eq '^Timestamp=.+' <<< "$details"
            certificate_prefix="$work_directory/certificate-${identifier//./-}"
            codesign -d --extract-certificates="$certificate_prefix" "$path" >/dev/null 2>&1
            embedded_fingerprint=$(openssl x509 -inform DER -in "${certificate_prefix}0" \
              -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')
            [[ "$embedded_fingerprint" == "$signing_fingerprint" ]]
          }
          verify_code_signature "$universal" com.qubetx.tr300
          verify_code_signature "$rollback_helper" com.qubetx.tr300.pkg-rollback

          notarize() {
            local artifact=$1
            local result status submission
            result="$work_directory/notary-$(basename "$artifact").json"
            xcrun notarytool submit "$artifact" \
              --key "$api_key" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" --wait --output-format json > "$result"
            status=$(jq -r '.status // empty' "$result")
            submission=$(jq -r '.id // empty' "$result")
            if [[ "$status" != Accepted ]]; then
              [[ -z $submission ]] || xcrun notarytool log "$submission" \
                --key "$api_key" --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" || true
              echo "Apple notarization failed for $(basename "$artifact"): ${status:-unknown}" >&2
              exit 1
            fi
          }
          verify_pkg_signature() {
            local artifact=$1
            local signature
            signature=$(pkgutil --check-signature "$artifact" 2>&1)
            printf '%s\n' "$signature"
            grep -Fq 'Status: signed by a developer certificate' <<< "$signature"
            grep -Fq -- "$APPLE_INSTALLER_SIGNING_IDENTITY" <<< "$signature"
            grep -Fq -- "($APPLE_TEAM_ID)" <<< "$signature"
          }

          binary_zip="$work_directory/tr300-universal-notary.zip"
          /usr/bin/ditto -c -k --keepParent "$universal" "$binary_zip"
          notarize "$binary_zip"

          payload="$work_directory/payload"
          install -d -m 0755 "$payload/usr/local/bin"
          install -m 0755 "$universal" "$payload/usr/local/bin/tr300"
          package_scripts="$work_directory/pkg-scripts"
          mkdir -m 0755 "$package_scripts"
          install -m 0755 "$universal" "$package_scripts/tr300-migration-probe"
          install -m 0755 "$rollback_helper" "$package_scripts/tr300-pkg-rollback"
          install -m 0755 "$PREPARED_DIRECTORY/preinstall" "$package_scripts/preinstall"
          install -m 0755 "$PREPARED_DIRECTORY/postinstall" "$package_scripts/postinstall"

          package="$work_directory/tr300.pkg"
          pkgbuild --root "$payload" --scripts "$package_scripts" \
            --identifier com.qubetx.tr300.pkg --version "$RELEASE_VERSION" \
            --install-location / --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" \
            --keychain "$keychain" "$package"
          verify_pkg_signature "$package"
          notarize "$package"
          xcrun stapler staple "$package"
          xcrun stapler validate "$package"
          spctl --assess --type install --verbose=4 "$package"

          direct_package="$OUTPUT_DIRECTORY/tr300-universal-apple-darwin.pkg"
          cp "$package" "$direct_package"
          verify_pkg_signature "$direct_package"
          xcrun stapler validate "$direct_package"
          spctl --assess --type install --verbose=4 "$direct_package"
          package_hash=$(shasum -a 256 "$direct_package" | awk '{print $1}')
          printf '%s *%s\n' "$package_hash" "$(basename "$direct_package")" \
            > "$direct_package.sha256"
          (cd "$OUTPUT_DIRECTORY" && \
            shasum -a 256 -c "$(basename "$direct_package").sha256")

          dmg_root="$work_directory/dmg-root"
          mkdir "$dmg_root"
          cp "$package" "$dmg_root/tr300.pkg"
          cat > "$dmg_root/README.txt" <<'EOF'
          TR-300 legacy updater compatibility package

          Current users should download the direct signed package instead:
          https://github.com/QubeTX/qube-machine-report/releases/latest/download/tr300-universal-apple-darwin.pkg

          This disk image remains available so TR-300 v4.1.x can update safely. It
          contains the exact same signed package, which installs the versionless `tr300`
          command system-wide at /usr/local/bin/tr300.

          If installation is blocked or cancelled, open the latest release:
          https://github.com/QubeTX/qube-machine-report/releases/latest
          EOF
          dmg="$OUTPUT_DIRECTORY/tr300-universal-apple-darwin.dmg"
          hdiutil create -volname 'TR-300' -srcfolder "$dmg_root" -format UDZO -ov "$dmg"
          codesign --force --timestamp --keychain "$keychain" \
            --sign "$signing_fingerprint" "$dmg"
          codesign --verify --deep --strict --verbose=4 "$dmg"
          notarize "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          dmg_hash=$(shasum -a 256 "$dmg" | awk '{print $1}')
          printf '%s *%s\n' "$dmg_hash" "$(basename "$dmg")" > "$dmg.sha256"
          (cd "$OUTPUT_DIRECTORY" && shasum -a 256 -c "$(basename "$dmg").sha256")
          cmp "$direct_package" "$dmg_root/tr300.pkg"

      - name: Upload macOS installers for native validation
        id: macos-upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tr300-universal-macos-installer
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/tr300-macos-installer-output/tr300-universal-apple-darwin.pkg
            ${{ runner.temp }}/tr300-macos-installer-output/tr300-universal-apple-darwin.pkg.sha256
            ${{ runner.temp }}/tr300-macos-installer-output/tr300-universal-apple-darwin.dmg
            ${{ runner.temp }}/tr300-macos-installer-output/tr300-universal-apple-darwin.dmg.sha256

  validate:
    name: Validate direct PKG (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
          - name: Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tr300-universal-macos-installer
          path: artifact

      - name: Validate, install, and exercise the universal package
        shell: bash
        env:
          # The installed updater uses this existing token only for its
          # read-only /releases/latest probe. It never prints or persists it.
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ vars.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          pkg="$PWD/artifact/tr300-universal-apple-darwin.pkg"
          (cd artifact && shasum -a 256 -c tr300-universal-apple-darwin.pkg.sha256)
          package_signature=$(pkgutil --check-signature "$pkg" 2>&1)
          printf '%s\n' "$package_signature"
          grep -Fq 'Status: signed by a developer certificate' <<< "$package_signature"
          grep -Fq -- "$APPLE_INSTALLER_SIGNING_IDENTITY" <<< "$package_signature"
          grep -Fq -- "($APPLE_TEAM_ID)" <<< "$package_signature"
          xcrun stapler validate "$pkg"
          spctl --assess --type install --verbose=4 "$pkg"

          # Immutable v4.1.x updaters require the legacy DMG filename. Prove
          # the bridge is trusted and contains this exact direct-PKG byte set,
          # but install from the direct package used by all current clients.
          dmg="$PWD/artifact/tr300-universal-apple-darwin.dmg"
          (cd artifact && shasum -a 256 -c tr300-universal-apple-darwin.dmg.sha256)
          codesign --verify --deep --strict --verbose=4 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

          mount="$RUNNER_TEMP/tr300-mount"
          mkdir "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          cmp "$pkg" "$mount/tr300.pkg"

          # Managed CLI is the advertised default. First install that exact-tag
          # channel, then prove a deliberately launched PKG removes its binary
          # and matching cargo-dist receipt before claiming native ownership.
          managed_directory="$RUNNER_TEMP/tr300-managed-draft"
          mkdir "$managed_directory"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" \
            --pattern tr300-installer.sh --dir "$managed_directory"
          managed_installer="$managed_directory/tr300-installer.sh"
          [[ -f "$managed_installer" && ! -L "$managed_installer" && -s "$managed_installer" ]]
          sh "$managed_installer"
          test "$("$HOME/.cargo/bin/tr300" --version)" = "tr300 $RELEASE_VERSION"
          test -f "$HOME/.config/tr300/tr300-receipt.json"

          # A foreign/malformed receipt is conflicting ownership, not license
          # to delete a working CLI copy. Require the PKG transaction to fail,
          # restore the pair byte-for-byte, and roll back its payload/receipt.
          managed_hash=$(shasum -a 256 "$HOME/.cargo/bin/tr300" | awk '{print $1}')
          printf '%s' '{"provider":{"source":"foreign"},"source":{"app_name":"tr300"},"install_prefix":"/ambiguous"}' \
            > "$HOME/.config/tr300/tr300-receipt.json"
          invalid_receipt=$(cat "$HOME/.config/tr300/tr300-receipt.json")
          set +e
          sudo installer -pkg "$pkg" -target /
          invalid_status=$?
          set -e
          if [ "$invalid_status" -eq 0 ]; then
            echo 'malformed managed receipt was incorrectly accepted' >&2
            exit 1
          fi
          if [ "$(shasum -a 256 "$HOME/.cargo/bin/tr300" | awk '{print $1}')" != "$managed_hash" ]; then
            echo 'rejected package changed the managed binary' >&2
            exit 1
          fi
          if [ "$(cat "$HOME/.config/tr300/tr300-receipt.json")" != "$invalid_receipt" ]; then
            echo 'rejected package changed the managed receipt' >&2
            exit 1
          fi
          if [ -e /usr/local/bin/tr300 ]; then
            echo 'rejected package left its payload behind' >&2
            exit 1
          fi
          if pkgutil --pkg-info com.qubetx.tr300.pkg >/dev/null 2>&1; then
            echo 'rejected package left a receipt behind' >&2
            exit 1
          fi

          # Restore a legitimate managed state through the same exact-tag
          # wrapper, then prove the successful native takeover.
          rm -f "$HOME/.cargo/bin/tr300" "$HOME/.config/tr300/tr300-receipt.json"
          sh "$managed_installer"
          sudo installer -pkg "$pkg" -target /
          test ! -e "$HOME/.cargo/bin/tr300"
          test ! -e "$HOME/.config/tr300/tr300-receipt.json"

          package_info=$(pkgutil --pkg-info com.qubetx.tr300.pkg)
          grep -Fqx 'package-id: com.qubetx.tr300.pkg' <<< "$package_info"
          grep -Fqx "version: $RELEASE_VERSION" <<< "$package_info"
          grep -Fqx 'volume: /' <<< "$package_info"
          package_location=$(sed -n 's/^location:[[:space:]]*//p' <<< "$package_info")
          [[ -z "$package_location" || "$package_location" == / ]]
          pkgutil --files com.qubetx.tr300.pkg | grep -Fqx 'usr/local/bin/tr300'
          file_info=$(pkgutil --file-info /usr/local/bin/tr300)
          grep -Fqx 'path: /usr/local/bin/tr300' <<< "$file_info"
          grep -Fqx 'volume: /' <<< "$file_info"
          grep -Fqx 'pkgid: com.qubetx.tr300.pkg' <<< "$file_info"
          grep -Fqx "pkg-version: $RELEASE_VERSION" <<< "$file_info"
          test "$(/usr/local/bin/tr300 --version)" = "tr300 $RELEASE_VERSION"
          codesign --verify --strict --verbose=4 /usr/local/bin/tr300
          installed_details=$(codesign -d --verbose=4 /usr/local/bin/tr300 2>&1)
          grep -Fqx 'Identifier=com.qubetx.tr300' <<< "$installed_details"
          grep -Fqx -- "TeamIdentifier=$APPLE_TEAM_ID" <<< "$installed_details"
          grep -Fq 'Authority=Developer ID Application:' <<< "$installed_details"
          # Xcode 16.4 requires the input file before -verify_arch. This must
          # match the builder's lifecycle check.
          lipo /usr/local/bin/tr300 -verify_arch arm64 x86_64
          /usr/local/bin/tr300 --fast --json | jq -e '.schema_version == 1'
          /usr/local/bin/tr300 --ascii --fast >/dev/null
          # A fresh managed shell install is equally authoritative. Its wrapper
          # verifies exact receipt/payload/signature evidence before one sudo
          # ceremony removes the PKG payload and receipt.
          sh "$managed_installer"
          test ! -e /usr/local/bin/tr300
          if pkgutil --pkg-info com.qubetx.tr300.pkg >/dev/null 2>&1; then
            echo 'managed takeover left the package receipt behind' >&2
            exit 1
          fi
          test "$("$HOME/.cargo/bin/tr300" --version)" = "tr300 $RELEASE_VERSION"
          rm -f "$HOME/.cargo/bin/tr300" "$HOME/.config/tr300/tr300-receipt.json"

  publish:
    name: Complete and publish the exact 34-asset GitHub Release
    needs: [build, validate]
    runs-on: ubuntu-24.04
    environment: release-publishing
    permissions:
      actions: read
      contents: write
    steps:
      - name: Bind exact supplements, upload macOS assets, and publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          ASSET_DIRECTORY: ${{ runner.temp }}/macos-release-assets
          CURRENT_RUN_ID: ${{ github.run_id }}
          MACOS_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          MACOS_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          DISPATCH_WINDOWS_VALIDATION_RUN_ID: ${{ inputs.windows_validation_run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local tag=$1
            local object_type source_sha
            IFS=$'\t' read -r object_type source_sha < <(
              gh api "repos/$REPOSITORY/git/ref/tags/$tag" \
                --jq '.object | [.type, .sha] | @tsv'
            )
            for _ in 1 2 3 4 5; do
              case "$object_type" in
                commit)
                  printf '%s\n' "$source_sha"
                  return 0
                  ;;
                tag)
                  IFS=$'\t' read -r object_type source_sha < <(
                    gh api "repos/$REPOSITORY/git/tags/$source_sha" \
                      --jq '.object | [.type, .sha] | @tsv'
                  )
                  ;;
                *)
                  echo "release tag resolves to unsupported object type: $object_type" >&2
                  return 65
                  ;;
              esac
            done
            echo 'release tag did not resolve to a commit' >&2
            return 65
          }

          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "invalid stable release tag: $RELEASE_TAG" >&2
            exit 64
          }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'expected release SHA is malformed' >&2
            exit 65
          }
          [[ "$REPOSITORY" == QubeTX/qube-machine-report &&
             "$WORKFLOW_SHA" == "$EXPECTED_SHA" ]]
          [[ "$CURRENT_RUN_ID" =~ ^[1-9][0-9]*$ &&
             "$MACOS_ARTIFACT_ID" =~ ^[1-9][0-9]*$ &&
             "$MACOS_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

          asset_names=(
            tr300-universal-apple-darwin.pkg
            tr300-universal-apple-darwin.pkg.sha256
            tr300-universal-apple-darwin.dmg
            tr300-universal-apple-darwin.dmg.sha256
          )
          work_directory=$(mktemp -d "$RUNNER_TEMP/tr300-final-publisher.XXXXXXXX")
          trap 'rm -rf "$work_directory"' EXIT
          repository_id=$(gh api "repos/$REPOSITORY" --jq .id)
          [[ "$repository_id" =~ ^[1-9][0-9]*$ ]]
          validate_macos_artifact() {
            local path=$1
            jq -e --argjson id "$MACOS_ARTIFACT_ID" --argjson run "$CURRENT_RUN_ID" \
              --argjson repository "$repository_id" --arg digest "sha256:$MACOS_ARTIFACT_DIGEST" '
                .id == $id and .name == "tr300-universal-macos-installer" and
                .expired == false and (.size_in_bytes > 0 and .size_in_bytes <= 268435456) and
                .digest == $digest and .workflow_run.id == $run and
                .workflow_run.repository_id == $repository and
                .workflow_run.head_repository_id == $repository
              ' "$path" >/dev/null
          }
          gh api "repos/$REPOSITORY/actions/artifacts/$MACOS_ARTIFACT_ID" \
            > "$work_directory/macos-artifact-before.json"
          validate_macos_artifact "$work_directory/macos-artifact-before.json"
          macos_zip="$work_directory/macos-assets.zip"
          gh api "repos/$REPOSITORY/actions/artifacts/$MACOS_ARTIFACT_ID/zip" > "$macos_zip"
          macos_zip_hash=$(sha256sum "$macos_zip"); macos_zip_hash=${macos_zip_hash%% *}
          [[ "$macos_zip_hash" == "$MACOS_ARTIFACT_DIGEST" ]]
          mkdir -m 700 "$ASSET_DIRECTORY"
          python3 - "$macos_zip" "$ASSET_DIRECTORY" "${asset_names[@]}" <<'PY'
          import os
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          zip_path, output_path, *expected = sys.argv[1:]
          expected_names = set(expected)
          output = Path(output_path)
          with zipfile.ZipFile(zip_path) as source:
              members = source.infolist()
              names = [member.filename for member in members]
              if len(names) != len(expected_names) or set(names) != expected_names:
                  raise SystemExit(f"unexpected macOS artifact members: {names!r}")
              if sum(member.file_size for member in members) > 256 * 1024 * 1024:
                  raise SystemExit("macOS artifact expands beyond the custody limit")
              for member in members:
                  pure = PurePosixPath(member.filename)
                  mode = member.external_attr >> 16
                  if (pure.name != member.filename or pure.is_absolute() or
                      ".." in pure.parts or member.is_dir() or member.file_size <= 0 or
                      member.file_size > 256 * 1024 * 1024 or stat.S_ISLNK(mode)):
                      raise SystemExit(f"unsafe macOS artifact member: {member.filename!r}")
                  destination = output / member.filename
                  flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
                  if hasattr(os, "O_NOFOLLOW"):
                      flags |= os.O_NOFOLLOW
                  descriptor = os.open(destination, flags, 0o600)
                  try:
                      with source.open(member) as src, os.fdopen(descriptor, "wb") as dst:
                          descriptor = -1
                          shutil.copyfileobj(src, dst, length=1024 * 1024)
                  finally:
                      if descriptor >= 0:
                          os.close(descriptor)
          PY
          gh api "repos/$REPOSITORY/actions/artifacts/$MACOS_ARTIFACT_ID" \
            > "$work_directory/macos-artifact-after.json"
          validate_macos_artifact "$work_directory/macos-artifact-after.json"
          cmp "$work_directory/macos-artifact-before.json" "$work_directory/macos-artifact-after.json"

          declare -A expected_names=()
          for name in "${asset_names[@]}"; do
            expected_names["$name"]=1
          done
          mapfile -d '' -t entries < <(
            find "$ASSET_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          [[ ${#entries[@]} -eq ${#asset_names[@]} ]] || {
            echo 'macOS artifact does not contain exactly four entries' >&2
            exit 66
          }
          for path in "${entries[@]}"; do
            name=${path##*/}
            [[ -n ${expected_names[$name]+present} && -f "$path" && ! -L "$path" && -s "$path" ]] || {
              echo "unexpected, empty, or non-regular macOS artifact entry: $name" >&2
              exit 66
            }
            unset 'expected_names[$name]'
          done
          [[ ${#expected_names[@]} -eq 0 ]] || {
            echo 'macOS artifact is missing a required file' >&2
            exit 66
          }

          for payload_name in \
            tr300-universal-apple-darwin.pkg \
            tr300-universal-apple-darwin.dmg
          do
            payload="$ASSET_DIRECTORY/$payload_name"
            sidecar="$payload.sha256"
            hash=$(sha256sum -- "$payload")
            hash=${hash%% *}
            expected_sidecar="$hash *$payload_name"
            sidecar_size=$(wc -c < "$sidecar" | tr -d '[:space:]')
            expected_size=$((${#expected_sidecar} + 1))
            IFS= read -r actual_sidecar < "$sidecar"
            [[ "$hash" =~ ^[0-9a-f]{64}$ && "$sidecar_size" == "$expected_size" && "$actual_sidecar" == "$expected_sidecar" ]] || {
              echo "checksum sidecar does not bind payload: $payload_name" >&2
              exit 66
