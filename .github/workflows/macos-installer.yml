          validation_proof_directory="$work_directory/windows-validation-proof"
          mkdir -m 700 "$validation_proof_directory"
          python3 - "$validation_proof_zip" "$validation_proof_directory" \
            windows-installer-validation.json validation-input-manifest.json <<'PY'
          import os, shutil, stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          archive, output, *expected = sys.argv[1:]
          with zipfile.ZipFile(archive) as source:
              members = source.infolist()
              if len(members) != len(expected) or {m.filename for m in members} != set(expected):
