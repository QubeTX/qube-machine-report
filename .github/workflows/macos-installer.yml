                > "$work_directory/windows-runs.json"
              mapfile -t candidate_windows_runs < <(
                jq -r --argjson workflow_id "$trusted_windows_workflow_id" \
                  --arg repository "$REPOSITORY" --arg sha "$EXPECTED_SHA" '
                    .workflow_runs[] |
                    select(.workflow_id == $workflow_id and .name == "Windows Installers" and
                           .path == ".github/workflows/windows-installers.yml" and
                           .event == "workflow_run" and .status == "completed" and
                           .conclusion == "success" and .repository.full_name == $repository and
                           .head_repository.full_name == $repository and .head_branch == "main" and
                           .head_sha == $sha) | .id
                  ' "$work_directory/windows-runs.json"
              )
              if [[ ${#candidate_windows_runs[@]} -eq 1 ]]; then
                windows_run_id=${candidate_windows_runs[0]}
                break
              fi
              [[ ${#candidate_windows_runs[@]} -eq 0 ]] || {
                echo 'multiple successful Windows installer runs match this source; use manual exact-run recovery' >&2
                exit 65
              }
              sleep 30
            done
            [[ "$windows_run_id" =~ ^[1-9][0-9]*$ ]] || {
              echo 'the exact Windows installer workflow did not complete successfully' >&2
              exit 65
            }
          fi
          validate_windows_run "$windows_run_id" "$windows_event"
          windows_run_attempt=$validated_windows_run_attempt

          gh api "repos/$REPOSITORY/actions/runs/$windows_run_id/artifacts?per_page=100" \
