            sidecar="$payload.sha256"
            hash=$(sha256sum -- "$payload")
            hash=${hash%% *}
            expected_sidecar="$hash *$payload_name"
            sidecar_size=$(wc -c < "$sidecar" | tr -d '[:space:]')
            expected_size=$((${#expected_sidecar} + 1))
            IFS= read -r actual_sidecar < "$sidecar"
            [[ "$hash" =~ ^[0-9a-f]{64}$ && "$sidecar_size" == "$expected_size" && "$actual_sidecar" == "$expected_sidecar" ]] || {
              echo "checksum sidecar does not bind payload: $payload_name" >&2
              exit 66
            }
          done

          validate_windows_run() {
            local expected_run_id=$1
            local expected_event=$2
            local trusted_workflow_id actual_run_id workflow_id run_name run_path
            local event status conclusion repository head_repository head_branch head_sha run_attempt
            trusted_workflow_id=$(gh api \
              "repos/$REPOSITORY/actions/workflows/windows-installers.yml" --jq .id)
            [[ "$trusted_workflow_id" =~ ^[1-9][0-9]*$ ]]
            IFS=$'\t' read -r actual_run_id workflow_id run_name run_path event status conclusion \
              repository head_repository head_branch head_sha run_attempt < <(
                gh api "repos/$REPOSITORY/actions/runs/$expected_run_id" \
                  --jq '[.id, .workflow_id, .name, .path, .event, .status, .conclusion, .repository.full_name, .head_repository.full_name, .head_branch, .head_sha, .run_attempt] | @tsv'
              )
            [[ "$actual_run_id" == "$expected_run_id" &&
               "$workflow_id" == "$trusted_workflow_id" &&
               "$run_name" == "Windows Installers" &&
               "$run_path" == .github/workflows/windows-installers.yml &&
               "$event" == "$expected_event" && "$status" == completed &&
               "$conclusion" == success && "$repository" == "$REPOSITORY" &&
               "$head_repository" == "$REPOSITORY" && "$head_branch" == main &&
               "$head_sha" == "$EXPECTED_SHA" && "$run_attempt" =~ ^[1-9][0-9]*$ ]]
