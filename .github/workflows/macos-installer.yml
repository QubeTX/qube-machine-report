          # no reliance on sudo environment variables and rejects that owner
          # before either the system payload or native receipt is committed.
          if /usr/bin/dscl . -read "/Users/$custom_fixture_user" >/dev/null 2>&1; then
            echo "Directory Service fixture user already exists: $custom_fixture_user" >&2
            exit 1
          fi
          if /usr/bin/dscl . -search /Users UniqueID "$custom_fixture_uid" 2>/dev/null |
            grep -q .; then
            echo "Directory Service fixture uid already exists: $custom_fixture_uid" >&2
            exit 1
          fi
          custom_fixture_home=$(mktemp -d \
            "/private/tmp/tr300 signed pkg custom home.XXXXXXXX")
          case "$custom_fixture_home" in
            "/private/tmp/tr300 signed pkg custom home."*) ;;
            *)
              echo "unsafe signed custom-home fixture: $custom_fixture_home" >&2
              exit 1
              ;;
          esac
          test "${custom_fixture_home#/Users/}" = "$custom_fixture_home"
          test "$custom_fixture_user" != "$(/usr/bin/stat -f '%Su' /dev/console)"
          sudo /usr/bin/dscl . -create "/Users/$custom_fixture_user"
          custom_fixture_created=1
          sudo /usr/bin/dscl . -create "/Users/$custom_fixture_user" \
            UniqueID "$custom_fixture_uid"
          sudo /usr/bin/dscl . -create "/Users/$custom_fixture_user" PrimaryGroupID 20
          sudo /usr/bin/dscl . -create "/Users/$custom_fixture_user" UserShell /usr/bin/false
          sudo /usr/bin/dscl . -create "/Users/$custom_fixture_user" \
            RealName 'TR-300 signed PKG custom-home fixture'
          sudo /usr/bin/dscl . -create "/Users/$custom_fixture_user" IsHidden 1
          sudo /usr/bin/dscl . -create "/Users/$custom_fixture_user" \
            NFSHomeDirectory "$custom_fixture_home"
          test "$(/usr/bin/id -u "$custom_fixture_user")" = "$custom_fixture_uid"
          /usr/bin/dscl -plist . -read "/Users/$custom_fixture_user" \
            NFSHomeDirectory > "$custom_fixture_plist"
          /usr/bin/plutil -lint "$custom_fixture_plist" >/dev/null
          resolved_custom_home=$(/usr/libexec/PlistBuddy -c \
            'Print :dsAttrTypeStandard\:NFSHomeDirectory:0' \
            "$custom_fixture_plist")
          if /usr/libexec/PlistBuddy -c \
            'Print :dsAttrTypeStandard\:NFSHomeDirectory:1' \
            "$custom_fixture_plist" >/dev/null 2>&1; then
            echo 'signed custom-home fixture unexpectedly has multiple home values' >&2
            exit 1
          fi
          test "$resolved_custom_home" = "$custom_fixture_home"

          custom_fixture_receipt="$custom_fixture_home/.config/tr300/tr300-receipt.json"
          mkdir -p "$(dirname "$custom_fixture_receipt")"
          printf '%s\n' '{"signed_custom_home_fixture":true}' > "$custom_fixture_receipt"
          custom_fixture_hash=$(shasum -a 256 "$custom_fixture_receipt" | awk '{print $1}')
          set +e
          sudo /usr/bin/env -u SUDO_USER -u SUDO_UID \
            /usr/sbin/installer -pkg "$pkg" -target /
          custom_home_status=$?
          set -e
          if [ "$custom_home_status" -eq 0 ]; then
            echo 'signed PKG incorrectly accepted custom-home managed evidence' >&2
            exit 1
          fi
          test "$(shasum -a 256 "$custom_fixture_receipt" | awk '{print $1}')" = \
            "$custom_fixture_hash"
          if [ -e /usr/local/bin/tr300 ] || [ -L /usr/local/bin/tr300 ]; then
            echo 'custom-home rejection left the signed payload behind' >&2
            exit 1
          fi
          if pkgutil --pkg-info com.qubetx.tr300.pkg >/dev/null 2>&1; then
            echo 'custom-home rejection left the signed package receipt behind' >&2
            exit 1
          fi

          rm -f "$custom_fixture_receipt"
          rmdir "$custom_fixture_home/.config/tr300" "$custom_fixture_home/.config" \
            "$custom_fixture_home"
          sudo /usr/bin/dscl . -delete "/Users/$custom_fixture_user"
          if /usr/bin/dscl . -read "/Users/$custom_fixture_user" >/dev/null 2>&1; then
            echo 'signed Directory Service fixture survived exact cleanup' >&2
            exit 1
          fi
          custom_fixture_created=0

          # Broken final-component symlinks are ownership evidence too. Neither
          # may be followed, replaced, or treated as an absent managed install.
          missing_binary="$RUNNER_TEMP/tr300-missing-managed-binary"
          missing_receipt="$RUNNER_TEMP/tr300-missing-managed-receipt"
          rm -f "$missing_binary" "$missing_receipt"
          ln -s "$missing_binary" "$HOME/.cargo/bin/tr300"
          ln -s "$missing_receipt" "$HOME/.config/tr300/tr300-receipt.json"
          set +e
          sudo installer -pkg "$pkg" -target /
          broken_link_status=$?
          set -e
          if [ "$broken_link_status" -eq 0 ]; then
            echo 'broken managed symlink evidence was incorrectly accepted' >&2
            exit 1
          fi
          test -L "$HOME/.cargo/bin/tr300"
          test -L "$HOME/.config/tr300/tr300-receipt.json"
          test "$(readlink "$HOME/.cargo/bin/tr300")" = "$missing_binary"
          test "$(readlink "$HOME/.config/tr300/tr300-receipt.json")" = "$missing_receipt"
          test ! -e "$missing_binary"
          test ! -e "$missing_receipt"
          test ! -e /usr/local/bin/tr300
          test ! -L /usr/local/bin/tr300
          if pkgutil --pkg-info com.qubetx.tr300.pkg >/dev/null 2>&1; then
            echo 'broken-link rejection left a package receipt behind' >&2
            exit 1
          fi

          # Exact fixture cleanup leaves no managed evidence. First prove a
          # genuinely fresh candidate install, then reset only its exact native
          # payload/receipt so the published v4.2.2 native upgrade can run.
          rm -f "$HOME/.cargo/bin/tr300" "$HOME/.config/tr300/tr300-receipt.json"
          sudo installer -pkg "$pkg" -target /
          test "$(/usr/local/bin/tr300 --version)" = "tr300 $RELEASE_VERSION"
          grep -Fqx "version: $RELEASE_VERSION" \
            < <(pkgutil --pkg-info com.qubetx.tr300.pkg)
          sudo rm -f /usr/local/bin/tr300
          sudo pkgutil --forget com.qubetx.tr300.pkg >/dev/null
          test ! -e /usr/local/bin/tr300
          test ! -L /usr/local/bin/tr300
          if pkgutil --pkg-info com.qubetx.tr300.pkg >/dev/null 2>&1; then
            echo 'fresh-install fixture reset left a package receipt behind' >&2
            exit 1
          fi

          # v4.2.2 is the last published direct-PKG baseline. Verify its public
          # sidecar, install it natively, then prove this candidate upgrades the
          # same receipt-owned path on each private native runner.
          baseline_directory="$RUNNER_TEMP/tr300-v422-direct-pkg"
          mkdir "$baseline_directory"
          baseline_native_release="$baseline_directory/release.json"
          baseline_pkg_sha256=717f233eedfac679a507bc9ce2b16ba195f050e289295665a8c68d83ba10c979
          baseline_pkg_size=7571628
          baseline_pkg_sidecar_sha256=1530d1f9fd73a7d7ab84de30fe4929b3ab5ecacc0715f8c461cd0ce2c76b5aec
          baseline_pkg_sidecar_size=99
          gh release view v4.2.2 --repo "$REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,assets \
            > "$baseline_native_release"
          jq -e --arg pkg_digest "sha256:${baseline_pkg_sha256}" \
            --argjson pkg_size "$baseline_pkg_size" \
            --arg sidecar_digest "sha256:${baseline_pkg_sidecar_sha256}" \
            --argjson sidecar_size "$baseline_pkg_sidecar_size" '
              .tagName == "v4.2.2" and
              .targetCommitish == "db0f538c82961569a7118b105a20e967b15476f0" and
              .isDraft == false and .isPrerelease == false and
              ([.assets[] | select(.name == "tr300-universal-apple-darwin.pkg")] |
                length) == 1 and
              ([.assets[] | select(.name == "tr300-universal-apple-darwin.pkg")][0] |
                .digest == $pkg_digest and .size == $pkg_size) and
              ([.assets[] | select(.name == "tr300-universal-apple-darwin.pkg.sha256")] |
                length) == 1 and
              ([.assets[] | select(.name == "tr300-universal-apple-darwin.pkg.sha256")][0] |
                .digest == $sidecar_digest and .size == $sidecar_size)
            ' "$baseline_native_release" >/dev/null
          gh release download v4.2.2 --repo "$REPOSITORY" \
            --pattern tr300-universal-apple-darwin.pkg \
            --pattern tr300-universal-apple-darwin.pkg.sha256 \
            --dir "$baseline_directory"
          baseline_pkg="$baseline_directory/tr300-universal-apple-darwin.pkg"
          baseline_pkg_sidecar="$baseline_directory/tr300-universal-apple-darwin.pkg.sha256"
          [[ -f "$baseline_pkg" && ! -L "$baseline_pkg" && -s "$baseline_pkg" &&
             -f "$baseline_pkg_sidecar" && ! -L "$baseline_pkg_sidecar" &&
             -s "$baseline_pkg_sidecar" ]]
          baseline_pkg_actual_size=$(wc -c < "$baseline_pkg" | tr -d '[:space:]')
          baseline_pkg_actual_sha256=$(shasum -a 256 "$baseline_pkg" | awk '{print $1}')
          baseline_sidecar_actual_size=$(wc -c < "$baseline_pkg_sidecar" | tr -d '[:space:]')
          baseline_sidecar_actual_sha256=$(shasum -a 256 "$baseline_pkg_sidecar" | awk '{print $1}')
          [[ "$baseline_pkg_actual_size" == "$baseline_pkg_size" &&
             "$baseline_pkg_actual_sha256" == "$baseline_pkg_sha256" &&
             "$baseline_sidecar_actual_size" == "$baseline_pkg_sidecar_size" &&
             "$baseline_sidecar_actual_sha256" == "$baseline_pkg_sidecar_sha256" ]]
          (cd "$baseline_directory" && \
            shasum -a 256 -c tr300-universal-apple-darwin.pkg.sha256)
          baseline_signature=$(pkgutil --check-signature "$baseline_pkg" 2>&1)
          grep -Fq 'Status: signed by a developer certificate' <<< "$baseline_signature"
          grep -Fq -- "$APPLE_INSTALLER_SIGNING_IDENTITY" <<< "$baseline_signature"
          grep -Fq -- "($APPLE_TEAM_ID)" <<< "$baseline_signature"
          xcrun stapler validate "$baseline_pkg"
          spctl --assess --type install --verbose=4 "$baseline_pkg"
          sudo installer -pkg "$baseline_pkg" -target /
          test "$(/usr/local/bin/tr300 --version)" = 'tr300 4.2.2'
          baseline_package_info=$(pkgutil --pkg-info com.qubetx.tr300.pkg)
          grep -Fqx 'package-id: com.qubetx.tr300.pkg' <<< "$baseline_package_info"
          grep -Fqx 'version: 4.2.2' <<< "$baseline_package_info"
          pkgutil --files com.qubetx.tr300.pkg | grep -Fqx 'usr/local/bin/tr300'

          sudo installer -pkg "$pkg" -target /
          test "$(/usr/local/bin/tr300 --version)" = "tr300 $RELEASE_VERSION"
          grep -Fqx "version: $RELEASE_VERSION" \
            < <(pkgutil --pkg-info com.qubetx.tr300.pkg)

          package_info=$(pkgutil --pkg-info com.qubetx.tr300.pkg)
          grep -Fqx 'package-id: com.qubetx.tr300.pkg' <<< "$package_info"
          grep -Fqx "version: $RELEASE_VERSION" <<< "$package_info"
          grep -Fqx 'volume: /' <<< "$package_info"
          package_location=$(sed -n 's/^location:[[:space:]]*//p' <<< "$package_info")
          [[ -z "$package_location" || "$package_location" == / ]]
          pkgutil --files com.qubetx.tr300.pkg | grep -Fqx 'usr/local/bin/tr300'
          file_info=$(pkgutil --file-info /usr/local/bin/tr300)
          grep -Fqx 'path: /usr/local/bin/tr300' <<< "$file_info"
          grep -Fqx 'volume: /' <<< "$file_info"
          grep -Fqx 'pkgid: com.qubetx.tr300.pkg' <<< "$file_info"
          grep -Fqx "pkg-version: $RELEASE_VERSION" <<< "$file_info"
          test "$(/usr/local/bin/tr300 --version)" = "tr300 $RELEASE_VERSION"
          codesign --verify --strict --verbose=4 /usr/local/bin/tr300
          installed_details=$(codesign -d --verbose=4 /usr/local/bin/tr300 2>&1)
          grep -Fqx 'Identifier=com.qubetx.tr300' <<< "$installed_details"
          grep -Fqx -- "TeamIdentifier=$APPLE_TEAM_ID" <<< "$installed_details"
          grep -Fq 'Authority=Developer ID Application:' <<< "$installed_details"
          # Xcode 16.4 requires the input file before -verify_arch. This must
          # match the builder's lifecycle check.
          lipo /usr/local/bin/tr300 -verify_arch arm64 x86_64
          /usr/local/bin/tr300 --fast --json | jq -e '.schema_version == 1'
          /usr/local/bin/tr300 --ascii --fast >/dev/null
          native_hash=$(shasum -a 256 /usr/local/bin/tr300 | awk '{print $1}')
          sudo installer -pkg "$pkg" -target /
          test "$(shasum -a 256 /usr/local/bin/tr300 | awk '{print $1}')" = "$native_hash"
          test "$(/usr/local/bin/tr300 --version)" = "tr300 $RELEASE_VERSION"
          grep -Fqx "version: $RELEASE_VERSION" \
            < <(pkgutil --pkg-info com.qubetx.tr300.pkg)

          # A fresh managed shell install is equally authoritative. Its wrapper
          # verifies exact receipt/payload/signature evidence before one sudo
          # ceremony removes the PKG payload and receipt.
          sh "$managed_installer"
          test ! -e /usr/local/bin/tr300
          if pkgutil --pkg-info com.qubetx.tr300.pkg >/dev/null 2>&1; then
            echo 'managed takeover left the package receipt behind' >&2
            exit 1
          fi
          test "$("$HOME/.cargo/bin/tr300" --version)" = "tr300 $RELEASE_VERSION"
          rm -f "$HOME/.cargo/bin/tr300" "$HOME/.config/tr300/tr300-receipt.json"

          # Seal this architecture's success to the exact build artifact and
          # source-produced wrapper/raw/archive byte identities. The publisher
          # independently downloads and validates both proof artifacts.
          build_artifact_after="$RUNNER_TEMP/tr300-native-build-artifact-after.json"
          gh api "repos/$REPOSITORY/actions/artifacts/$BUILD_ARTIFACT_ID" \
            > "$build_artifact_after"
          validate_build_artifact "$build_artifact_after"
          build_record_after=$(build_artifact_record "$build_artifact_after")
          [[ "$build_record_after" == "$build_record_before" ]]
          [[ ! -e "$VALIDATION_PROOF" && ! -L "$VALIDATION_PROOF" ]]
          jq -n \
            --arg tag "$RELEASE_TAG" --arg sha "$EXPECTED_SHA" \
            --argjson run "$CURRENT_RUN_ID" \
            --argjson attempt "$CURRENT_RUN_ATTEMPT" \
            --arg arch "$MATRIX_ARCH" \
            --argjson build_id "$BUILD_ARTIFACT_ID" \
            --arg build_digest "sha256:$BUILD_ARTIFACT_DIGEST" \
            --arg managed_digest "sha256:$SOURCE_MANAGED_INSTALLER_SHA256" \
            --argjson managed_size "$SOURCE_MANAGED_INSTALLER_SIZE" \
            --arg dist_digest "sha256:$SOURCE_DIST_INSTALLER_SHA256" \
            --argjson dist_size "$SOURCE_DIST_INSTALLER_SIZE" \
            --arg arm_digest "sha256:$SOURCE_AARCH64_ARCHIVE_SHA256" \
            --argjson arm_size "$SOURCE_AARCH64_ARCHIVE_SIZE" \
            --arg intel_digest "sha256:$SOURCE_X86_64_ARCHIVE_SHA256" \
            --argjson intel_size "$SOURCE_X86_64_ARCHIVE_SIZE" '
              {
                schema_version: 1,
                tag: $tag,
                source_sha: $sha,
                workflow_run_id: $run,
                workflow_run_attempt: $attempt,
                architecture: $arch,
                build_artifact_id: $build_id,
                build_artifact_digest: $build_digest,
                managed_installer: {digest: $managed_digest, size: $managed_size},
                dist_installer: {digest: $dist_digest, size: $dist_size},
                aarch64_archive: {digest: $arm_digest, size: $arm_size},
                x86_64_archive: {digest: $intel_digest, size: $intel_size}
              }
            ' > "$VALIDATION_PROOF"
          [[ -f "$VALIDATION_PROOF" && ! -L "$VALIDATION_PROOF" &&
             -s "$VALIDATION_PROOF" && "$(wc -c < "$VALIDATION_PROOF")" -le 16384 ]]

      - name: Upload exact native validation proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tr300-macos-native-validation-${{ matrix.arch }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/tr300-macos-native-validation-${{ matrix.arch }}.json

  publish:
    name: Complete and publish the exact 34-asset GitHub Release
    needs: [build, validate, source-custody]
    runs-on: ubuntu-24.04
    environment: release-publishing
    permissions:
      actions: read
      contents: write
    steps:
      - name: Bind exact supplements, upload macOS assets, and publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          ASSET_DIRECTORY: ${{ runner.temp }}/macos-release-assets
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          MACOS_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          MACOS_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          SOURCE_MANAGED_INSTALLER_SHA256: ${{ needs.source-custody.outputs.managed_installer_sha256 }}
          SOURCE_MANAGED_INSTALLER_SIZE: ${{ needs.source-custody.outputs.managed_installer_size }}
          SOURCE_DIST_INSTALLER_SHA256: ${{ needs.source-custody.outputs.dist_installer_sha256 }}
          SOURCE_DIST_INSTALLER_SIZE: ${{ needs.source-custody.outputs.dist_installer_size }}
          SOURCE_AARCH64_ARCHIVE_SHA256: ${{ needs.source-custody.outputs.aarch64_archive_sha256 }}
          SOURCE_AARCH64_ARCHIVE_SIZE: ${{ needs.source-custody.outputs.aarch64_archive_size }}
          SOURCE_X86_64_ARCHIVE_SHA256: ${{ needs.source-custody.outputs.x86_64_archive_sha256 }}
          SOURCE_X86_64_ARCHIVE_SIZE: ${{ needs.source-custody.outputs.x86_64_archive_size }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          DISPATCH_WINDOWS_VALIDATION_RUN_ID: ${{ inputs.windows_validation_run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local tag=$1
            local object_type source_sha
            IFS=$'\t' read -r object_type source_sha < <(
              gh api "repos/$REPOSITORY/git/ref/tags/$tag" \
                --jq '.object | [.type, .sha] | @tsv'
            )
            for _ in 1 2 3 4 5; do
              case "$object_type" in
                commit)
                  printf '%s\n' "$source_sha"
                  return 0
                  ;;
                tag)
                  IFS=$'\t' read -r object_type source_sha < <(
                    gh api "repos/$REPOSITORY/git/tags/$source_sha" \
                      --jq '.object | [.type, .sha] | @tsv'
                  )
                  ;;
                *)
                  echo "release tag resolves to unsupported object type: $object_type" >&2
                  return 65
                  ;;
              esac
            done
            echo 'release tag did not resolve to a commit' >&2
            return 65
          }

          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "invalid stable release tag: $RELEASE_TAG" >&2
            exit 64
          }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'expected release SHA is malformed' >&2
            exit 65
          }
          [[ "$REPOSITORY" == QubeTX/qube-machine-report &&
             "$WORKFLOW_SHA" == "$EXPECTED_SHA" ]]
          [[ "$CURRENT_RUN_ID" =~ ^[1-9][0-9]*$ &&
             "$CURRENT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ &&
             "$MACOS_ARTIFACT_ID" =~ ^[1-9][0-9]*$ &&
             "$MACOS_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_MANAGED_INSTALLER_SHA256" =~ ^[0-9a-f]{64}$ &&
             "$SOURCE_MANAGED_INSTALLER_SIZE" =~ ^[1-9][0-9]*$ &&
             "$SOURCE_MANAGED_INSTALLER_SIZE" -le 1048576 ]]
          [[ "$SOURCE_DIST_INSTALLER_SHA256" =~ ^[0-9a-f]{64}$ &&
             "$SOURCE_DIST_INSTALLER_SIZE" =~ ^[1-9][0-9]*$ &&
             "$SOURCE_DIST_INSTALLER_SIZE" -le 1048576 ]]
          [[ "$SOURCE_AARCH64_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ &&
             "$SOURCE_AARCH64_ARCHIVE_SIZE" =~ ^[1-9][0-9]*$ &&
             "$SOURCE_AARCH64_ARCHIVE_SIZE" -le 67108864 ]]
          [[ "$SOURCE_X86_64_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ &&
             "$SOURCE_X86_64_ARCHIVE_SIZE" =~ ^[1-9][0-9]*$ &&
             "$SOURCE_X86_64_ARCHIVE_SIZE" -le 67108864 ]]

          asset_names=(
            tr300-universal-apple-darwin.pkg
            tr300-universal-apple-darwin.pkg.sha256
            tr300-universal-apple-darwin.dmg
            tr300-universal-apple-darwin.dmg.sha256
          )
          work_directory=$(mktemp -d "$RUNNER_TEMP/tr300-final-publisher.XXXXXXXX")
          trap 'rm -rf "$work_directory"' EXIT
          repository_id=$(gh api "repos/$REPOSITORY" --jq .id)
          [[ "$repository_id" =~ ^[1-9][0-9]*$ ]]
          validate_macos_artifact() {
            local path=$1
            jq -e --argjson id "$MACOS_ARTIFACT_ID" --argjson run "$CURRENT_RUN_ID" \
              --argjson repository "$repository_id" --arg digest "sha256:$MACOS_ARTIFACT_DIGEST" '
                .id == $id and .name == "tr300-universal-macos-installer" and
                .expired == false and (.size_in_bytes > 0 and .size_in_bytes <= 268435456) and
                .digest == $digest and .workflow_run.id == $run and
                .workflow_run.repository_id == $repository and
                .workflow_run.head_repository_id == $repository
              ' "$path" >/dev/null
          }
          gh api "repos/$REPOSITORY/actions/artifacts/$MACOS_ARTIFACT_ID" \
            > "$work_directory/macos-artifact-before.json"
          validate_macos_artifact "$work_directory/macos-artifact-before.json"
          macos_zip="$work_directory/macos-assets.zip"
          gh api "repos/$REPOSITORY/actions/artifacts/$MACOS_ARTIFACT_ID/zip" > "$macos_zip"
          macos_zip_hash=$(sha256sum "$macos_zip"); macos_zip_hash=${macos_zip_hash%% *}
          [[ "$macos_zip_hash" == "$MACOS_ARTIFACT_DIGEST" ]]
          mkdir -m 700 "$ASSET_DIRECTORY"
          python3 - "$macos_zip" "$ASSET_DIRECTORY" "${asset_names[@]}" <<'PY'
          import os
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          zip_path, output_path, *expected = sys.argv[1:]
          expected_names = set(expected)
          output = Path(output_path)
          with zipfile.ZipFile(zip_path) as source:
              members = source.infolist()
              names = [member.filename for member in members]
              if len(names) != len(expected_names) or set(names) != expected_names:
                  raise SystemExit(f"unexpected macOS artifact members: {names!r}")
              if sum(member.file_size for member in members) > 256 * 1024 * 1024:
                  raise SystemExit("macOS artifact expands beyond the custody limit")
              for member in members:
                  pure = PurePosixPath(member.filename)
                  mode = member.external_attr >> 16
                  if (pure.name != member.filename or pure.is_absolute() or
                      ".." in pure.parts or member.is_dir() or member.file_size <= 0 or
                      member.file_size > 256 * 1024 * 1024 or stat.S_ISLNK(mode)):
                      raise SystemExit(f"unsafe macOS artifact member: {member.filename!r}")
                  destination = output / member.filename
                  flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
                  if hasattr(os, "O_NOFOLLOW"):
                      flags |= os.O_NOFOLLOW
                  descriptor = os.open(destination, flags, 0o600)
                  try:
                      with source.open(member) as src, os.fdopen(descriptor, "wb") as dst:
                          descriptor = -1
                          shutil.copyfileobj(src, dst, length=1024 * 1024)
                  finally:
                      if descriptor >= 0:
                          os.close(descriptor)
          PY
          gh api "repos/$REPOSITORY/actions/artifacts/$MACOS_ARTIFACT_ID" \
            > "$work_directory/macos-artifact-after.json"
          validate_macos_artifact "$work_directory/macos-artifact-after.json"
          cmp "$work_directory/macos-artifact-before.json" "$work_directory/macos-artifact-after.json"

          # Both native architectures must have validated this exact build
          # artifact and the exact source-rendered managed-install chain. Bind
          # each proof by current run attempt, immutable artifact ID/API digest,
          # ZIP bytes, safe member inventory, and typed proof contents.
          proof_inventory="$work_directory/native-validation-proofs.json"
          gh api "repos/$REPOSITORY/actions/runs/$CURRENT_RUN_ID/artifacts?per_page=100" \
            > "$proof_inventory"
          proof_total=$(jq -r .total_count "$proof_inventory")
          proof_returned=$(jq -r '.artifacts | length' "$proof_inventory")
          [[ "$proof_total" =~ ^[0-9]+$ && "$proof_total" -le 100 &&
             "$proof_returned" == "$proof_total" ]]
          proof_artifact_record() {
            local inventory=$1
            local name=$2
            jq -er --arg name "$name" '
              [.artifacts[] | select(.name == $name)] |
              if length != 1 then error("expected exactly one native proof artifact named " + $name)
              else .[0] |
                [.id, .name, .digest, .expired, .size_in_bytes,
                 .workflow_run.id, .workflow_run.repository_id,
                 .workflow_run.head_repository_id, .workflow_run.head_sha] | @tsv
              end
            ' "$inventory"
          }
          direct_proof_record() {
            jq -r '
              [.id, .name, .digest, .expired, .size_in_bytes,
               .workflow_run.id, .workflow_run.repository_id,
               .workflow_run.head_repository_id, .workflow_run.head_sha] | @tsv
            ' "$1"
          }
          validate_native_proof() {
            local path=$1
            local arch=$2
            jq -e \
              --arg tag "$RELEASE_TAG" --arg sha "$EXPECTED_SHA" \
              --argjson run "$CURRENT_RUN_ID" \
              --argjson attempt "$CURRENT_RUN_ATTEMPT" \
              --arg arch "$arch" \
              --argjson build_id "$MACOS_ARTIFACT_ID" \
              --arg build_digest "sha256:$MACOS_ARTIFACT_DIGEST" \
              --arg managed_digest "sha256:$SOURCE_MANAGED_INSTALLER_SHA256" \
              --argjson managed_size "$SOURCE_MANAGED_INSTALLER_SIZE" \
              --arg dist_digest "sha256:$SOURCE_DIST_INSTALLER_SHA256" \
              --argjson dist_size "$SOURCE_DIST_INSTALLER_SIZE" \
              --arg arm_digest "sha256:$SOURCE_AARCH64_ARCHIVE_SHA256" \
              --argjson arm_size "$SOURCE_AARCH64_ARCHIVE_SIZE" \
              --arg intel_digest "sha256:$SOURCE_X86_64_ARCHIVE_SHA256" \
              --argjson intel_size "$SOURCE_X86_64_ARCHIVE_SIZE" '
                .schema_version == 1 and .tag == $tag and .source_sha == $sha and
                .workflow_run_id == $run and .workflow_run_attempt == $attempt and
                .architecture == $arch and .build_artifact_id == $build_id and
                .build_artifact_digest == $build_digest and
                .managed_installer == {digest: $managed_digest, size: $managed_size} and
                .dist_installer == {digest: $dist_digest, size: $dist_size} and
                .aarch64_archive == {digest: $arm_digest, size: $arm_size} and
                .x86_64_archive == {digest: $intel_digest, size: $intel_size} and
                (keys | sort) == (["aarch64_archive", "architecture", "build_artifact_digest",
                  "build_artifact_id", "dist_installer", "managed_installer", "schema_version",
                  "source_sha", "tag", "workflow_run_attempt", "workflow_run_id",
                  "x86_64_archive"] | sort)
              ' "$path" >/dev/null
          }
          for arch in arm64 x86_64; do
            proof_name="tr300-macos-native-validation-${arch}-${CURRENT_RUN_ATTEMPT}"
            proof_file="tr300-macos-native-validation-${arch}.json"
            proof_before=$(proof_artifact_record "$proof_inventory" "$proof_name")
            IFS=$'\t' read -r proof_id returned_name proof_digest proof_expired \
              proof_size proof_run proof_repository proof_head_repository proof_sha \
              <<< "$proof_before"
            [[ "$proof_id" =~ ^[1-9][0-9]*$ && "$returned_name" == "$proof_name" &&
               "$proof_digest" =~ ^sha256:[0-9a-f]{64}$ && "$proof_expired" == false &&
               "$proof_size" =~ ^[1-9][0-9]*$ && "$proof_size" -le 1048576 &&
               "$proof_run" == "$CURRENT_RUN_ID" &&
               "$proof_repository" == "$repository_id" &&
               "$proof_head_repository" == "$repository_id" &&
               "$proof_sha" == "$EXPECTED_SHA" ]]
            proof_metadata="$work_directory/${arch}-proof-before.json"
            gh api "repos/$REPOSITORY/actions/artifacts/$proof_id" > "$proof_metadata"
            [[ "$(direct_proof_record "$proof_metadata")" == "$proof_before" ]]
            proof_zip="$work_directory/${arch}-proof.zip"
            gh api "repos/$REPOSITORY/actions/artifacts/$proof_id/zip" > "$proof_zip"
            proof_zip_sha=$(sha256sum "$proof_zip"); proof_zip_sha=${proof_zip_sha%% *}
            [[ "sha256:$proof_zip_sha" == "$proof_digest" ]]
            proof_directory="$work_directory/${arch}-proof"
            mkdir -m 700 "$proof_directory"
            python3 - "$proof_zip" "$proof_directory" "$proof_file" <<'PY'
          import os
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          zip_path, output_path, expected = sys.argv[1:]
          output = Path(output_path)
          with zipfile.ZipFile(zip_path) as source:
              members = source.infolist()
              names = [member.filename for member in members]
              if names != [expected]:
                  raise SystemExit(f"unexpected native proof members: {names!r}")
              member = members[0]
              pure = PurePosixPath(member.filename)
              mode = member.external_attr >> 16
              if (
                  pure.name != member.filename
                  or pure.is_absolute()
                  or ".." in pure.parts
                  or member.is_dir()
                  or member.file_size <= 0
                  or member.file_size > 16384
                  or stat.S_ISLNK(mode)
              ):
                  raise SystemExit(f"unsafe native proof member: {member.filename!r}")
              destination = output / member.filename
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(destination, flags, 0o600)
              try:
                  with source.open(member) as src, os.fdopen(descriptor, "wb") as dst:
                      descriptor = -1
                      shutil.copyfileobj(src, dst, length=16384)
              finally:
                  if descriptor >= 0:
                      os.close(descriptor)
          PY
            validate_native_proof "$proof_directory/$proof_file" "$arch"
            proof_after_metadata="$work_directory/${arch}-proof-after.json"
            gh api "repos/$REPOSITORY/actions/artifacts/$proof_id" \
              > "$proof_after_metadata"
            [[ "$(direct_proof_record "$proof_after_metadata")" == "$proof_before" ]]
          done

          declare -A expected_names=()
          for name in "${asset_names[@]}"; do
            expected_names["$name"]=1
          done
          mapfile -d '' -t entries < <(
            find "$ASSET_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          [[ ${#entries[@]} -eq ${#asset_names[@]} ]] || {
            echo 'macOS artifact does not contain exactly four entries' >&2
            exit 66
          }
          for path in "${entries[@]}"; do
            name=${path##*/}
            [[ -n ${expected_names[$name]+present} && -f "$path" && ! -L "$path" && -s "$path" ]] || {
              echo "unexpected, empty, or non-regular macOS artifact entry: $name" >&2
              exit 66
            }
            unset 'expected_names[$name]'
          done
          [[ ${#expected_names[@]} -eq 0 ]] || {
            echo 'macOS artifact is missing a required file' >&2
            exit 66
          }

          for payload_name in \
            tr300-universal-apple-darwin.pkg \
            tr300-universal-apple-darwin.dmg
          do
