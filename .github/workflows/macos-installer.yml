          validation_proof="$validation_proof_directory/windows-installer-validation.json"
          validation_manifest="$validation_proof_directory/validation-input-manifest.json"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$EXPECTED_SHA" \
