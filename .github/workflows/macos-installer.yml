          windows_zip="$work_directory/windows-assets.zip"
          gh api "repos/$REPOSITORY/actions/artifacts/$windows_artifact_id/zip" > "$windows_zip"
          windows_zip_hash=$(sha256sum "$windows_zip"); windows_zip_hash=${windows_zip_hash%% *}
          [[ "sha256:$windows_zip_hash" == "$windows_artifact_digest" ]]
          windows_names=(
            tr300-x86_64-pc-windows-msvc-corporate.msi
            tr300-x86_64-pc-windows-msvc-corporate.msi.sha256
            tr300-x86_64-pc-windows-msvc-setup.exe
            tr300-x86_64-pc-windows-msvc-setup.exe.sha256
            tr300-x86_64-pc-windows-msvc-corporate-setup.exe
            tr300-x86_64-pc-windows-msvc-corporate-setup.exe.sha256
          )
          windows_directory="$work_directory/windows-assets"
          mkdir -m 700 "$windows_directory"
          python3 - "$windows_zip" "$windows_directory" "${windows_names[@]}" <<'PY'
          import os, shutil, stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          archive, output, *expected = sys.argv[1:]
          with zipfile.ZipFile(archive) as source:
              members = source.infolist()
              if len(members) != len(expected) or {m.filename for m in members} != set(expected):
                  raise SystemExit("unexpected Windows supplement inventory")
