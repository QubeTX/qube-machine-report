          PY
          gh api "repos/$REPOSITORY/actions/artifacts/$validation_proof_artifact_id" \
            > "$work_directory/validation-proof-artifact-after.json"
          validate_validation_proof_artifact "$work_directory/validation-proof-artifact-after.json"
          cmp "$work_directory/validation-proof-artifact-before.json" \
            "$work_directory/validation-proof-artifact-after.json"

          validation_proof="$validation_proof_directory/windows-installer-validation.json"
          validation_manifest="$validation_proof_directory/validation-input-manifest.json"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$EXPECTED_SHA" \
            --argjson windows_run "$windows_run_id" \
            --argjson windows_attempt "$windows_run_attempt" \
            --argjson windows_artifact "$windows_artifact_id" \
            --arg windows_digest "$windows_artifact_digest" \
            --argjson validation_run "$validation_run_id" \
            --argjson validation_attempt "$validation_run_attempt" '
              .schema_version == 1 and .result == "success" and .tag == $tag and
              .source_sha == $sha and .windows_run_id == $windows_run and
              .windows_run_attempt == $windows_attempt and
              .windows_artifact_id == $windows_artifact and
