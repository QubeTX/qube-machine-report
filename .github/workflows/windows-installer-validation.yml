name: Windows Installer Validation

# Automatic macOS follow-up accepts only the normal tag-chain workflow_run.
# Tagless credential preflights therefore skip cleanly instead of producing a
# false red validation run. After a manually dispatched macOS publication
# recovery, use this workflow's explicit public recovery dispatch with that
# exact upstream run ID.
on:
  workflow_run:
    workflows: ["Windows Installers", "macOS Universal Package"]
    types: [completed]
  workflow_dispatch:
    inputs:
      validation_mode:
        description: "Private draft acceptance or post-public updater smoke"
        required: true
        default: private
        type: choice
        options:
          - private
          - public
      tag:
        description: "Release tag to validate (for example vX.Y.Z)"
        required: true
        type: string
      upstream_run_id:
        description: "Exact successful Windows Installers or macOS finalizer run ID"
        required: true
        type: string

concurrency:
  group: windows-installer-validation-${{ github.event.workflow_run.head_sha || inputs.tag || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    name: Resolve exact release state
    if: |
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.repository == 'QubeTX/qube-machine-report' &&
       github.actor_id == '30877743') ||
      (github.event.workflow_run.conclusion == 'success' &&
       ((github.event.workflow_run.name == 'Windows Installers' &&
         (github.event.workflow_run.event == 'workflow_run' ||
          github.event.workflow_run.event == 'workflow_dispatch')) ||
        (github.event.workflow_run.name == 'macOS Universal Package' &&
         github.event.workflow_run.event == 'workflow_run')) &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    # Draft releases are omitted from the REST collection unless the caller
    # has push access. This no-checkout resolver uses the write-scoped token
    # only to authenticate the exact private release identity.
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      previous_version: ${{ steps.release.outputs.previous_version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_id: ${{ steps.release.outputs.release_id }}
      validation_mode: ${{ steps.release.outputs.validation_mode }}
      upstream_run_id: ${{ steps.release.outputs.upstream_run_id }}
      upstream_run_attempt: ${{ steps.release.outputs.upstream_run_attempt }}
    steps:
      - name: Resolve tag and require every Windows family
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.validation_mode }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          ACTOR_ID: ${{ github.actor_id }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          validate_upstream_run() {
            local run_id=$1
            local expected_attempt=$2
            local workflow_file=$3
            local expected_name=$4
            local trusted_workflow_id actual_id workflow_id run_name run_path event
            local status conclusion repository head_repository head_branch head_sha actual_attempt
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
            [[ -z "$expected_attempt" || "$expected_attempt" =~ ^[1-9][0-9]*$ ]]
            trusted_workflow_id=$(gh api \
              "repos/$EXPECTED_REPOSITORY/actions/workflows/$workflow_file" --jq .id)
            [[ "$trusted_workflow_id" =~ ^[1-9][0-9]*$ ]]
            IFS=$'\t' read -r actual_id workflow_id run_name run_path event status conclusion \
              repository head_repository head_branch head_sha actual_attempt < <(
                gh api "repos/$EXPECTED_REPOSITORY/actions/runs/$run_id" \
                  --jq '[.id, .workflow_id, .name, .path, .event, .status, .conclusion, .repository.full_name, .head_repository.full_name, .head_branch, .head_sha, .run_attempt] | @tsv'
              )
            [[ "$actual_id" == "$run_id" && "$workflow_id" == "$trusted_workflow_id" &&
               "$run_name" == "$expected_name" &&
               "$run_path" == ".github/workflows/$workflow_file" &&
               ("$event" == workflow_run || "$event" == workflow_dispatch) &&
               "$status" == completed && "$conclusion" == success &&
               "$repository" == "$EXPECTED_REPOSITORY" &&
               "$head_repository" == "$EXPECTED_REPOSITORY" && "$head_branch" == main &&
               "$head_sha" =~ ^[0-9a-f]{40}$ && "$actual_attempt" =~ ^[1-9][0-9]*$ ]]
            [[ -z "$expected_attempt" || "$actual_attempt" == "$expected_attempt" ]]
            validated_head_sha=$head_sha
            validated_run_attempt=$actual_attempt
          }

          resolve_tag_commit() {
            local tag=$1
            local object_type source_sha
            IFS=$'\t' read -r object_type source_sha < <(
              gh api "repos/$EXPECTED_REPOSITORY/git/ref/tags/$tag" \
                --jq '.object | [.type, .sha] | @tsv'
            )
            for _ in 1 2 3 4 5; do
              case "$object_type" in
                commit)
                  printf '%s\n' "$source_sha"
                  return 0
                  ;;
                tag)
                  IFS=$'\t' read -r object_type source_sha < <(
                    gh api "repos/$EXPECTED_REPOSITORY/git/tags/$source_sha" \
                      --jq '.object | [.type, .sha] | @tsv'
                  )
                  ;;
                *)
                  echo "release tag resolves to unsupported object type: $object_type" >&2
                  return 65
                  ;;
              esac
            done
            echo 'release tag did not resolve to a commit' >&2
            return 65
          }

          require_release_target() {
            local tag=$1
            local source_sha=$2
            local release_target
            release_target=$(
              gh api "repos/$EXPECTED_REPOSITORY/releases/tags/$tag" \
                --jq .target_commitish
            )
            [[ "$release_target" =~ ^[0-9a-f]{40}$ ]] || {
              echo "release $tag does not record an immutable target commit" >&2
              return 65
            }
            [[ "$release_target" == "$source_sha" ]] || {
              echo "release $tag targets $release_target, not tag commit $source_sha" >&2
              return 65
            }
          }

          repo=$EXPECTED_REPOSITORY
          expected_sha=''
          release_id=''
          release_target=''
          release_draft=''
          release_prerelease=''
          private_release_pages="$RUNNER_TEMP/windows-private-release-pages.json"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_REPOSITORY" == QubeTX/qube-machine-report &&
               "$ACTOR_ID" == 30877743 && "$WORKFLOW_REF" == refs/heads/main ]]
            main_sha=$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)
            [[ "$main_sha" =~ ^[0-9a-f]{40}$ && "$WORKFLOW_SHA" == "$main_sha" ]]
            validation_mode=$DISPATCH_MODE
            [[ "$validation_mode" == private || "$validation_mode" == public ]]
            tag=$DISPATCH_TAG
            upstream_run_id=$DISPATCH_UPSTREAM_RUN_ID
            if [[ "$validation_mode" == private ]]; then
              validate_upstream_run "$upstream_run_id" '' windows-installers.yml "Windows Installers"
            else
              validate_upstream_run "$upstream_run_id" '' macos-installer.yml "macOS Universal Package"
            fi
            upstream_run_attempt=$validated_run_attempt
            expected_sha=$validated_head_sha
          else
            [[ "$UPSTREAM_CONCLUSION" == success ]] || {
              echo 'upstream release-chain workflow did not succeed' >&2
              exit 65
            }
            [[ "$UPSTREAM_EVENT" == workflow_run || "$UPSTREAM_EVENT" == workflow_dispatch ]] || {
              echo "refusing upstream event: $UPSTREAM_EVENT" >&2
              exit 65
            }
            [[ "$UPSTREAM_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || {
              echo "refusing upstream repository: $UPSTREAM_REPOSITORY" >&2
              exit 65
            }
            [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'upstream workflow SHA is malformed' >&2
              exit 65
            }
            case "$UPSTREAM_WORKFLOW_NAME" in
              "Windows Installers")
                validation_mode=private
                validate_upstream_run "$UPSTREAM_RUN_ID" "$UPSTREAM_RUN_ATTEMPT" \
                  windows-installers.yml "Windows Installers"
                ;;
              "macOS Universal Package")
                validation_mode=public
                validate_upstream_run "$UPSTREAM_RUN_ID" "$UPSTREAM_RUN_ATTEMPT" \
                  macos-installer.yml "macOS Universal Package"
                ;;
              *)
                echo "refusing upstream workflow: $UPSTREAM_WORKFLOW_NAME" >&2
                exit 65
                ;;
            esac
            [[ "$validated_head_sha" == "$UPSTREAM_SHA" ]]
            upstream_run_id=$UPSTREAM_RUN_ID
            upstream_run_attempt=$validated_run_attempt
            expected_sha=$UPSTREAM_SHA
            if [[ "$validation_mode" == private ]]; then
              gh api --paginate --slurp "repos/$repo/releases?per_page=100" \
                > "$private_release_pages"
              mapfile -t private_candidates < <(
                jq -r --arg sha "$expected_sha" '
                  .[][] |
                  select(.target_commitish == $sha and .draft == true and
                         .prerelease == false) |
                  [.id, .tag_name, .target_commitish, .draft, .prerelease] | @tsv
                ' "$private_release_pages"
              )
              [[ ${#private_candidates[@]} -eq 1 ]] || {
                echo "expected one private release targeting upstream SHA $expected_sha; found ${#private_candidates[@]}" >&2
                exit 65
              }
              IFS=$'\t' read -r release_id tag release_target release_draft release_prerelease \
                <<< "${private_candidates[0]}"
            else
              mapfile -t tags < <(
                gh api "repos/$repo/releases?per_page=100" \
                  --jq ".[] | select(.target_commitish == \"$expected_sha\") | .tag_name"
              )
              if [[ ${#tags[@]} -ne 1 ]]; then
                echo "expected one release targeting upstream SHA $expected_sha; found ${#tags[@]}" >&2
                exit 65
              fi
              tag=${tags[0]}
            fi
          fi
          if [[ "$validation_mode" == private ]]; then
            if [[ ! -s "$private_release_pages" ]]; then
              gh api --paginate --slurp "repos/$repo/releases?per_page=100" \
                > "$private_release_pages"
            fi
            mapfile -t private_tag_records < <(
              jq -r --arg tag "$tag" '
                .[][] | select(.tag_name == $tag) |
                [.id, .target_commitish, .draft, .prerelease] | @tsv
              ' "$private_release_pages"
            )
            [[ ${#private_tag_records[@]} -eq 1 ]] || {
              echo "expected one private release record for $tag; found ${#private_tag_records[@]}" >&2
              exit 65
            }
            IFS=$'\t' read -r release_id release_target release_draft release_prerelease \
              <<< "${private_tag_records[0]}"
            [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "release $tag does not expose a positive numeric ID" >&2
              exit 65
            }
            [[ "$release_target" =~ ^[0-9a-f]{40}$ &&
               "$release_target" == "$expected_sha" &&
               "$release_draft" == true && "$release_prerelease" == false ]] || {
              echo "release $tag is not the exact private stable draft for $expected_sha" >&2
              exit 65
            }
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "invalid stable release tag: $tag" >&2
            exit 64
          }
          source_sha=$(resolve_tag_commit "$tag")
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release tag did not resolve to a commit' >&2
            exit 65
          }
          if [[ "$validation_mode" == private ]]; then
            [[ "$release_target" == "$source_sha" ]] || {
              echo "release $tag targets $release_target, not tag commit $source_sha" >&2
              exit 65
            }
          else
            require_release_target "$tag" "$source_sha"
          fi
          main_sha=$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)
          [[ "$main_sha" == "$source_sha" ]]
          if [[ -n "$expected_sha" && "$source_sha" != "$expected_sha" ]]; then
            echo "release tag $tag targets $source_sha, not upstream SHA $expected_sha" >&2
            exit 65
          fi
          if [[ "$validation_mode" == private ]]; then
            gh api "repos/$repo/releases/$release_id" \
              > "$RUNNER_TEMP/windows-private-release.json"
            jq -e --argjson id "$release_id" --arg tag "$tag" --arg sha "$source_sha" '
              .id == $id and .tag_name == $tag and .target_commitish == $sha and
              .draft == true and .prerelease == false and (.assets | length) == 30
            ' "$RUNNER_TEMP/windows-private-release.json" >/dev/null
            assets=$(jq -r '.assets[].name' "$RUNNER_TEMP/windows-private-release.json")
          else
            assets=$(gh release view "$tag" --repo "$repo" \
              --json assets --jq '.assets[].name')
            IFS=$'\t' read -r release_draft release_prerelease asset_count < <(
              gh api "repos/$repo/releases/tags/$tag" \
                --jq '[.draft, .prerelease, (.assets | length)] | @tsv'
            )
            [[ "$release_draft" == false && "$release_prerelease" == false && "$asset_count" == 34 ]]
            [[ "$(gh api "repos/$repo/releases/latest" --jq .tag_name)" == "$tag" ]]
          fi
          current_required=(
            tr300-x86_64-pc-windows-msvc.msi
            tr300-x86_64-pc-windows-msvc-corporate.msi
            tr300-x86_64-pc-windows-msvc-setup.exe
            tr300-x86_64-pc-windows-msvc-corporate-setup.exe
            tr300-installer.ps1
            tr300-dist-installer.ps1
            tr300-x86_64-pc-windows-msvc.zip
          )
          previous_required=(
            tr300-x86_64-pc-windows-msvc.msi
            tr300-x86_64-pc-windows-msvc-corporate.msi
            tr300-x86_64-pc-windows-msvc-setup.exe
            tr300-x86_64-pc-windows-msvc-corporate-setup.exe
            tr300-installer.ps1
            tr300-x86_64-pc-windows-msvc.zip
          )
          for asset in "${current_required[@]}"; do
            grep -Fqx "$asset" <<< "$assets" || {
              echo "release is incomplete; missing $asset" >&2
              exit 1
            }
          done
          if [[ "$validation_mode" == private ]]; then
            previous_tag=$(gh api "repos/$repo/releases/latest" --jq .tag_name)
            [[ "$previous_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ &&
               "$previous_tag" != "$tag" ]]
          else
            mapfile -t candidates < <(
              gh api "repos/$repo/releases?per_page=100" --jq \
                ".[] | select(.draft == false and .prerelease == false and .tag_name != \"$tag\") | .tag_name" |
                sort -Vr
            )
            previous_tag=''
            for candidate in "${candidates[@]}"; do
              [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
              candidate_assets=$(gh release view "$candidate" --repo "$repo" \
                --json assets --jq '.assets[].name')
              complete=true
              for asset in "${previous_required[@]}"; do
                grep -Fqx "$asset" <<< "$candidate_assets" || complete=false
              done
              if [[ "$complete" == true ]]; then
                previous_tag=$candidate
                break
              fi
            done
            [[ -n "$previous_tag" ]]
          fi
          highest=$(printf '%s\n%s\n' "${previous_tag#v}" "${tag#v}" | sort -V | tail -n 1)
          [[ "$highest" == "${tag#v}" ]]
          previous_assets=$(gh release view "$previous_tag" --repo "$repo" \
            --json assets --jq '.assets[].name')
          for asset in "${previous_required[@]}"; do
            grep -Fqx "$asset" <<< "$previous_assets" || {
              echo "previous public release is incomplete; missing $asset" >&2
              exit 1
            }
          done
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "previous_tag=$previous_tag"
            echo "previous_version=${previous_tag#v}"
            echo "source_sha=$source_sha"
            echo "release_id=$release_id"
            echo "validation_mode=$validation_mode"
            echo "upstream_run_id=$upstream_run_id"
            echo "upstream_run_attempt=$upstream_run_attempt"
          } >> "$GITHUB_OUTPUT"

  prepare-validation-inputs:
    name: Freeze exact release bytes for Windows validation
    needs: resolve
    runs-on: ubuntu-24.04
    # This no-checkout freezer must read and download the authenticated draft;
    # later matrix jobs consume only its immutable internal artifact.
    permissions:
      actions: read
      contents: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      windows_artifact_id: ${{ steps.freeze.outputs.windows_artifact_id }}
      windows_artifact_digest: ${{ steps.freeze.outputs.windows_artifact_digest }}
    steps:
      - name: Download, verify, and bind the exact release inventory
        id: freeze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
          VALIDATION_MODE: ${{ needs.resolve.outputs.validation_mode }}
          UPSTREAM_RUN_ID: ${{ needs.resolve.outputs.upstream_run_id }}
          UPSTREAM_RUN_ATTEMPT: ${{ needs.resolve.outputs.upstream_run_attempt }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/windows-validation-inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == QubeTX/qube-machine-report ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ &&
             "$UPSTREAM_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$VALIDATION_MODE" == private || "$VALIDATION_MODE" == public ]]
          if [[ "$VALIDATION_MODE" == private ]]; then
            [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
            release_api="repos/$REPOSITORY/releases/$RELEASE_ID"
          else
            [[ -z "$RELEASE_ID" ]]
            release_api="repos/$REPOSITORY/releases/tags/$RELEASE_TAG"
          fi

          initial_names=(
            dist-manifest.json sha256.sum source.tar.gz source.tar.gz.sha256
            tr-300-installer.ps1 tr-300-installer.sh
            tr300-aarch64-apple-darwin.tar.xz tr300-aarch64-apple-darwin.tar.xz.sha256
            tr300-aarch64-unknown-linux-gnu.tar.xz tr300-aarch64-unknown-linux-gnu.tar.xz.sha256
            tr300-dist-installer.ps1 tr300-dist-installer.sh tr300-installer.ps1 tr300-installer.sh
            tr300-x86_64-apple-darwin.tar.xz tr300-x86_64-apple-darwin.tar.xz.sha256
            tr300-x86_64-pc-windows-msvc.msi tr300-x86_64-pc-windows-msvc.msi.sha256
            tr300-x86_64-pc-windows-msvc.zip tr300-x86_64-pc-windows-msvc.zip.sha256
            tr300-x86_64-unknown-linux-gnu.tar.xz tr300-x86_64-unknown-linux-gnu.tar.xz.sha256
            tr300-x86_64-unknown-linux-musl.tar.xz tr300-x86_64-unknown-linux-musl.tar.xz.sha256
          )
          windows_names=(
            tr300-x86_64-pc-windows-msvc-corporate.msi
            tr300-x86_64-pc-windows-msvc-corporate.msi.sha256
            tr300-x86_64-pc-windows-msvc-setup.exe
            tr300-x86_64-pc-windows-msvc-setup.exe.sha256
            tr300-x86_64-pc-windows-msvc-corporate-setup.exe
            tr300-x86_64-pc-windows-msvc-corporate-setup.exe.sha256
          )
          macos_names=(
            tr300-universal-apple-darwin.pkg
            tr300-universal-apple-darwin.pkg.sha256
            tr300-universal-apple-darwin.dmg
            tr300-universal-apple-darwin.dmg.sha256
          )
          expected_names=("${initial_names[@]}" "${windows_names[@]}")
          expected_draft=true
          if [[ "$VALIDATION_MODE" == public ]]; then
            expected_names+=("${macos_names[@]}")
            expected_draft=false
          fi
          expected_count=${#expected_names[@]}
          expected_names_json=$(printf '%s\n' "${expected_names[@]}" | jq -R . | jq -s 'sort')

          work_directory=$(mktemp -d "$RUNNER_TEMP/tr300-windows-validation-prep.XXXXXXXX")
          trap 'rm -rf "$work_directory"' EXIT
          mkdir -m 700 "$OUTPUT_DIRECTORY"
          gh api "$release_api" > "$work_directory/release-before.json"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" \
            --argjson draft "$expected_draft" \
            --argjson names "$expected_names_json" '
              .tag_name == $tag and .target_commitish == $sha and
              .draft == $draft and .prerelease == false and
              ([.assets[].name] | sort) == $names and
              ([.assets[] | (.id | type == "number") and (.size > 0) and
                (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))] | all)
            ' "$work_directory/release-before.json" >/dev/null
          if [[ "$VALIDATION_MODE" == private ]]; then
            jq -e --argjson id "$RELEASE_ID" '.id == $id' \
              "$work_directory/release-before.json" >/dev/null
          fi

          # Draft browser/tag URLs are intentionally unavailable. Download each
          # exact asset through its numeric API identity while this no-checkout
          # freezer holds the narrowly scoped draft-visible token.
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
            gh api -H 'Accept: application/octet-stream' \
              "repos/$REPOSITORY/releases/assets/$asset_id" \
              > "$OUTPUT_DIRECTORY/$asset_name"
          done < <(
            jq -r '.assets | sort_by(.name)[] | [.id, .name] | @tsv' \
              "$work_directory/release-before.json"
          )
          mapfile -d '' -t downloaded < <(find "$OUTPUT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0)
          [[ ${#downloaded[@]} -eq "$expected_count" ]]
          declare -A expected_by_name=()
          for name in "${expected_names[@]}"; do expected_by_name["$name"]=1; done
          for path in "${downloaded[@]}"; do
            name=${path##*/}
            [[ -n ${expected_by_name[$name]+present} && -f "$path" && ! -L "$path" && -s "$path" ]]
            unset 'expected_by_name[$name]'
          done
          [[ ${#expected_by_name[@]} -eq 0 ]]
          while IFS=$'\t' read -r name digest size; do
            [[ "$digest" =~ ^sha256:([0-9a-f]{64})$ ]]
            downloaded_digest=${BASH_REMATCH[1]}
            [[ "$size" =~ ^[1-9][0-9]*$ ]]
            path="$OUTPUT_DIRECTORY/$name"
            [[ "$(stat -c %s "$path")" == "$size" ]]
            actual=$(sha256sum "$path"); actual=${actual%% *}
            [[ "$actual" == "$downloaded_digest" ]]
          done < <(jq -r '.assets[] | [.name, .digest, .size] | @tsv' "$work_directory/release-before.json")
          shell_dist_sha256=$(jq -er '
            [.assets[] | select(.name == "tr300-dist-installer.sh")] as $records |
            if ($records | length) == 1 then
              $records[0].digest | sub("^sha256:"; "")
            else error("unexpected shell cargo-dist asset count") end
          ' "$work_directory/release-before.json")
          powershell_dist_sha256=$(jq -er '
            [.assets[] | select(.name == "tr300-dist-installer.ps1")] as $records |
            if ($records | length) == 1 then
              $records[0].digest | sub("^sha256:"; "")
            else error("unexpected PowerShell cargo-dist asset count") end
          ' "$work_directory/release-before.json")
          [[ "$shell_dist_sha256" =~ ^[0-9a-f]{64}$ &&
             "$powershell_dist_sha256" =~ ^[0-9a-f]{64}$ ]]
          grep -Fqx "tr300_dist_installer_sha256='${shell_dist_sha256}'" \
            "$OUTPUT_DIRECTORY/tr300-installer.sh"
          grep -Fqx \
            "\$Tr300DistInstallerSha256 = '${powershell_dist_sha256}'" \
            "$OUTPUT_DIRECTORY/tr300-installer.ps1"
          if grep -Fq '@TR300_' "$OUTPUT_DIRECTORY/tr300-installer.sh" \
            "$OUTPUT_DIRECTORY/tr300-installer.ps1"; then
            echo 'managed wrapper placeholder survived release rendering' >&2
            exit 65
          fi
          (
            cd "$OUTPUT_DIRECTORY"
            sha256sum -c sha256.sum
            for sidecar in ./*.sha256; do sha256sum -c "${sidecar#./}"; done
          )

          windows_artifact_id=''
          windows_artifact_digest=''
          if [[ "$VALIDATION_MODE" == private ]]; then
            gh api "repos/$REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/artifacts?per_page=100" \
              > "$work_directory/windows-artifacts.json"
            mapfile -t records < <(
              jq -r '.artifacts[] | select(.name == "windows-release-assets" and .expired == false) |
                [.id, .digest] | @tsv' "$work_directory/windows-artifacts.json"
            )
            [[ ${#records[@]} -eq 1 ]]
            IFS=$'\t' read -r windows_artifact_id windows_artifact_digest <<< "${records[0]}"
            [[ "$windows_artifact_id" =~ ^[1-9][0-9]*$ &&
               "$windows_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            gh api "repos/$REPOSITORY/actions/artifacts/$windows_artifact_id" \
              > "$work_directory/windows-artifact-before.json"
            repository_id=$(gh api "repos/$REPOSITORY" --jq .id)
            jq -e --argjson id "$windows_artifact_id" --argjson run "$UPSTREAM_RUN_ID" \
              --argjson repository "$repository_id" --arg digest "$windows_artifact_digest" \
              --arg sha "$SOURCE_SHA" '
                .id == $id and .name == "windows-release-assets" and .expired == false and
                (.size_in_bytes > 0 and .size_in_bytes <= 268435456) and .digest == $digest and
                .workflow_run.id == $run and .workflow_run.repository_id == $repository and
                .workflow_run.head_repository_id == $repository and .workflow_run.head_sha == $sha
              ' "$work_directory/windows-artifact-before.json" >/dev/null
            gh api "repos/$REPOSITORY/actions/artifacts/$windows_artifact_id/zip" \
              > "$work_directory/windows-assets.zip"
            zip_hash=$(sha256sum "$work_directory/windows-assets.zip"); zip_hash=${zip_hash%% *}
            [[ "sha256:$zip_hash" == "$windows_artifact_digest" ]]
            mkdir -m 700 "$work_directory/windows-assets"
            python3 - "$work_directory/windows-assets.zip" "$work_directory/windows-assets" \
              "${windows_names[@]}" <<'PY'
          import os, shutil, stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          archive, output, *expected = sys.argv[1:]
          with zipfile.ZipFile(archive) as source:
              members = source.infolist()
              if len(members) != len(expected) or {m.filename for m in members} != set(expected):
                  raise SystemExit("unexpected Windows builder artifact inventory")
              for member in members:
                  pure = PurePosixPath(member.filename)
                  mode = member.external_attr >> 16
                  if (pure.name != member.filename or pure.is_absolute() or ".." in pure.parts or
                      member.is_dir() or member.file_size <= 0 or member.file_size > 268435456 or
                      stat.S_ISLNK(mode)):
                      raise SystemExit("unsafe Windows builder artifact member")
                  destination = Path(output) / member.filename
                  flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
                  if hasattr(os, "O_NOFOLLOW"): flags |= os.O_NOFOLLOW
                  descriptor = os.open(destination, flags, 0o600)
                  with source.open(member) as src, os.fdopen(descriptor, "wb") as dst:
                      shutil.copyfileobj(src, dst, length=1024 * 1024)
          PY
            for name in "${windows_names[@]}"; do
              cmp "$work_directory/windows-assets/$name" "$OUTPUT_DIRECTORY/$name"
            done
            gh api "repos/$REPOSITORY/actions/artifacts/$windows_artifact_id" \
              > "$work_directory/windows-artifact-after.json"
            cmp "$work_directory/windows-artifact-before.json" "$work_directory/windows-artifact-after.json"
          fi

          jq --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" --arg mode "$VALIDATION_MODE" \
            --argjson upstream_run_id "$UPSTREAM_RUN_ID" \
            --argjson upstream_run_attempt "$UPSTREAM_RUN_ATTEMPT" \
            --arg windows_artifact_id "$windows_artifact_id" \
            --arg windows_artifact_digest "$windows_artifact_digest" '
              {
                schema_version: 1,
                tag: $tag,
                source_sha: $sha,
                validation_mode: $mode,
                upstream_run_id: $upstream_run_id,
                upstream_run_attempt: $upstream_run_attempt,
                windows_artifact_id: (if $windows_artifact_id == "" then null else ($windows_artifact_id | tonumber) end),
                windows_artifact_digest: (if $windows_artifact_digest == "" then null else $windows_artifact_digest end),
                release_assets: ([.assets[] | {id, name, size, digest}] | sort_by(.name))
              }
            ' "$work_directory/release-before.json" > "$OUTPUT_DIRECTORY/validation-input-manifest.json"

          gh api "$release_api" > "$work_directory/release-after.json"
          jq -S '{id, tag_name, target_commitish, draft, prerelease,
            assets: ([.assets[] | {id, name, size, digest}] | sort_by(.name))}' \
            "$work_directory/release-before.json" > "$work_directory/release-before.normalized.json"
          jq -S '{id, tag_name, target_commitish, draft, prerelease,
            assets: ([.assets[] | {id, name, size, digest}] | sort_by(.name))}' \
            "$work_directory/release-after.json" > "$work_directory/release-after.normalized.json"
          cmp "$work_directory/release-before.normalized.json" "$work_directory/release-after.normalized.json"
          {
            echo "windows_artifact_id=$windows_artifact_id"
            echo "windows_artifact_digest=$windows_artifact_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable Windows validation inputs
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-validation-inputs
          path: ${{ runner.temp }}/windows-validation-inputs/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7

  channels:
    name: ${{ matrix.name }} install / update / uninstall
    needs: [resolve, prepare-validation-inputs]
    runs-on: windows-2022
    # Candidate entrypoints, raw installers, archives, and native assets are
    # frozen first. Local-only overrides preserve wrapper/hash semantics while
    # keeping draft-write authority out of all executed candidate code.
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Global MSI
            kind: msi-global
            asset: tr300-x86_64-pc-windows-msvc.msi
            channel: msi-global
          - name: Corporate MSI
            kind: msi-corporate
            asset: tr300-x86_64-pc-windows-msvc-corporate.msi
            channel: msi-corporate
          - name: Global EXE
            kind: exe-global
            asset: tr300-x86_64-pc-windows-msvc-setup.exe
            channel: exe-global
          - name: Corporate EXE
            kind: exe-corporate
            asset: tr300-x86_64-pc-windows-msvc-corporate-setup.exe
            channel: exe-corporate
          - name: PowerShell installer
            kind: powershell
            asset: tr300-installer.ps1
            channel: powershell-installer
          - name: Cargo
            kind: cargo
            asset: ""
            channel: cargo
          - name: Portable / unknown
            kind: portable
            asset: tr300-x86_64-pc-windows-msvc.zip
            channel: unknown
    steps:
      - name: Download the immutable validation inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare-validation-inputs.outputs.artifact_id }}
          path: candidate

      - name: Rebind candidate files to the frozen draft manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ needs.prepare-validation-inputs.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.prepare-validation-inputs.outputs.artifact_digest }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.source_sha }}
          VALIDATION_MODE: ${{ needs.resolve.outputs.validation_mode }}
          REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          if ($env:ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or
              $env:ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') {
            throw 'validation input artifact identity is malformed'
          }
          $artifact = gh api "repos/$env:REPOSITORY/actions/artifacts/$env:ARTIFACT_ID" |
            ConvertFrom-Json
          if ($artifact.id -ne [long]$env:ARTIFACT_ID -or
              $artifact.name -ne 'windows-validation-inputs' -or $artifact.expired -or
              $artifact.digest -ne "sha256:$env:ARTIFACT_DIGEST" -or
              $artifact.workflow_run.id -ne [long]$env:EXPECTED_RUN_ID -or
              $artifact.workflow_run.head_sha -ne $env:EXPECTED_SHA) {
            throw 'validation input artifact no longer has the trusted identity'
          }
          $manifest = Get-Content candidate\validation-input-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.schema_version -ne 1 -or $manifest.tag -ne $env:EXPECTED_TAG -or
              $manifest.source_sha -ne $env:EXPECTED_SHA -or
              $manifest.validation_mode -ne $env:VALIDATION_MODE) {
            throw 'validation input manifest provenance mismatch'
          }
          foreach ($asset in $manifest.release_assets) {
            $path = Join-Path candidate $asset.name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Item -LiteralPath $path).Length -ne [long]$asset.size) {
              throw "missing or size-mismatched frozen asset: $($asset.name)"
            }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.digest -ne "sha256:$actual") {
              throw "frozen asset digest mismatch: $($asset.name)"
            }
          }

      - name: Download prior same-channel input
        if: matrix.asset != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset }}
          VALIDATION_MODE: ${{ needs.resolve.outputs.validation_mode }}
          TAG: ${{ needs.resolve.outputs.previous_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          gh release download $env:TAG --repo $env:REPOSITORY `
            --dir assets --pattern $env:ASSET --clobber
          if (-not (Test-Path (Join-Path assets $env:ASSET))) {
            throw "missing downloaded asset $env:ASSET"
          }

      - name: Verify prior release checksum when published
        if: matrix.asset != '' && matrix.kind != 'powershell'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset }}
          TAG: ${{ needs.resolve.outputs.previous_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release download $env:TAG --repo $env:REPOSITORY `
            --dir assets --pattern "$env:ASSET.sha256" --clobber
          $line = (Get-Content "assets\$env:ASSET.sha256" -Raw).Trim()
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash "assets\$env:ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "checksum mismatch for $env:ASSET" }

      - name: Verify frozen candidate recovery checksum
        if: matrix.asset != '' && matrix.kind != 'powershell'
        env:
          ASSET: ${{ matrix.asset }}
        shell: pwsh
        run: |
          $line = (Get-Content "candidate\$env:ASSET.sha256" -Raw).Trim()
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash "candidate\$env:ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "candidate checksum mismatch for $env:ASSET" }

      - name: Install the selected channel
        id: install
        env:
          KIND: ${{ matrix.kind }}
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.resolve.outputs.previous_version }}
        shell: pwsh
        run: |
          $asset = if ($env:ASSET) { Join-Path $PWD "assets\$env:ASSET" } else { $null }
          $msiexecDirectory = [IO.Path]::GetFullPath([Environment]::SystemDirectory)
          $msiexecPath = [IO.Path]::GetFullPath((Join-Path $msiexecDirectory 'msiexec.exe'))
          switch ($env:KIND) {
            'msi-global' {
              $p = Start-Process -FilePath $msiexecPath -WorkingDirectory $msiexecDirectory -Wait -PassThru `
                -ArgumentList @('/i', $asset, '/qn', '/norestart')
              if ($p.ExitCode -ne 0) { throw "Global MSI failed: $($p.ExitCode)" }
              $exe = "$env:ProgramFiles\tr300\bin\tr300.exe"
            }
            'msi-corporate' {
              $p = Start-Process -FilePath $msiexecPath -WorkingDirectory $msiexecDirectory -Wait -PassThru `
                -ArgumentList @('/i', $asset, '/qn', '/norestart')
              if ($p.ExitCode -ne 0) { throw "Corporate MSI failed: $($p.ExitCode)" }
              $exe = "$env:LOCALAPPDATA\Programs\tr300\bin\tr300.exe"
            }
            'exe-global' {
              $log = Join-Path $env:RUNNER_TEMP 'tr300-global-exe-install.log'
              $p = Start-Process $asset -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG="{0}"' -f $log))
              if ($p.ExitCode -ne 0) {
                Get-Content -LiteralPath $log -ErrorAction SilentlyContinue
                throw "Global EXE failed: $($p.ExitCode)"
              }
              $exe = "$env:ProgramFiles\tr300\bin\tr300.exe"
            }
            'exe-corporate' {
              $log = Join-Path $env:RUNNER_TEMP 'tr300-corporate-exe-install.log'
              $p = Start-Process $asset -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG="{0}"' -f $log))
              if ($p.ExitCode -ne 0) {
                Get-Content -LiteralPath $log -ErrorAction SilentlyContinue
                throw "Corporate EXE failed: $($p.ExitCode)"
              }
              $exe = "$env:LOCALAPPDATA\Programs\tr300\bin\tr300.exe"
            }
            'powershell' {
              # Run in the current pwsh host. Starting Windows PowerShell from
              # pwsh inherits PSModulePath and can make Windows PowerShell load
              # PowerShell 7's incompatible Microsoft.PowerShell.Security
              # module before the cargo-dist script reaches its real work.
              & $asset
              if (-not $?) { throw "PowerShell installer failed" }
              $exe = "$HOME\.cargo\bin\tr300.exe"
            }
            'cargo' {
              cargo install tr300 --version $env:VERSION --force --locked
              if ($LASTEXITCODE -ne 0) { throw "cargo install failed" }
              $exe = "$HOME\.cargo\bin\tr300.exe"
            }
            'portable' {
              Expand-Archive -LiteralPath $asset -DestinationPath portable
              $exe = (Get-ChildItem portable -Recurse -Filter tr300.exe | Select-Object -First 1).FullName
            }
          }
          if (-not $exe -or -not (Test-Path $exe)) { throw "installed executable is missing" }
          "exe=$exe" | Add-Content $env:GITHUB_OUTPUT

      - name: Verify reports, channel, registration, PATH, and safe update result
        env:
          KIND: ${{ matrix.kind }}
          VALIDATION_MODE: ${{ needs.resolve.outputs.validation_mode }}
          EXPECTED_CHANNEL: ${{ matrix.channel }}
          INSTALLED_VERSION: ${{ needs.resolve.outputs.previous_version }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
          EXE: ${{ steps.install.outputs.exe }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset }}
        shell: pwsh
        run: |
          # GitHub's PowerShell host enables native-command errors. The matrix
          # deliberately accepts updater exit 2 when an immutable old client
          # retains its binary and returns safe recovery JSON, so capture
          # native exit codes explicitly instead of terminating before the
          # contract assertions below can inspect stdout/stderr.
          $PSNativeCommandUseErrorActionPreference = $false
          $candidateDirectory = (Resolve-Path -LiteralPath candidate).Path
          $env:TR300_DIST_INSTALLER_PATH = Join-Path $candidateDirectory 'tr300-dist-installer.ps1'
          if (-not (Test-Path -LiteralPath $env:TR300_DIST_INSTALLER_PATH -PathType Leaf)) {
            throw 'frozen candidate cargo-dist installer is missing'
          }
          $candidateDirectoryUri = [Uri]::new(
            $candidateDirectory + [IO.Path]::DirectorySeparatorChar
          )
          if (-not $candidateDirectoryUri.IsFile) {
            throw 'frozen candidate directory did not resolve to a local file URI'
          }
          $env:TR300_DOWNLOAD_URL = $candidateDirectoryUri.AbsoluteUri.TrimEnd('/')
          $msiexecDirectory = [IO.Path]::GetFullPath([Environment]::SystemDirectory)
          $msiexecPath = [IO.Path]::GetFullPath((Join-Path $msiexecDirectory 'msiexec.exe'))

          function Invoke-Updater([string] $label) {
            $stdoutPath = Join-Path $env:RUNNER_TEMP "update-$label-stdout.txt"
            $stderrPath = Join-Path $env:RUNNER_TEMP "update-$label-stderr.txt"
            $process = Start-Process -FilePath $env:EXE -Wait -PassThru `
              -ArgumentList @('update', '--json') `
              -RedirectStandardOutput $stdoutPath `
              -RedirectStandardError $stderrPath
            [pscustomobject]@{
              ExitCode = $process.ExitCode
              Lines = @(Get-Content -LiteralPath $stdoutPath -ErrorAction SilentlyContinue)
              StderrPath = $stderrPath
            }
          }

          function Install-Candidate {
            $asset = if ($env:ASSET) { Join-Path $PWD "candidate\$env:ASSET" } else { $null }
            $githubTokenNames = @('TR300_GITHUB_TOKEN', 'GITHUB_TOKEN', 'GH_TOKEN')
            $savedGithubTokens = @{}
            foreach ($name in $githubTokenNames) {
              $value = [Environment]::GetEnvironmentVariable($name, 'Process')
              if ($null -ne $value) { $savedGithubTokens[$name] = $value }
              [Environment]::SetEnvironmentVariable($name, $null, 'Process')
            }
            try {
              switch ($env:KIND) {
                'msi-global' {
                  for ($attempt = 1; $attempt -le 18; $attempt++) {
                    $p = Start-Process -FilePath $msiexecPath -WorkingDirectory $msiexecDirectory -Wait -PassThru `
                      -ArgumentList @('/i', $asset, '/qn', '/norestart')
                    if ($p.ExitCode -eq 0) { break }
                    if ($p.ExitCode -ne 1618 -or $attempt -eq 18) {
                      throw "candidate Global MSI failed: $($p.ExitCode)"
                    }
                    Start-Sleep -Seconds 5
                  }
                }
                'msi-corporate' {
                  for ($attempt = 1; $attempt -le 18; $attempt++) {
                    $p = Start-Process -FilePath $msiexecPath -WorkingDirectory $msiexecDirectory -Wait -PassThru `
                      -ArgumentList @('/i', $asset, '/qn', '/norestart')
                    if ($p.ExitCode -eq 0) { break }
                    if ($p.ExitCode -ne 1618 -or $attempt -eq 18) {
                      throw "candidate Corporate MSI failed: $($p.ExitCode)"
                    }
                    Start-Sleep -Seconds 5
                  }
                }
                'exe-global' {
                  $log = Join-Path $env:RUNNER_TEMP 'tr300-candidate-global-exe.log'
                  $p = Start-Process $asset -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG="{0}"' -f $log))
                  if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "candidate Global EXE failed: $($p.ExitCode)" }
                }
                'exe-corporate' {
                  $log = Join-Path $env:RUNNER_TEMP 'tr300-candidate-corporate-exe.log'
                  $p = Start-Process $asset -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG="{0}"' -f $log))
                  if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "candidate Corporate EXE failed: $($p.ExitCode)" }
                }
                'powershell' {
                  & $asset
                  if (-not $?) { throw 'candidate PowerShell installer failed' }
                }
                'cargo' {
                  cargo install tr300 --version $env:EXPECTED_VERSION --force --locked
                  if ($LASTEXITCODE -ne 0) { throw 'candidate Cargo install failed' }
                }
              }
            } finally {
              foreach ($name in $githubTokenNames) {
                [Environment]::SetEnvironmentVariable($name, $null, 'Process')
              }
              foreach ($entry in $savedGithubTokens.GetEnumerator()) {
                [Environment]::SetEnvironmentVariable($entry.Key, $entry.Value, 'Process')
              }
            }
          }

          function Test-TargetVersion {
            if (-not (Test-Path $env:EXE)) { return $false }
            try {
              return ((& $env:EXE --version).Trim() -eq "tr300 $env:EXPECTED_VERSION")
            } catch {
              return $false
            }
          }

          function Test-NativeConvergence {
            if (-not (Test-TargetVersion)) { return $false }
            $markerName = if ($env:KIND -like '*-global') {
              'InstallSourceGlobal'
            } else {
              'InstallSourceCorporate'
            }
            try {
              $marker = (Get-ItemProperty 'HKCU:\Software\TR300').PSObject.Properties[$markerName].Value
            } catch {
              return $false
            }
            if ($marker -ne $env:EXPECTED_CHANNEL) { return $false }
            $display = if ($env:KIND -like '*-corporate') {
              'tr300 (Corporate Edition)'
            } else {
              'tr300'
            }
            $entries = @(
              Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
              Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
            ) | Where-Object DisplayName -EQ $display
            return (@($entries).Count -eq 1 -and $entries[0].DisplayVersion -eq $env:EXPECTED_VERSION)
          }

          function Wait-ForLegacyInstaller {
            for ($attempt = 1; $attempt -le 90; $attempt++) {
              if (Test-NativeConvergence) { return $true }
              Start-Sleep -Seconds 1
            }
            return $false
          }

          $reported = (& $env:EXE --version).Trim()
          if ($reported -ne "tr300 $env:INSTALLED_VERSION") { throw "unexpected prior version: $reported" }
          (& $env:EXE --fast --json | ConvertFrom-Json) | Out-Null
          & $env:EXE --fast --ascii | Out-Null

          if ($env:VALIDATION_MODE -eq 'private') {
            # The candidate is still a private draft, so /releases/latest must
            # remain the prior public version. Prove that an installed public
            # client does not discover or mutate to unpublished bytes.
            $priorRun = Invoke-Updater 'private-prior'
            $priorLines = $priorRun.Lines
            if ($priorRun.ExitCode -ne 0 -or $priorLines.Count -ne 1) {
              throw 'pre-public updater did not return one successful JSON object'
            }
            $prior = $priorLines[0] | ConvertFrom-Json
            if ($prior.success -ne $true -or $prior.update_available -ne $false -or
                $prior.latest_version -ne $env:INSTALLED_VERSION -or
                $prior.install_channel -ne $env:EXPECTED_CHANNEL -or
                $prior.requires_user_action -ne $false) {
              throw 'private draft leaked into public updater discovery or lost channel identity'
            }
            if ((& $env:EXE --version).Trim() -ne "tr300 $env:INSTALLED_VERSION") {
              throw 'pre-public updater mutated the installed public version'
            }

            if ($env:KIND -eq 'portable') {
              $candidateDirectory = Join-Path $env:RUNNER_TEMP 'candidate-portable'
              Expand-Archive -LiteralPath (Join-Path $PWD "candidate\$env:ASSET") `
                -DestinationPath $candidateDirectory
              $candidateExecutables = @(Get-ChildItem $candidateDirectory -Recurse -Filter tr300.exe)
              if ($candidateExecutables.Count -ne 1) {
                throw 'frozen candidate portable archive did not contain exactly one binary'
              }
              $candidateExecutable = $candidateExecutables[0].FullName
              if ((& $candidateExecutable --version).Trim() -ne "tr300 $env:EXPECTED_VERSION") {
                throw 'frozen candidate portable version mismatch'
              }
              (& $candidateExecutable --fast --json | ConvertFrom-Json) | Out-Null
              & $candidateExecutable --fast --ascii | Out-Null
            } else {
              # Exercise the exact authenticated draft installer directly. Do
              # not route through /releases/latest before publication.
              Install-Candidate
              if (-not (Test-TargetVersion)) {
                throw 'direct authenticated candidate transition did not install the target version'
              }
              $candidateRun = Invoke-Updater 'private-candidate'
              $candidateLines = $candidateRun.Lines
              if ($candidateRun.ExitCode -ne 0 -or $candidateLines.Count -ne 1) {
                throw 'candidate updater did not no-op safely against public latest'
              }
              $candidate = $candidateLines[0] | ConvertFrom-Json
              if ($candidate.success -ne $true -or $candidate.update_available -ne $false -or
                  $candidate.latest_version -ne $env:INSTALLED_VERSION -or
                  $candidate.install_channel -ne $env:EXPECTED_CHANNEL -or
                  $candidate.requires_user_action -ne $false) {
                throw 'candidate attempted a downgrade or lost its install channel before publication'
              }
              if ($env:KIND -eq 'cargo') {
                $registrations = @(cargo install --list | Select-String '^tr300 v([^:]+):$')
                if ($registrations.Count -ne 1 -or
                    $registrations[0].Matches[0].Groups[1].Value -ne $env:EXPECTED_VERSION) {
                  throw "Cargo candidate did not converge to one target registration: $registrations"
                }
              }
            }
          } else {
          $updateRun = Invoke-Updater 'prior'
          $exit = $updateRun.ExitCode
          $lines = $updateRun.Lines
          Write-Host "update exit=$exit stdout-lines=$($lines.Count)"
          $lines | ForEach-Object { Write-Host "update-json: $_" }
          Get-Content -LiteralPath $updateRun.StderrPath -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "update-stderr: $_" }
          $legacyForcedTermination = (
            $env:KIND -match '^(msi|exe)-' -and
            $exit -eq -1073741510 -and
            $lines.Count -eq 0
          )
          if ($legacyForcedTermination) {
            $stderrText = Get-Content -LiteralPath $updateRun.StderrPath -Raw -ErrorAction SilentlyContinue
            $expectedLaunch = if ($env:KIND -like 'msi-*') {
              'Launching Windows Installer'
            } else {
              'Launching Inno Setup installer'
            }
            if ($stderrText -notmatch [regex]::Escape($expectedLaunch)) {
              throw "legacy client termination lacked exact same-channel installer launch evidence"
            }
            Write-Warning 'Immutable legacy updater was terminated by Restart Manager after launching its exact same-channel installer (0xC000013A); waiting for that transaction before tagged recovery.'
            if (-not (Wait-ForLegacyInstaller)) {
              Install-Candidate
            }
            if (-not (Test-NativeConvergence)) {
              throw 'legacy forced-termination recovery did not converge to the candidate version'
            }
            $update = $null
          } else {
            if ($lines.Count -ne 1) { throw "update stdout was not exactly one line/object" }
            $update = $lines[0] | ConvertFrom-Json
            if ($update.install_channel -ne $env:EXPECTED_CHANNEL) {
              throw "expected channel $env:EXPECTED_CHANNEL, got $($update.install_channel)"
            }
            if ($update.latest_version -ne $env:EXPECTED_VERSION -or $update.update_available -ne $true) {
              throw "updater did not resolve the intended target version"
            }
          }
          if ($env:KIND -eq 'portable') {
            if ($exit -ne 2 -or $update.success -ne $false -or $update.requires_user_action -ne $true) {
              throw "older portable update did not fail safely"
            }
            if ($update.recovery_url -ne 'https://github.com/QubeTX/qube-machine-report/releases/latest') {
              throw "portable recovery URL is not versionless latest"
            }
            $retained = (& $env:EXE --version).Trim()
            if ($retained -ne "tr300 $env:INSTALLED_VERSION") {
              throw "portable failure mutated the existing binary: $retained"
            }
          } else {
            $legacyFallback = $legacyForcedTermination
            if (-not $legacyFallback -and ($exit -ne 0 -or $update.success -ne $true)) {
              if ($exit -ne 2 -or $update.success -ne $false -or $update.requires_user_action -ne $true) {
                throw "legacy updater neither succeeded nor failed safely"
              }
              if ($update.recovery_url -ne 'https://github.com/QubeTX/qube-machine-report/releases/latest') {
                throw "legacy updater did not return the versionless recovery page"
              }
              $retained = (& $env:EXE --version).Trim()
              if ($retained -ne "tr300 $env:INSTALLED_VERSION") {
                throw "legacy updater failure did not retain the old binary: $retained"
              }
              $legacyFallback = $true
              Install-Candidate
            }
            $expectedStrategies = switch ($env:KIND) {
              'msi-global' { @('msi_global') }
              'msi-corporate' { @('msi_corporate') }
              'exe-global' { @('exe_global') }
              'exe-corporate' { @('exe_corporate') }
              'powershell' { @('installer_powershell', 'installer_pwsh') }
              'cargo' { @('cargo') }
            }
            if (-not $legacyFallback -and $expectedStrategies -notcontains $update.strategy) {
              throw "update crossed or misreported strategy: $($update.strategy)"
            }
            if (-not $legacyFallback -and $update.requires_user_action -ne $false) {
              throw "successful update unexpectedly requires user action"
            }
            $updated = (& $env:EXE --version).Trim()
            if ($updated -ne "tr300 $env:EXPECTED_VERSION") {
              throw "same-channel update did not install target version: $updated"
            }

            # The second call proves an already-current install is a graceful
            # no-op and still reports exactly one JSON object.
            $currentRun = Invoke-Updater 'current'
            $currentExit = $currentRun.ExitCode
            $currentLines = $currentRun.Lines
            if ($currentLines.Count -ne 1) { throw "no-op stdout was not exactly one JSON object" }
            $current = $currentLines[0] | ConvertFrom-Json
            if ($currentExit -ne 0 -or $current.success -ne $true -or $current.update_available -ne $false) {
              throw "installed channel no-op update failed"
            }
            if ($current.install_channel -ne $env:EXPECTED_CHANNEL -or $current.requires_user_action -ne $false) {
              throw "no-op lost channel identity or unexpectedly requires user action"
            }
            if ($env:KIND -eq 'cargo') {
              $registrations = @(cargo install --list | Select-String '^tr300 v([^:]+):$')
              if ($registrations.Count -ne 1 -or $registrations[0].Matches[0].Groups[1].Value -ne $env:EXPECTED_VERSION) {
                throw "Cargo recovery did not converge to one target registration: $registrations"
              }
            }
          }
          }

          $global = "$env:ProgramFiles\tr300\bin\tr300.exe"
          $corporate = "$env:LOCALAPPDATA\Programs\tr300\bin\tr300.exe"
          $cargo = "$HOME\.cargo\bin\tr300.exe"
          $copies = @($global, $corporate, $cargo) | Where-Object { Test-Path $_ }
          if ($env:KIND -ne 'portable' -and $copies.Count -ne 1) {
            throw "expected one active installed copy, found $($copies.Count): $copies"
          }

          if ($env:KIND -match '^(msi|exe)-' -or $env:KIND -eq 'powershell') {
            $scope = if ($env:KIND -like '*-global') { 'Machine' } else { 'User' }
            $expectedDir = (Split-Path $env:EXE -Parent).TrimEnd('\')
            $persistedPath = [Environment]::GetEnvironmentVariable('Path', $scope)
            $pathEntries = @($persistedPath -split ';') | ForEach-Object { $_.Trim().TrimEnd('\') }
            if ($pathEntries -notcontains $expectedDir) {
              throw "$scope PATH does not contain the selected channel directory: $expectedDir"
            }
          }

          if ($env:KIND -match '^(msi|exe)-') {
            $marker = if ($env:KIND -like '*-global') { 'InstallSourceGlobal' } else { 'InstallSourceCorporate' }
            $properties = Get-ItemProperty 'HKCU:\Software\TR300'
            $markerProperty = $properties.PSObject.Properties[$marker]
            if (-not $markerProperty) { throw "scoped marker is missing: $marker" }
            $value = $markerProperty.Value
            if ($value -ne $env:EXPECTED_CHANNEL) { throw "scoped marker mismatch: $value" }
            $display = if ($env:KIND -like '*-corporate') { 'tr300 (Corporate Edition)' } else { 'tr300' }
            $entries = @(
              Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
              Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
            ) | Where-Object DisplayName -EQ $display
            if (@($entries).Count -ne 1) { throw "expected one $display registration" }

            # Exercise the new Global live-image worker as a same-version
            # repair. A normal updater correctly no-ops when already current,
            # so this strict hidden action is the release gate that proves the
            # rename/install/verify/cleanup transaction before a future tag is
            # available. It cannot select Corporate or cross formats.
            if ($env:KIND -in @('msi-global', 'exe-global')) {
              $strategy = if ($env:KIND -eq 'msi-global') { 'msi_global' } else { 'exe_global' }
              $nonce = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
              $backup = Join-Path (Split-Path $env:EXE -Parent) ".tr300-update-backup-$PID-$nonce.exe"
              $worker = Start-Process -FilePath $env:EXE -Wait -PassThru -ArgumentList @(
                'update-worker', '--update-strategy', $strategy,
                '--update-version', $env:EXPECTED_VERSION,
                '--update-backup', ('"{0}"' -f $backup)
              )
              if ($worker.ExitCode -ne 0) {
                throw "Global live-image worker failed same-version repair: $($worker.ExitCode)"
              }
              for ($attempt = 1; $attempt -le 100 -and (Test-Path $backup); $attempt++) {
                Start-Sleep -Milliseconds 100
              }
              if (Test-Path $backup) { throw "Global live-image backup was not cleaned: $backup" }
              if (-not (Test-TargetVersion)) { throw 'Global live-image repair lost the target version' }
            }

            # Prove the documented legacy recovery path: a very old or damaged
            # install may have its executable/ARP identity but no marker. Delete
            # both values and require one unambiguous registered product to
            # recover the exact MSI/Inno format and edition without mutation.
            Remove-ItemProperty 'HKCU:\Software\TR300' -Name $marker -ErrorAction SilentlyContinue
            Remove-ItemProperty 'HKCU:\Software\TR300' -Name InstallSource -ErrorAction SilentlyContinue
            $recoveredRun = Invoke-Updater 'recovered'
            $recoveredExit = $recoveredRun.ExitCode
            $recoveredLines = $recoveredRun.Lines
            if ($recoveredLines.Count -ne 1) { throw "recovery stdout was not one JSON object" }
            $recovered = $recoveredLines[0] | ConvertFrom-Json
            if ($recoveredExit -ne 0 -or $recovered.install_channel -ne $env:EXPECTED_CHANNEL) {
              throw "missing-marker ARP recovery failed for $env:KIND"
            }
            if ($recovered.install_origin -ne $env:EXPECTED_CHANNEL) {
              throw "missing-marker origin recovery crossed channels: $($recovered.install_origin)"
            }
          }

      - name: Uninstall and verify cleanup
        if: always() && steps.install.outputs.exe != ''
        env:
          KIND: ${{ matrix.kind }}
          EXE: ${{ steps.install.outputs.exe }}
          INSTALLED_VERSION: ${{ needs.resolve.outputs.previous_version }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        shell: pwsh
        run: |
          if ($env:KIND -like 'msi-*') {
            $display = if ($env:KIND -eq 'msi-corporate') { 'tr300 (Corporate Edition)' } else { 'tr300' }
            $entry = @(
              Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
              Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
            ) | Where-Object { $_.DisplayName -eq $display -and $_.WindowsInstaller -eq 1 } | Select-Object -First 1
            if (-not $entry) { throw "MSI registration missing before uninstall" }
            $msiexecDirectory = [IO.Path]::GetFullPath([Environment]::SystemDirectory)
            $msiexecPath = [IO.Path]::GetFullPath((Join-Path $msiexecDirectory 'msiexec.exe'))
            $p = Start-Process -FilePath $msiexecPath -WorkingDirectory $msiexecDirectory -Wait -PassThru `
              -ArgumentList @('/x', $entry.PSChildName, '/qn', '/norestart')
            if ($p.ExitCode -ne 0) { throw "MSI uninstall failed: $($p.ExitCode)" }
          } elseif ($env:KIND -like 'exe-*') {
            $root = Split-Path (Split-Path $env:EXE -Parent) -Parent
            $uninstaller = Join-Path $root 'unins000.exe'
            if (-not (Test-Path $uninstaller)) { throw "Inno uninstaller missing" }
            $p = Start-Process $uninstaller -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
            if ($p.ExitCode -ne 0) { throw "EXE uninstall failed: $($p.ExitCode)" }
          } elseif ($env:KIND -eq 'powershell') {
            Remove-Item -LiteralPath $env:EXE -Force
            Remove-Item -LiteralPath "$env:LOCALAPPDATA\tr300\tr300-receipt.json" -Force -ErrorAction SilentlyContinue
          } elseif ($env:KIND -eq 'cargo') {
            $registered = @(cargo install --list | Select-String '^tr300 v([^:]+):$')
            foreach ($entry in $registered) {
              $version = $entry.Matches[0].Groups[1].Value
              cargo uninstall "tr300@$version"
              if ($LASTEXITCODE -ne 0) { throw "cargo uninstall failed for tr300@$version" }
            }
          }
          if ($env:KIND -ne 'portable' -and (Test-Path $env:EXE)) {
            throw "binary remains after uninstall: $env:EXE"
          }
          if ($env:KIND -match '^(msi|exe)-') {
            $scope = if ($env:KIND -like '*-global') { 'Machine' } else { 'User' }
            $removedDir = (Split-Path $env:EXE -Parent).TrimEnd('\')
            $persistedPath = [Environment]::GetEnvironmentVariable('Path', $scope)
            $pathEntries = @($persistedPath -split ';') | ForEach-Object { $_.Trim().TrimEnd('\') }
            if ($pathEntries -contains $removedDir) {
              throw "$scope PATH still contains the uninstalled channel directory: $removedDir"
            }
          }

  fresh-format-choice:
    name: Fresh ${{ matrix.name }} format choice
    if: needs.resolve.outputs.validation_mode == 'private'
    needs: [resolve, prepare-validation-inputs]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Global
            msi: tr300-x86_64-pc-windows-msvc.msi
            exe: tr300-x86_64-pc-windows-msvc-setup.exe
            display: tr300
            marker: InstallSourceGlobal
          - name: Corporate
            msi: tr300-x86_64-pc-windows-msvc-corporate.msi
            exe: tr300-x86_64-pc-windows-msvc-corporate-setup.exe
            display: tr300 (Corporate Edition)
            marker: InstallSourceCorporate
    steps:
      - name: Download immutable validation inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare-validation-inputs.outputs.artifact_id }}
          path: assets

      - name: Verify selected format bytes against the frozen manifest
        env:
          MSI: ${{ matrix.msi }}
          EXE: ${{ matrix.exe }}
          EXPECTED_TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.source_sha }}
        shell: pwsh
        run: |
          $manifest = Get-Content assets\validation-input-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.tag -ne $env:EXPECTED_TAG -or $manifest.source_sha -ne $env:EXPECTED_SHA -or
              $manifest.validation_mode -ne 'private') { throw 'frozen format manifest mismatch' }
          foreach ($name in @($env:MSI, $env:EXE)) {
            $record = @($manifest.release_assets | Where-Object name -EQ $name)
            if ($record.Count -ne 1) { throw "manifest does not bind $name" }
            $actual = (Get-FileHash "assets\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($record[0].digest -ne "sha256:$actual") { throw "frozen format digest mismatch: $name" }
          }

      - name: Verify newest explicit format owns the edition
        env:
          MSI: ${{ matrix.msi }}
          EXE: ${{ matrix.exe }}
          DISPLAY: ${{ matrix.display }}
          MARKER: ${{ matrix.marker }}
        shell: pwsh
        run: |
          $msiexecDirectory = [IO.Path]::GetFullPath([Environment]::SystemDirectory)
          $msiexecPath = [IO.Path]::GetFullPath((Join-Path $msiexecDirectory 'msiexec.exe'))
          function Entries {
            @(
              Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
              Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
            ) | Where-Object DisplayName -EQ $env:DISPLAY
          }
          function Install-Msi {
            $p = Start-Process -FilePath $msiexecPath -WorkingDirectory $msiexecDirectory -Wait -PassThru `
              -ArgumentList @('/i', (Join-Path $PWD "assets\$env:MSI"), '/qn', '/norestart')
            if ($p.ExitCode -ne 0) { throw "MSI install failed: $($p.ExitCode)" }
          }
          function Install-Exe {
            $log = Join-Path $env:RUNNER_TEMP 'tr300-format-takeover.log'
            $p = Start-Process (Join-Path $PWD "assets\$env:EXE") -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG="{0}"' -f $log))
            if ($p.ExitCode -ne 0) {
              Get-Content -LiteralPath $log -ErrorAction SilentlyContinue
              throw "EXE install failed: $($p.ExitCode)"
            }
          }
          function Remove-Current {
            $entry = @(Entries)[0]
            if ($entry.WindowsInstaller -eq 1) {
              $p = Start-Process -FilePath $msiexecPath -WorkingDirectory $msiexecDirectory -Wait -PassThru `
                -ArgumentList @('/x', $entry.PSChildName, '/qn', '/norestart')
            } else {
              if ($entry.UninstallString -notmatch '^"([^"]+)"$') {
                throw "unexpected Inno uninstall command: $($entry.UninstallString)"
              }
              $uninstaller = $Matches[1]
              $p = Start-Process $uninstaller -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
            }
            if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          }

          Install-Msi
          Install-Exe
          $entries = @(Entries)
          if ($entries.Count -ne 1 -or $entries[0].WindowsInstaller -eq 1) {
            throw "fresh EXE did not replace the same-edition MSI registration"
          }
          $properties = Get-ItemProperty 'HKCU:\Software\TR300'
          if ($properties.PSObject.Properties[$env:MARKER].Value -notlike 'exe-*') {
            throw "fresh EXE marker did not win"
          }
          Remove-Current

          Install-Exe
          Install-Msi
          $entries = @(Entries)
          if ($entries.Count -ne 1 -or $entries[0].WindowsInstaller -ne 1) {
            throw "fresh MSI did not replace the same-edition EXE registration"
          }
          $properties = Get-ItemProperty 'HKCU:\Software\TR300'
          if ($properties.PSObject.Properties[$env:MARKER].Value -notlike 'msi-*') {
            throw "fresh MSI marker did not win"
          }
          Remove-Current
          if (@(Entries).Count -ne 0) { throw "registration remains after final uninstall" }

  managed-cli-choice:
    name: Fresh PowerShell supersedes ${{ matrix.name }}
    if: needs.resolve.outputs.validation_mode == 'private'
    needs: [resolve, prepare-validation-inputs]
    runs-on: windows-2022
    # The exact frozen managed wrapper, raw installer, and archive are executed
    # through local-only overrides after manifest verification. No checkout or
    # draft-write authority reaches candidate code.
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Global MSI
            kind: msi
            asset: tr300-x86_64-pc-windows-msvc.msi
          - name: Corporate MSI
            kind: msi
            asset: tr300-x86_64-pc-windows-msvc-corporate.msi
          - name: Global EXE
            kind: exe
            asset: tr300-x86_64-pc-windows-msvc-setup.exe
          - name: Corporate EXE
            kind: exe
            asset: tr300-x86_64-pc-windows-msvc-corporate-setup.exe
    steps:
      - name: Download immutable validation inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare-validation-inputs.outputs.artifact_id }}
          path: assets

      - name: Verify native and managed bytes against the frozen manifest
        env:
          NATIVE_ASSET: ${{ matrix.asset }}
          EXPECTED_TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.source_sha }}
        shell: pwsh
        run: |
          $manifest = Get-Content assets\validation-input-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.tag -ne $env:EXPECTED_TAG -or $manifest.source_sha -ne $env:EXPECTED_SHA -or
              $manifest.validation_mode -ne 'private') { throw 'frozen managed manifest mismatch' }
          foreach ($name in @($env:NATIVE_ASSET, 'tr300-installer.ps1')) {
            $record = @($manifest.release_assets | Where-Object name -EQ $name)
            if ($record.Count -ne 1) { throw "manifest does not bind $name" }
            $actual = (Get-FileHash "assets\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($record[0].digest -ne "sha256:$actual") { throw "frozen managed digest mismatch: $name" }
          }

      - name: Install native channel, then make fresh PowerShell intent authoritative
        env:
          NATIVE_ASSET: ${{ matrix.asset }}
          KIND: ${{ matrix.kind }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        shell: pwsh
        run: |
          $native = Join-Path $PWD "assets\$env:NATIVE_ASSET"
          if ($env:KIND -eq 'msi') {
            $msiexecDirectory = [IO.Path]::GetFullPath([Environment]::SystemDirectory)
            $msiexecPath = [IO.Path]::GetFullPath((Join-Path $msiexecDirectory 'msiexec.exe'))
            $process = Start-Process -FilePath $msiexecPath -WorkingDirectory $msiexecDirectory -Wait -PassThru `
              -ArgumentList @('/i', $native, '/qn', '/norestart')
          } else {
            $process = Start-Process $native -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          }
          if ($process.ExitCode -ne 0) { throw "native setup failed: $($process.ExitCode)" }

          $candidateDirectory = (Resolve-Path -LiteralPath assets).Path
          $env:TR300_DIST_INSTALLER_PATH = Join-Path $candidateDirectory 'tr300-dist-installer.ps1'
          if (-not (Test-Path -LiteralPath $env:TR300_DIST_INSTALLER_PATH -PathType Leaf)) {
            throw 'frozen candidate cargo-dist installer is missing'
          }
          $candidateDirectoryUri = [Uri]::new(
            $candidateDirectory + [IO.Path]::DirectorySeparatorChar
          )
          if (-not $candidateDirectoryUri.IsFile) {
            throw 'frozen candidate directory did not resolve to a local file URI'
          }
          $env:TR300_DOWNLOAD_URL = $candidateDirectoryUri.AbsoluteUri.TrimEnd('/')
          & (Join-Path $PWD 'assets\tr300-installer.ps1')
          if (-not $?) { throw 'managed PowerShell takeover failed' }

          $managed = "$HOME\.cargo\bin\tr300.exe"
          if (-not (Test-Path -LiteralPath $managed)) { throw 'managed binary is missing' }
          if ((& $managed --version).Trim() -ne "tr300 $env:EXPECTED_VERSION") {
            throw 'managed binary version mismatch'
          }
          $receipt = Get-Content "$env:LOCALAPPDATA\tr300\tr300-receipt.json" -Raw | ConvertFrom-Json
          if ($receipt.provider.source -ne 'cargo-dist' -or $receipt.version -ne $env:EXPECTED_VERSION) {
            throw 'managed receipt does not identify the exact release'
          }

          $entries = @(
            Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
            Get-ItemProperty 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
          ) | Where-Object { $_.DisplayName -in @('tr300', 'tr300 (Corporate Edition)') }
          if (@($entries).Count -ne 0) { throw "native registration remains: $($entries.DisplayName)" }
          foreach ($path in @(
            "$env:ProgramFiles\tr300\bin\tr300.exe",
            "$env:LOCALAPPDATA\Programs\tr300\bin\tr300.exe"
          )) {
            if (Test-Path -LiteralPath $path) { throw "native binary remains: $path" }
          }
          $markers = Get-ItemProperty 'HKCU:\Software\TR300' -ErrorAction SilentlyContinue
          foreach ($name in @('InstallSource', 'InstallSourceGlobal', 'InstallSourceCorporate')) {
            if ($markers -and $markers.PSObject.Properties[$name]) { throw "stale native marker remains: $name" }
          }

          $stdout = Join-Path $env:RUNNER_TEMP 'managed-current.json'
          $stderr = Join-Path $env:RUNNER_TEMP 'managed-current.stderr'
          $update = Start-Process $managed -Wait -PassThru -ArgumentList @('update', '--json') `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $lines = @(Get-Content -LiteralPath $stdout)
          if ($update.ExitCode -ne 0 -or $lines.Count -ne 1) { throw 'managed no-op updater JSON failed' }
          $json = $lines[0] | ConvertFrom-Json
          if ($json.install_channel -ne 'powershell-installer' -or
              $json.update_available -ne $false -or $json.success -ne $true) {
            throw 'managed no-op updater lost its channel'
          }

          Remove-Item -LiteralPath $managed -Force
          Remove-Item -LiteralPath "$env:LOCALAPPDATA\tr300\tr300-receipt.json" -Force

  attest-private-validation:
    name: Attest exact private-draft Windows acceptance
    if: needs.resolve.outputs.validation_mode == 'private'
    needs:
      - resolve
      - prepare-validation-inputs
      - channels
      - fresh-format-choice
      - managed-cli-choice
    runs-on: ubuntu-24.04
    steps:
      - name: Download the exact validated input artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare-validation-inputs.outputs.artifact_id }}
          path: ${{ runner.temp }}/validated-inputs

      - name: Create the fixed validation proof
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WINDOWS_RUN_ID: ${{ needs.resolve.outputs.upstream_run_id }}
          WINDOWS_RUN_ATTEMPT: ${{ needs.resolve.outputs.upstream_run_attempt }}
          WINDOWS_ARTIFACT_ID: ${{ needs.prepare-validation-inputs.outputs.windows_artifact_id }}
          WINDOWS_ARTIFACT_DIGEST: ${{ needs.prepare-validation-inputs.outputs.windows_artifact_digest }}
          VALIDATION_INPUT_ARTIFACT_ID: ${{ needs.prepare-validation-inputs.outputs.artifact_id }}
          VALIDATION_INPUT_ARTIFACT_DIGEST: ${{ needs.prepare-validation-inputs.outputs.artifact_digest }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          INPUT_DIRECTORY: ${{ runner.temp }}/validated-inputs
          PROOF_DIRECTORY: ${{ runner.temp }}/windows-validation-proof
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          for value in "$WINDOWS_RUN_ID" "$WINDOWS_RUN_ATTEMPT" "$WINDOWS_ARTIFACT_ID" \
            "$VALIDATION_INPUT_ARTIFACT_ID" "$VALIDATION_RUN_ID" "$VALIDATION_RUN_ATTEMPT"; do
            [[ "$value" =~ ^[1-9][0-9]*$ ]]
          done
          [[ "$WINDOWS_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ &&
             "$VALIDATION_INPUT_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          manifest="$INPUT_DIRECTORY/validation-input-manifest.json"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" \
            --argjson windows_run "$WINDOWS_RUN_ID" \
            --argjson windows_attempt "$WINDOWS_RUN_ATTEMPT" \
            --argjson windows_artifact "$WINDOWS_ARTIFACT_ID" \
            --arg windows_digest "$WINDOWS_ARTIFACT_DIGEST" '
              .schema_version == 1 and .tag == $tag and .source_sha == $sha and
              .validation_mode == "private" and .upstream_run_id == $windows_run and
              .upstream_run_attempt == $windows_attempt and
              .windows_artifact_id == $windows_artifact and
              .windows_artifact_digest == $windows_digest and
              (.release_assets | length) == 30
            ' "$manifest" >/dev/null
          mkdir -m 700 "$PROOF_DIRECTORY"
          cp "$manifest" "$PROOF_DIRECTORY/validation-input-manifest.json"
          jq -n --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" \
            --argjson windows_run_id "$WINDOWS_RUN_ID" \
            --argjson windows_run_attempt "$WINDOWS_RUN_ATTEMPT" \
            --argjson windows_artifact_id "$WINDOWS_ARTIFACT_ID" \
            --arg windows_artifact_digest "$WINDOWS_ARTIFACT_DIGEST" \
            --argjson validation_input_artifact_id "$VALIDATION_INPUT_ARTIFACT_ID" \
            --arg validation_input_artifact_digest "sha256:$VALIDATION_INPUT_ARTIFACT_DIGEST" \
            --argjson validation_run_id "$VALIDATION_RUN_ID" \
            --argjson validation_run_attempt "$VALIDATION_RUN_ATTEMPT" '
              {
                schema_version: 1,
                tag: $tag,
                source_sha: $sha,
                windows_run_id: $windows_run_id,
                windows_run_attempt: $windows_run_attempt,
                windows_artifact_id: $windows_artifact_id,
                windows_artifact_digest: $windows_artifact_digest,
                validation_input_artifact_id: $validation_input_artifact_id,
                validation_input_artifact_digest: $validation_input_artifact_digest,
                validation_run_id: $validation_run_id,
                validation_run_attempt: $validation_run_attempt,
                result: "success"
              }
            ' > "$PROOF_DIRECTORY/windows-installer-validation.json"

      - name: Upload immutable Windows validation proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-installer-validation-proof
          path: ${{ runner.temp }}/windows-validation-proof/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7
