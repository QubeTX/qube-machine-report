        run: |
          set -euo pipefail
          case "$APPLE_TARGET" in
            aarch64-apple-darwin|x86_64-apple-darwin) ;;
            *) exit 64 ;;
          esac
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
