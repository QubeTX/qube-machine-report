      - name: Require a supported stable release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "unsupported release tag: $RELEASE_TAG (expected vX.Y.Z)" >&2
            exit 64
          }
      - name: Bind the release tag to current main and successful CI
        if: github.event_name == 'push'
        id: provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          resolve_tag_commit() {
            local tag=$1
            local object_type source_sha
            IFS=$'\t' read -r object_type source_sha < <(
              gh api "repos/$EXPECTED_REPOSITORY/git/ref/tags/$tag" \
                --jq '.object | [.type, .sha] | @tsv'
