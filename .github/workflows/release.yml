          echo 'cargo-dist container execution is not source-pinned for this repository' >&2
          exit 64
      - name: Install pinned cargo-dist on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/cargo-dist-installer-v0.31.0.sh"
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh \
            -o "$installer"
