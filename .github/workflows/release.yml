            -k "$keychain_password" "$keychain" >/dev/null
          identity_lines=$(security find-identity -v -p codesigning "$keychain" \
            | grep -E '^[[:space:]]*[0-9]+\) [[:xdigit:]]{40} "[^"]+"$' || true)
          identity_count=$(printf '%s\n' "$identity_lines" | grep -c . || true)
          [[ $identity_count -eq 1 ]] || exit 1
          signing_fingerprint=$(printf '%s\n' "$identity_lines" | awk '{print $2}')
          [[ "$signing_fingerprint" =~ ^[[:xdigit:]]{40}$ ]] || exit 1
          imported_identity=$(printf '%s\n' "$identity_lines" | sed -E 's/^[^"]*"([^"]+)".*$/\1/')
          [[ "$APPLE_SIGNING_IDENTITY" == "$signing_fingerprint" ||
             "$APPLE_SIGNING_IDENTITY" == "$imported_identity" ]] || exit 1

          security list-keychains -d user -s "$keychain" "${original_user_keychains[@]}"
          keychain_search_modified=true
          codesign --force --identifier com.qubetx.tr300 --options runtime --timestamp \
            --keychain "$keychain" --sign "$signing_fingerprint" "$binary"
          restore_keychain_search
          codesign --verify --strict --verbose=4 "$binary"
          signature_details=$(codesign -d --verbose=4 "$binary" 2>&1)
          grep -Fqx 'Identifier=com.qubetx.tr300' <<< "$signature_details"
          grep -Fqx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature_details"
          grep -Fqx "Authority=$imported_identity" <<< "$signature_details"
          certificate_prefix="$work_dir/embedded-signing-certificate"
          codesign -d --extract-certificates="$certificate_prefix" "$binary" >/dev/null 2>&1
          embedded_fingerprint=$(openssl x509 -inform DER -in "${certificate_prefix}0" \
            -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')
          [[ "$embedded_fingerprint" == "$signing_fingerprint" ]] || exit 1
          grep -Eq '^CodeDirectory .*flags=.*\(runtime\)' <<< "$signature_details"
          grep -Eq '^Timestamp=.+' <<< "$signature_details"

          notary_zip="$work_dir/$archive_root-notary.zip"
          /usr/bin/ditto -c -k --keepParent "$binary" "$notary_zip"
          notary_result="$work_dir/notary-result.json"
          xcrun notarytool submit "$notary_zip" --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json > "$notary_result"
          submission_id=$(jq -r '.id // empty' "$notary_result")
          notary_status=$(jq -r '.status // empty' "$notary_result")
          if [[ "$notary_status" != Accepted ]]; then
            if [[ -n $submission_id ]]; then
              xcrun notarytool log "$submission_id" \
                --key "$api_key_path" --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" || true
            fi
            exit 1
          fi

          replacement="$work_dir/$archive_name"
          COPYFILE_DISABLE=1 tar -cJf "$replacement" -C "$STAGING_DIRECTORY" "$archive_root"
          mv "$replacement" "unsigned/$archive_name"
          archive_sha=$(shasum -a 256 "unsigned/$archive_name" | awk '{print $1}')
          printf '%s *%s\n' "$archive_sha" "$archive_name" > "unsigned/$archive_name.sha256"
          manifest="unsigned/$APPLE_TARGET-dist-manifest.json"
          jq --arg archive "$archive_name" --arg sha "$archive_sha" '
            if .artifacts[$archive] == null then error("archive missing from manifest")
            else .artifacts[$archive].checksums.sha256 = $sha end
          ' "$manifest" > "$work_dir/dist-manifest.json"
          mv "$work_dir/dist-manifest.json" "$manifest"
          (cd unsigned && shasum -a 256 -c "$archive_name.sha256") || exit 1

      - name: Upload the canonical signed cargo-dist artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifacts-build-local-${{ matrix.target }}
          if-no-files-found: error
          path: |
            unsigned/tr300-${{ matrix.target }}.tar.xz
            unsigned/tr300-${{ matrix.target }}.tar.xz.sha256
            unsigned/${{ matrix.target }}-dist-manifest.json

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
      - sign-apple-artifacts
    if: ${{ always() && needs.plan.result == 'success' && needs.build-local-artifacts.result == 'success' && (needs.plan.outputs.publishing != 'true' || needs.sign-apple-artifacts.result == 'success') }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  prepare-host-assets:
    name: Prepare fixed GitHub Release assets without write credentials
    needs:
      - plan
      - build-local-artifacts
      - sign-apple-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.sign-apple-artifacts.result == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.prepared-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.prepared-upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Download only this run's cargo-dist build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-*
          path: ${{ runner.temp }}/cargo-dist-release-inputs
          merge-multiple: true
      - name: Render and validate the fixed 24-asset initial release
        id: prepared
        env:
          PLAN_MANIFEST: ${{ needs.plan.outputs.val }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          INPUT_DIRECTORY: ${{ runner.temp }}/cargo-dist-release-inputs
          OUTPUT_DIRECTORY: ${{ runner.temp }}/tr300-prepared-release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=no)" ]]
          mkdir -m 700 "$OUTPUT_DIRECTORY"
          find "$INPUT_DIRECTORY" -mindepth 1 -maxdepth 1 \
            -name '*-dist-manifest.json' -type f -delete
          cargo_assets=(
            sha256.sum
            source.tar.gz
            source.tar.gz.sha256
            tr300-installer.ps1
            tr300-installer.sh
            tr300-aarch64-apple-darwin.tar.xz
            tr300-aarch64-apple-darwin.tar.xz.sha256
            tr300-aarch64-unknown-linux-gnu.tar.xz
            tr300-aarch64-unknown-linux-gnu.tar.xz.sha256
            tr300-x86_64-apple-darwin.tar.xz
            tr300-x86_64-apple-darwin.tar.xz.sha256
            tr300-x86_64-pc-windows-msvc.msi
            tr300-x86_64-pc-windows-msvc.msi.sha256
            tr300-x86_64-pc-windows-msvc.zip
            tr300-x86_64-pc-windows-msvc.zip.sha256
            tr300-x86_64-unknown-linux-gnu.tar.xz
            tr300-x86_64-unknown-linux-gnu.tar.xz.sha256
            tr300-x86_64-unknown-linux-musl.tar.xz
            tr300-x86_64-unknown-linux-musl.tar.xz.sha256
          )
          declare -A remaining=()
          for name in "${cargo_assets[@]}"; do remaining["$name"]=1; done
          mapfile -d '' -t inputs < <(find "$INPUT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0)
          [[ ${#inputs[@]} -eq ${#cargo_assets[@]} ]]
          for path in "${inputs[@]}"; do
            name=${path##*/}
            [[ -n ${remaining[$name]+present} && -f "$path" && ! -L "$path" && -s "$path" ]]
            unset 'remaining[$name]'
          done
          [[ ${#remaining[@]} -eq 0 ]]
          for name in "${cargo_assets[@]}"; do
            install -m 0644 "$INPUT_DIRECTORY/$name" "$OUTPUT_DIRECTORY/$name"
          done

          # cargo-dist 0.31.0 emits its raw checksum sidecars and aggregate
          # with one blank line after the final checksum record. Verify those
          # producer bytes exactly before canonicalizing the public files to
          # one trailing LF. The Apple signer already canonicalizes its two
          # sidecars after replacing the archives with signed/notarized bytes.
          python3 - "$OUTPUT_DIRECTORY" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          payloads = (
              "source.tar.gz",
              "tr300-aarch64-apple-darwin.tar.xz",
              "tr300-aarch64-unknown-linux-gnu.tar.xz",
              "tr300-x86_64-apple-darwin.tar.xz",
              "tr300-x86_64-pc-windows-msvc.msi",
              "tr300-x86_64-pc-windows-msvc.zip",
              "tr300-x86_64-unknown-linux-gnu.tar.xz",
              "tr300-x86_64-unknown-linux-musl.tar.xz",
          )
          raw_cargo_dist_payloads = {
              "source.tar.gz",
              "tr300-aarch64-unknown-linux-gnu.tar.xz",
              "tr300-x86_64-pc-windows-msvc.msi",
              "tr300-x86_64-pc-windows-msvc.zip",
              "tr300-x86_64-unknown-linux-gnu.tar.xz",
              "tr300-x86_64-unknown-linux-musl.tar.xz",
          }
          canonical_sidecars = {}
          checksum_records = []
          for payload_name in payloads:
              payload = output / payload_name
              digest = hashlib.sha256(payload.read_bytes()).hexdigest()
              record = f"{digest} *{payload_name}".encode("utf-8")
              sidecar = output / f"{payload_name}.sha256"
              expected_ending = b"\n\n" if payload_name in raw_cargo_dist_payloads else b"\n"
              if sidecar.read_bytes() != record + expected_ending:
                  raise SystemExit(
                      f"checksum sidecar does not match its producer contract: {payload_name}"
                  )
              canonical_sidecars[sidecar] = record + b"\n"
              checksum_records.append(record + b"\n")

          canonical_checksum = b"".join(checksum_records)
          checksum_path = output / "sha256.sum"
          if checksum_path.read_bytes() != canonical_checksum + b"\n":
              raise SystemExit("raw cargo-dist aggregate checksum file is malformed")

          for sidecar, contents in canonical_sidecars.items():
              sidecar.write_bytes(contents)
          checksum_path.write_bytes(canonical_checksum)
          PY

          mv "$OUTPUT_DIRECTORY/tr300-installer.sh" \
            "$OUTPUT_DIRECTORY/tr300-dist-installer.sh"
          mv "$OUTPUT_DIRECTORY/tr300-installer.ps1" \
            "$OUTPUT_DIRECTORY/tr300-dist-installer.ps1"
          shell_dist_installer_sha256=$(sha256sum \
            "$OUTPUT_DIRECTORY/tr300-dist-installer.sh")
          shell_dist_installer_sha256=${shell_dist_installer_sha256%% *}
          powershell_dist_installer_sha256=$(sha256sum \
            "$OUTPUT_DIRECTORY/tr300-dist-installer.ps1")
          powershell_dist_installer_sha256=${powershell_dist_installer_sha256%% *}
          [[ "$shell_dist_installer_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$powershell_dist_installer_sha256" =~ ^[0-9a-f]{64}$ ]]
          version=${RELEASE_TAG#v}
          sed -e "s/@TR300_TAG@/${RELEASE_TAG}/g" \
            -e "s/@TR300_VERSION@/${version}/g" \
            -e "s/@TR300_DIST_INSTALLER_SHA256@/${shell_dist_installer_sha256}/g" \
            scripts/managed-installers/tr300-installer.sh \
            > "$OUTPUT_DIRECTORY/tr300-installer.sh"
          sed -e "s/@TR300_TAG@/${RELEASE_TAG}/g" \
            -e "s/@TR300_VERSION@/${version}/g" \
            -e "s/@TR300_DIST_INSTALLER_SHA256@/${powershell_dist_installer_sha256}/g" \
            scripts/managed-installers/tr300-installer.ps1 \
            > "$OUTPUT_DIRECTORY/tr300-installer.ps1"
          chmod 0755 "$OUTPUT_DIRECTORY/tr300-installer.sh"
          grep -Fq "tr300_tag='${RELEASE_TAG}'" "$OUTPUT_DIRECTORY/tr300-installer.sh"
          grep -Fq "\$Tr300Tag = '${RELEASE_TAG}'" "$OUTPUT_DIRECTORY/tr300-installer.ps1"
          grep -Fqx "tr300_dist_installer_sha256='${shell_dist_installer_sha256}'" \
            "$OUTPUT_DIRECTORY/tr300-installer.sh"
          grep -Fqx \
            "\$Tr300DistInstallerSha256 = '${powershell_dist_installer_sha256}'" \
            "$OUTPUT_DIRECTORY/tr300-installer.ps1"
          if grep -F '@TR300_' "$OUTPUT_DIRECTORY/tr300-installer.sh" \
            "$OUTPUT_DIRECTORY/tr300-installer.ps1"; then
            exit 65
          fi
          cp "$OUTPUT_DIRECTORY/tr300-installer.sh" \
            "$OUTPUT_DIRECTORY/tr-300-installer.sh"
          cp "$OUTPUT_DIRECTORY/tr300-installer.ps1" \
            "$OUTPUT_DIRECTORY/tr-300-installer.ps1"
          printf '%s\n' "$PLAN_MANIFEST" | jq -e '
            if .announcement_is_prerelease == false and
              (.announcement_title | type == "string" and length > 0) and
              (.announcement_github_body | type == "string" and length > 0)
            then .
            else error("release manifest metadata is malformed")
            end
          ' > "$OUTPUT_DIRECTORY/dist-manifest.json"
          jq --arg tag "$RELEASE_TAG" --arg source_sha "$SOURCE_SHA" '
            {
              tag: $tag,
              source_sha: $source_sha,
              title: .announcement_title,
              body: .announcement_github_body,
              prerelease: .announcement_is_prerelease
            }
          ' "$OUTPUT_DIRECTORY/dist-manifest.json" \
            > "$OUTPUT_DIRECTORY/__tr300-release-metadata.json"
          jq -r .body "$OUTPUT_DIRECTORY/__tr300-release-metadata.json" \
            | sed \
                -e "s|/releases/download/${RELEASE_TAG}/|/releases/latest/download/|g" \
                -e 's/^## Install tr300 [^[:space:]]*$/## Install tr300 (latest)/' \
                -e 's/^## Download tr300 [^[:space:]]*$/## Download tr300 (latest)/' \
            > "$OUTPUT_DIRECTORY/__tr300-notes.txt"

          public_assets=(
            dist-manifest.json
            sha256.sum
            source.tar.gz
            source.tar.gz.sha256
            tr-300-installer.ps1
            tr-300-installer.sh
            tr300-aarch64-apple-darwin.tar.xz
            tr300-aarch64-apple-darwin.tar.xz.sha256
            tr300-aarch64-unknown-linux-gnu.tar.xz
            tr300-aarch64-unknown-linux-gnu.tar.xz.sha256
            tr300-dist-installer.ps1
            tr300-dist-installer.sh
            tr300-installer.ps1
            tr300-installer.sh
            tr300-x86_64-apple-darwin.tar.xz
            tr300-x86_64-apple-darwin.tar.xz.sha256
            tr300-x86_64-pc-windows-msvc.msi
            tr300-x86_64-pc-windows-msvc.msi.sha256
            tr300-x86_64-pc-windows-msvc.zip
            tr300-x86_64-pc-windows-msvc.zip.sha256
            tr300-x86_64-unknown-linux-gnu.tar.xz
            tr300-x86_64-unknown-linux-gnu.tar.xz.sha256
            tr300-x86_64-unknown-linux-musl.tar.xz
            tr300-x86_64-unknown-linux-musl.tar.xz.sha256
          )
          payloads=(
            source.tar.gz
            tr300-aarch64-apple-darwin.tar.xz
            tr300-aarch64-unknown-linux-gnu.tar.xz
            tr300-x86_64-apple-darwin.tar.xz
            tr300-x86_64-pc-windows-msvc.msi
            tr300-x86_64-pc-windows-msvc.zip
            tr300-x86_64-unknown-linux-gnu.tar.xz
            tr300-x86_64-unknown-linux-musl.tar.xz
          )
          for payload in "${payloads[@]}"; do
            digest=$(sha256sum "$OUTPUT_DIRECTORY/$payload"); digest=${digest%% *}
            expected_sidecar="$digest *$payload"
            sidecar="$OUTPUT_DIRECTORY/$payload.sha256"
            [[ $(wc -c < "$sidecar" | tr -d '[:space:]') == $((${#expected_sidecar} + 1)) ]]
            IFS= read -r actual_sidecar < "$sidecar"
            [[ "$actual_sidecar" == "$expected_sidecar" ]]
          done
          (
            cd "$OUTPUT_DIRECTORY"
            [[ $(wc -l < sha256.sum | tr -d '[:space:]') == "${#payloads[@]}" ]]
            sha256sum -c sha256.sum
            : > __tr300-asset-sha256s
            for asset in "${public_assets[@]}"; do
              sha256sum "$asset" >> __tr300-asset-sha256s
            done
            grep -Fqx \
              "${shell_dist_installer_sha256}  tr300-dist-installer.sh" \
              __tr300-asset-sha256s
            grep -Fqx \
              "${powershell_dist_installer_sha256}  tr300-dist-installer.ps1" \
              __tr300-asset-sha256s
          )
          mapfile -d '' -t prepared < <(find "$OUTPUT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0)
          [[ ${#prepared[@]} -eq $((${#public_assets[@]} + 3)) ]]
          for path in "${prepared[@]}"; do
            [[ -f "$path" && ! -L "$path" && -s "$path" ]]
          done

      - name: Upload the exact prepared initial release
        id: prepared-upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tr300-prepared-release-assets
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/tr300-prepared-release/

  host:
    needs:
      - plan
      - prepare-host-assets
    if: ${{ always() && needs.plan.result == 'success' && needs.prepare-host-assets.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release-publishing
    permissions:
      actions: read
      contents: write
    outputs:
      managed_installer_sha256: ${{ steps.publish.outputs.managed_installer_sha256 }}
    steps:
      - name: Download and verify the exact prepared release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          EXPECTED_SHA: ${{ needs.plan.outputs.source-sha }}
          ARTIFACT_ID: ${{ needs.prepare-host-assets.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.prepare-host-assets.outputs.artifact_digest }}
          ASSET_DIRECTORY: ${{ runner.temp }}/tr300-release-assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CURRENT_RUN_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          repository_id=$(gh api "repos/$EXPECTED_REPOSITORY" --jq .id)
          [[ "$repository_id" =~ ^[1-9][0-9]*$ ]]
          work_directory=$(mktemp -d "$RUNNER_TEMP/tr300-host-custody.XXXXXXXX")
          trap 'rm -rf "$work_directory"' EXIT
          gh api "repos/$EXPECTED_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > "$work_directory/artifact-before.json"
          validate_artifact() {
            local path=$1
            jq -e --argjson id "$ARTIFACT_ID" --argjson run "$CURRENT_RUN_ID" \
              --argjson repository "$repository_id" --arg digest "sha256:$ARTIFACT_DIGEST" \
              --arg tag "$RELEASE_TAG" --arg sha "$EXPECTED_SHA" '
                .id == $id and .name == "tr300-prepared-release-assets" and
                .expired == false and (.size_in_bytes > 0 and .size_in_bytes <= 268435456) and
                .digest == $digest and .workflow_run.id == $run and
                .workflow_run.repository_id == $repository and
                .workflow_run.head_repository_id == $repository and
                .workflow_run.head_branch == $tag and .workflow_run.head_sha == $sha
              ' "$path" >/dev/null
          }
          validate_artifact "$work_directory/artifact-before.json"
          zip_path="$work_directory/release-assets.zip"
          gh api "repos/$EXPECTED_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$zip_path"
          zip_sha=$(sha256sum "$zip_path"); zip_sha=${zip_sha%% *}
          [[ "$zip_sha" == "$ARTIFACT_DIGEST" ]]
          public_assets=(
            dist-manifest.json sha256.sum source.tar.gz source.tar.gz.sha256
            tr-300-installer.ps1 tr-300-installer.sh
            tr300-aarch64-apple-darwin.tar.xz tr300-aarch64-apple-darwin.tar.xz.sha256
            tr300-aarch64-unknown-linux-gnu.tar.xz tr300-aarch64-unknown-linux-gnu.tar.xz.sha256
            tr300-dist-installer.ps1 tr300-dist-installer.sh
            tr300-installer.ps1 tr300-installer.sh
            tr300-x86_64-apple-darwin.tar.xz tr300-x86_64-apple-darwin.tar.xz.sha256
            tr300-x86_64-pc-windows-msvc.msi tr300-x86_64-pc-windows-msvc.msi.sha256
            tr300-x86_64-pc-windows-msvc.zip tr300-x86_64-pc-windows-msvc.zip.sha256
            tr300-x86_64-unknown-linux-gnu.tar.xz tr300-x86_64-unknown-linux-gnu.tar.xz.sha256
            tr300-x86_64-unknown-linux-musl.tar.xz tr300-x86_64-unknown-linux-musl.tar.xz.sha256
          )
          expected=("${public_assets[@]}" __tr300-release-metadata.json __tr300-notes.txt __tr300-asset-sha256s)
          mkdir -m 700 "$ASSET_DIRECTORY"
          python3 - "$zip_path" "$ASSET_DIRECTORY" "${expected[@]}" <<'PY'
          import os
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive_path, output_path, *expected = sys.argv[1:]
          expected_names = set(expected)
          output = Path(output_path)
          with zipfile.ZipFile(archive_path) as source:
              members = source.infolist()
              names = [member.filename for member in members]
              if len(names) != len(expected_names) or set(names) != expected_names:
                  raise SystemExit(f"unexpected prepared release members: {names!r}")
              if sum(member.file_size for member in members) > 256 * 1024 * 1024:
                  raise SystemExit("prepared release expands beyond the custody limit")
              for member in members:
                  pure = PurePosixPath(member.filename)
                  mode = member.external_attr >> 16
                  if (pure.name != member.filename or pure.is_absolute() or
                      ".." in pure.parts or member.is_dir() or member.file_size <= 0 or
                      member.file_size > 256 * 1024 * 1024 or stat.S_ISLNK(mode)):
                      raise SystemExit(f"unsafe prepared release member: {member.filename!r}")
                  destination = output / member.filename
                  flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
                  if hasattr(os, "O_NOFOLLOW"):
                      flags |= os.O_NOFOLLOW
                  descriptor = os.open(destination, flags, 0o600)
                  try:
                      with source.open(member) as src, os.fdopen(descriptor, "wb") as dst:
                          descriptor = -1
                          shutil.copyfileobj(src, dst, length=1024 * 1024)
                  finally:
                      if descriptor >= 0:
                          os.close(descriptor)
          PY
          gh api "repos/$EXPECTED_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > "$work_directory/artifact-after.json"
          validate_artifact "$work_directory/artifact-after.json"
          cmp "$work_directory/artifact-before.json" "$work_directory/artifact-after.json"
          mapfile -d '' -t extracted < <(find "$ASSET_DIRECTORY" -mindepth 1 -maxdepth 1 -print0)
          [[ ${#extracted[@]} -eq ${#expected[@]} ]]
          for path in "${extracted[@]}"; do
            [[ -f "$path" && ! -L "$path" && -s "$path" ]]
          done
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$EXPECTED_SHA" '
            .tag == $tag and .source_sha == $sha and .prerelease == false and
            (.title | type == "string" and length > 0) and
            (.body | type == "string" and length > 0)
          ' "$ASSET_DIRECTORY/__tr300-release-metadata.json" >/dev/null
          (
            cd "$ASSET_DIRECTORY"
            [[ $(wc -l < __tr300-asset-sha256s | tr -d '[:space:]') == "${#public_assets[@]}" ]]
            sha256sum -c __tr300-asset-sha256s
          )
      - name: Rebind protected source and publish the fixed 24 assets
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          EXPECTED_SHA: ${{ needs.plan.outputs.source-sha }}
          ASSET_DIRECTORY: ${{ runner.temp }}/tr300-release-assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          resolve_tag_commit() {
            local tag=$1
            local object_type source_sha
            IFS=$'\t' read -r object_type source_sha < <(
              gh api "repos/$EXPECTED_REPOSITORY/git/ref/tags/$tag" \
                --jq '.object | [.type, .sha] | @tsv'
            )
            for _ in 1 2 3 4 5; do
              case "$object_type" in
                commit) printf '%s\n' "$source_sha"; return 0 ;;
                tag)
                  IFS=$'\t' read -r object_type source_sha < <(
                    gh api "repos/$EXPECTED_REPOSITORY/git/tags/$source_sha" \
                      --jq '.object | [.type, .sha] | @tsv'
                  )
                  ;;
                *) return 65 ;;
              esac
            done
            return 65
          }

          source_sha=$(resolve_tag_commit "$RELEASE_TAG")
          [[ "$source_sha" == "$EXPECTED_SHA" ]]
          main_sha=$(gh api "repos/$EXPECTED_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$main_sha" == "$EXPECTED_SHA" ]]
          workflow_id=$(gh api "repos/$EXPECTED_REPOSITORY/actions/workflows/ci.yml" --jq .id)
          [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$EXPECTED_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$EXPECTED_SHA&per_page=100" \
            > "$RUNNER_TEMP/publish-ci-runs.json"
          mapfile -t ci_runs < <(
            jq -r --argjson workflow_id "$workflow_id" \
              --arg repository "$EXPECTED_REPOSITORY" --arg sha "$EXPECTED_SHA" '
                .workflow_runs[] |
                select(.workflow_id == $workflow_id and .name == "CI" and
                       .path == ".github/workflows/ci.yml" and .event == "push" and
                       .status == "completed" and .conclusion == "success" and
                       .repository.full_name == $repository and
                       .head_repository.full_name == $repository and
                       .head_branch == "main" and .head_sha == $sha) |
                .id
              ' "$RUNNER_TEMP/publish-ci-runs.json"
          )
          [[ ${#ci_runs[@]} -eq 1 && "${ci_runs[0]}" =~ ^[1-9][0-9]*$ ]]

          public_assets=(
            dist-manifest.json sha256.sum source.tar.gz source.tar.gz.sha256
            tr-300-installer.ps1 tr-300-installer.sh
            tr300-aarch64-apple-darwin.tar.xz tr300-aarch64-apple-darwin.tar.xz.sha256
            tr300-aarch64-unknown-linux-gnu.tar.xz tr300-aarch64-unknown-linux-gnu.tar.xz.sha256
            tr300-dist-installer.ps1 tr300-dist-installer.sh
            tr300-installer.ps1 tr300-installer.sh
            tr300-x86_64-apple-darwin.tar.xz tr300-x86_64-apple-darwin.tar.xz.sha256
            tr300-x86_64-pc-windows-msvc.msi tr300-x86_64-pc-windows-msvc.msi.sha256
            tr300-x86_64-pc-windows-msvc.zip tr300-x86_64-pc-windows-msvc.zip.sha256
            tr300-x86_64-unknown-linux-gnu.tar.xz tr300-x86_64-unknown-linux-gnu.tar.xz.sha256
            tr300-x86_64-unknown-linux-musl.tar.xz tr300-x86_64-unknown-linux-musl.tar.xz.sha256
          )
          mapfile -d '' -t present < <(find "$ASSET_DIRECTORY" -mindepth 1 -maxdepth 1 -print0)
          [[ ${#present[@]} -eq $((${#public_assets[@]} + 3)) ]]
          for name in "${public_assets[@]}"; do
            [[ -f "$ASSET_DIRECTORY/$name" && ! -L "$ASSET_DIRECTORY/$name" && -s "$ASSET_DIRECTORY/$name" ]]
          done
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$EXPECTED_SHA" '
            .tag == $tag and .source_sha == $sha and .prerelease == false and
            (.title | type == "string" and length > 0)
          ' "$ASSET_DIRECTORY/__tr300-release-metadata.json" >/dev/null
          title=$(jq -r .title "$ASSET_DIRECTORY/__tr300-release-metadata.json")

          release_url="https://api.github.com/repos/$EXPECTED_REPOSITORY/releases/tags/$RELEASE_TAG"
          http_status=$(curl --proto '=https' --tlsv1.2 -sS -o "$RUNNER_TEMP/release-before.json" \
            -w '%{http_code}' -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$release_url")
          [[ "$http_status" == 404 ]]

          # The stable release remains private until the Windows and macOS
          # supplemental workflows have assembled and verified all 34 assets.
          gh release create "$RELEASE_TAG" --repo "$EXPECTED_REPOSITORY" \
            --draft --verify-tag --target "$EXPECTED_SHA" --title "$title" \
            --notes-file "$ASSET_DIRECTORY/__tr300-notes.txt" \
            "$ASSET_DIRECTORY/dist-manifest.json" \
            "$ASSET_DIRECTORY/sha256.sum" \
            "$ASSET_DIRECTORY/source.tar.gz" \
            "$ASSET_DIRECTORY/source.tar.gz.sha256" \
            "$ASSET_DIRECTORY/tr-300-installer.ps1" \
            "$ASSET_DIRECTORY/tr-300-installer.sh" \
            "$ASSET_DIRECTORY/tr300-aarch64-apple-darwin.tar.xz" \
            "$ASSET_DIRECTORY/tr300-aarch64-apple-darwin.tar.xz.sha256" \
            "$ASSET_DIRECTORY/tr300-aarch64-unknown-linux-gnu.tar.xz" \
            "$ASSET_DIRECTORY/tr300-aarch64-unknown-linux-gnu.tar.xz.sha256" \
            "$ASSET_DIRECTORY/tr300-dist-installer.ps1" \
            "$ASSET_DIRECTORY/tr300-dist-installer.sh" \
            "$ASSET_DIRECTORY/tr300-installer.ps1" \
            "$ASSET_DIRECTORY/tr300-installer.sh" \
            "$ASSET_DIRECTORY/tr300-x86_64-apple-darwin.tar.xz" \
            "$ASSET_DIRECTORY/tr300-x86_64-apple-darwin.tar.xz.sha256" \
            "$ASSET_DIRECTORY/tr300-x86_64-pc-windows-msvc.msi" \
            "$ASSET_DIRECTORY/tr300-x86_64-pc-windows-msvc.msi.sha256" \
            "$ASSET_DIRECTORY/tr300-x86_64-pc-windows-msvc.zip" \
            "$ASSET_DIRECTORY/tr300-x86_64-pc-windows-msvc.zip.sha256" \
            "$ASSET_DIRECTORY/tr300-x86_64-unknown-linux-gnu.tar.xz" \
            "$ASSET_DIRECTORY/tr300-x86_64-unknown-linux-gnu.tar.xz.sha256" \
            "$ASSET_DIRECTORY/tr300-x86_64-unknown-linux-musl.tar.xz" \
            "$ASSET_DIRECTORY/tr300-x86_64-unknown-linux-musl.tar.xz.sha256"

          gh api "repos/$EXPECTED_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/release-after.json"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$EXPECTED_SHA" \
            --argjson expected_assets "$(printf '%s\n' "${public_assets[@]}" | jq -R . | jq -s 'sort')" '
              .tag_name == $tag and .target_commitish == $sha and
              .draft == true and .prerelease == false and
              ([.assets[].name] | sort) == $expected_assets and
              ([.assets[].size > 0] | all)
            ' "$RUNNER_TEMP/release-after.json" >/dev/null
          managed_installer_sha256=$(awk '$2 == "*tr300-installer.sh" { print $1 }' \
            "$ASSET_DIRECTORY/__tr300-asset-sha256s")
          [[ "$managed_installer_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "managed_installer_sha256=$managed_installer_sha256" >> "$GITHUB_OUTPUT"
  announce:
    needs:
      - plan
      - host
    # A successful Release run is the private-draft handoff to the two
    # supplemental workflows. The macOS publisher performs the final exact
    # 34-asset promotion and the public managed-installer smoke.
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Confirm private draft handoff
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "Private draft $RELEASE_TAG is ready for supplemental assets."
