          sidecar="$archive.sha256"
          manifest="$APPLE_TARGET-dist-manifest.json"
          python3 - unsigned "$archive" "$sidecar" "$manifest" <<'PY'
          import os
          import stat
          import sys

          directory, *expected = sys.argv[1:]
          if os.path.islink(directory) or not os.path.isdir(directory):
              raise SystemExit("unsigned input is not a real directory")
          with os.scandir(directory) as scanner:
              entries = list(scanner)
