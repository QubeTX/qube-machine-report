          import shutil
          import stat
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          archive_path, output_path, target = sys.argv[1:]
          root = f"tr300-{target}"
          expected = {
              root,
              f"{root}/LICENSE",
              f"{root}/CHANGELOG.md",
              f"{root}/README.md",
              f"{root}/tr300",
          }
          output = Path(output_path)
          with tarfile.open(archive_path, mode="r:xz") as source:
              members = source.getmembers()
              names = [member.name for member in members]
              if len(names) != len(expected) or set(names) != expected:
                  raise SystemExit(f"unexpected archive members: {names!r}")
