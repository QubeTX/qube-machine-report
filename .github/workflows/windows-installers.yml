# Windows Installers — Corporate MSI + Global/Corporate EXE installers.
#
# Triggered after cargo-dist's release.yml creates the private 24-asset draft.
# Uses `workflow_run` (not `release: published`) because visibility is withheld
# until the exact Windows candidate passes its private validation matrix.
#
# Hand-authored workflow — not generated by cargo-dist. The generated
# .github/workflows/release.yml is intentionally checked in with protected
# customizations: stable-only provenance, managed/legacy installer rendering,
# fresh Apple signing, and checkout-free private-draft publication. Preserve
# those boundaries when regenerating; the CI customization is permitted by
# `allow-dirty = ["ci", "msi"]` in Cargo.toml's metadata.
#
# Builds three artifacts per release:
#   - tr300-x86_64-pc-windows-msvc-corporate.msi  (perUser MSI from wix-corporate/corporate.wxs)
#   - tr300-x86_64-pc-windows-msvc-setup.exe       (perMachine EXE from inno/global.iss)
#   - tr300-x86_64-pc-windows-msvc-corporate-setup.exe  (perUser EXE from inno/corporate.iss)
# Plus a .sha256 sidecar for each.
#
# Sequencing:
#   release.yml (cargo-dist, tag push) → creates a private 24-asset draft,
#       including the Global MSI, managed wrappers, and internal raw installers.
#   ↓ (workflow_run trigger on Release completion)
#   windows-installers.yml (this file) → adds 6 exact assets, producing the
#       private 30-asset candidate.
#   ↓
#   windows-installer-validation.yml → freezes and validates those exact bytes
#       and emits the private-draft acceptance proof.
#   ↓
#   macos-installer.yml → adds the direct PKG/DMG pairs, verifies the exact
#       34-asset inventory and every byte, and is the sole workflow allowed to
#       make the stable release public.
#
# If install paths or registry-marker values change in wix/*.wxs,
# wix-corporate/*.wxs, or inno/*.iss, update
# src/update.rs::detect_install_origin() in lockstep.

name: Windows Installers

# Triggered by workflow_run on Release completion. `release: published` is both
# too late for the private-draft chain and suppressed for events created by a
# workflow GITHUB_TOKEN. The v3.15.1 incident established workflow_run as the
# required downstream signal; the resolver now additionally binds the exact
# upstream workflow ID/path/event/repository/SHA/attempt, immutable tag, current
# protected main, CI result, and private Release target before use.
#
# workflow_dispatch is an owner-only current-main recovery path and requires
# both the exact tag and exact successful Release workflow run ID.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach installers to (for example vX.Y.Z)"
        required: true
        type: string
      release_run_id:
        description: "Exact successful Release workflow run ID for this draft"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resolve-release:
    name: Resolve trusted release provenance
    if: |
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.repository == 'QubeTX/qube-machine-report' &&
       github.actor_id == '30877743') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # GitHub exposes draft releases only to callers with push access. This
    # no-checkout resolver needs write-scoped contents solely to authenticate
    # the private draft before any repository code is fetched or executed.
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_run_id: ${{ steps.release.outputs.release_run_id }}
      release_run_attempt: ${{ steps.release.outputs.release_run_attempt }}
    steps:
      - name: Require a stable repository tag bound to the release commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_RUN_ID: ${{ inputs.release_run_id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_TAG: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          ACTOR_ID: ${{ github.actor_id }}
        shell: bash
        run: |
          set -euo pipefail

          validate_release_run() {
            local expected_run_id=$1
            local expected_tag=$2
            local expected_sha=$3
            local expected_attempt=${4:-}
            local trusted_workflow_id
            local actual_run_id workflow_id run_name run_path event status conclusion
            local repository head_repository head_branch head_sha run_attempt
            [[ "$expected_run_id" =~ ^[1-9][0-9]*$ ]]
            [[ -z "$expected_attempt" || "$expected_attempt" =~ ^[1-9][0-9]*$ ]]
            trusted_workflow_id=$(gh api \
              "repos/$EXPECTED_REPOSITORY/actions/workflows/release.yml" --jq .id)
            [[ "$trusted_workflow_id" =~ ^[1-9][0-9]*$ ]]
            IFS=$'\t' read -r actual_run_id workflow_id run_name run_path event \
              status conclusion repository head_repository head_branch head_sha run_attempt < <(
                gh api "repos/$EXPECTED_REPOSITORY/actions/runs/$expected_run_id" \
                  --jq '[.id, .workflow_id, .name, .path, .event, .status, .conclusion, .repository.full_name, .head_repository.full_name, .head_branch, .head_sha, .run_attempt] | @tsv'
              )
            [[ "$actual_run_id" == "$expected_run_id" &&
               "$workflow_id" == "$trusted_workflow_id" &&
               "$run_name" == Release &&
               "$run_path" == .github/workflows/release.yml &&
               "$event" == push && "$status" == completed && "$conclusion" == success &&
               "$repository" == "$EXPECTED_REPOSITORY" &&
               "$head_repository" == "$EXPECTED_REPOSITORY" &&
               "$head_branch" == "$expected_tag" && "$head_sha" == "$expected_sha" &&
               "$run_attempt" =~ ^[1-9][0-9]*$ &&
               (-z "$expected_attempt" || "$run_attempt" == "$expected_attempt") ]]
            printf '%s\n' "$run_attempt"
          }

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_REPOSITORY" == QubeTX/qube-machine-report &&
               "$WORKFLOW_REF" == refs/heads/main && "$ACTOR_ID" == 30877743 &&
               "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
            remote_main=$(gh api "repos/$EXPECTED_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            [[ "$remote_main" == "$WORKFLOW_SHA" ]]
            tag=$DISPATCH_TAG
            expected_sha=''
            release_run_id=$DISPATCH_RUN_ID
            [[ "$release_run_id" =~ ^[1-9][0-9]*$ ]] || {
              echo 'release_run_id is required for manual draft recovery' >&2
              exit 64
            }
            expected_attempt=''
          else
            [[ "$UPSTREAM_CONCLUSION" == success ]] || {
              echo 'upstream Release did not succeed' >&2
              exit 65
            }
            [[ "$UPSTREAM_EVENT" == push ]] || {
              echo "refusing upstream event: $UPSTREAM_EVENT" >&2
              exit 65
            }
            [[ "$UPSTREAM_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || {
              echo "refusing upstream repository: $UPSTREAM_REPOSITORY" >&2
              exit 65
            }
            [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'upstream Release SHA is malformed' >&2
              exit 65
            }
            tag=$UPSTREAM_TAG
            expected_sha=$UPSTREAM_SHA
            release_run_id=$UPSTREAM_RUN_ID
            expected_attempt=$UPSTREAM_RUN_ATTEMPT
          fi

          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "invalid stable release tag: $tag" >&2
            exit 64
          }

          IFS=$'\t' read -r object_type source_sha < <(
            gh api "repos/$EXPECTED_REPOSITORY/git/ref/tags/$tag" \
              --jq '.object | [.type, .sha] | @tsv'
          )
          for _ in 1 2 3 4 5; do
            case "$object_type" in
              commit)
                break
                ;;
              tag)
                IFS=$'\t' read -r object_type source_sha < <(
                  gh api "repos/$EXPECTED_REPOSITORY/git/tags/$source_sha" \
                    --jq '.object | [.type, .sha] | @tsv'
                )
                ;;
              *)
                echo "release tag resolves to unsupported object type: $object_type" >&2
                exit 65
                ;;
            esac
          done
          [[ "$object_type" == commit && "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release tag did not resolve to a commit' >&2
            exit 65
          }
          if [[ -n "$expected_sha" && "$source_sha" != "$expected_sha" ]]; then
            echo "release tag $tag targets $source_sha, not upstream SHA $expected_sha" >&2
            exit 65
          fi
          [[ "$source_sha" == "$(gh api "repos/$EXPECTED_REPOSITORY/git/ref/heads/main" --jq .object.sha)" ]]
          gh api --paginate --slurp \
            "repos/$EXPECTED_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/windows-release-candidates.json"
          mapfile -t release_records < <(
            jq -r --arg tag "$tag" '
              .[][] | select(.tag_name == $tag) |
              [.id, .target_commitish, .draft, .prerelease] | @tsv
            ' "$RUNNER_TEMP/windows-release-candidates.json"
          )
          [[ ${#release_records[@]} -eq 1 ]] || {
            echo "expected one private release record for $tag; found ${#release_records[@]}" >&2
            exit 65
          }
          IFS=$'\t' read -r release_id release_target release_draft release_prerelease \
            <<< "${release_records[0]}"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "release $tag does not expose a positive numeric ID" >&2
            exit 65
          }
          [[ "$release_target" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release $tag does not record an immutable target commit" >&2
            exit 65
          }
          [[ "$release_target" == "$source_sha" ]] || {
            echo "release $tag targets $release_target, not tag commit $source_sha" >&2
            exit 65
          }
          [[ "$release_draft" == true && "$release_prerelease" == false ]] || {
            echo "release $tag must be the private stable draft assembled by Release" >&2
            exit 65
          }
          # Preserve the F20 torn-release guard in this no-checkout,
          # draft-authenticated resolver. The checked-out Windows build never
          # receives a release-write token or reads private Release state.
          gh api "repos/$EXPECTED_REPOSITORY/releases/$release_id" \
            > "$RUNNER_TEMP/windows-private-release.json"
          jq -e --argjson id "$release_id" --arg tag "$tag" \
            --arg sha "$source_sha" '
              .id == $id and .tag_name == $tag and .target_commitish == $sha and
              .draft == true and .prerelease == false
            ' "$RUNNER_TEMP/windows-private-release.json" >/dev/null
          mapfile -t release_assets < <(
            jq -r '.assets[].name' "$RUNNER_TEMP/windows-private-release.json"
          )
          has_release_asset() {
            local needle=$1
            local existing
            for existing in "${release_assets[@]}"; do
              [[ "$existing" == "$needle" ]] && return 0
            done
            return 1
          }
          for sentinel in dist-manifest.json tr300-x86_64-pc-windows-msvc.msi; do
            has_release_asset "$sentinel" || {
              echo "upstream cargo-dist release is incomplete; missing asset: $sentinel" >&2
              exit 65
            }
          done
          release_run_attempt=$(validate_release_run \
            "$release_run_id" "$tag" "$source_sha" "$expected_attempt")

          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "source_sha=$source_sha"
            echo "release_id=$release_id"
            echo "release_run_id=$release_run_id"
            echo "release_run_attempt=$release_run_attempt"
          } >> "$GITHUB_OUTPUT"

  build-windows-installers:
    name: Build Corporate MSI + Global EXE + Corporate EXE
    needs: resolve-release
    if: needs.resolve-release.result == 'success'
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.windows-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.windows-upload.outputs.artifact-digest }}

    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          persist-credentials: false

      # rust-toolchain.toml at repo root pins channel=1.95 + rustfmt + clippy.
      # dtolnay/rust-toolchain@stable honors this file (channel pin wins over
      # the action's "stable" arg), so cargo-wix + Inno Setup get a Rust
      # version that matches the repo MSRV.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build tr300.exe (release)
        shell: pwsh
        run: cargo build --release --locked

      - name: Build Corporate MSI via bare candle + light
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        shell: pwsh
        run: |
          # The Corporate MSI is built with WiX 3 candle/light directly (NOT
          # through cargo-wix). cargo-wix compiles every .wxs file in `wix/`
          # and links them into ONE MSI; putting corporate.wxs alongside
          # main.wxs hits LGHT0089/0091/0092 "Multiple entry sections" +
          # "Duplicate symbol" errors at link time. corporate.wxs lives in
          # wix-corporate/ (a separate directory) precisely so cargo-wix's
          # default scan of wix/ produces only the Global MSI cleanly.
          #
          # WiX 3.x is preinstalled on windows-2022 runners — the install
          # registers `$env:WIX` pointing at the install root. Standard paths:
          #   - $env:WIX\bin\candle.exe (compiler)
          #   - $env:WIX\bin\light.exe (linker)
          #
          # -sice:ICE38 / ICE64 / ICE91 suppress per-user MSI convention
          # violations from light. These ICEs require Components in user-
          # profile directories to have HKCU RegistryValue KeyPaths (not File
          # KeyPaths) and Directories to have RemoveFile/RemoveFolder
          # entries. For our single-binary install they're cosmetic — install
          # and uninstall both work correctly; the only consequence is an
          # empty `%LocalAppData%\Programs\tr300\bin\` folder left after
          # uninstall. Acceptable trade-off vs ~40 LOC of WiX boilerplate.
          $candle = "$env:WIX\bin\candle.exe"
          $light  = "$env:WIX\bin\light.exe"
          if (-not (Test-Path $candle)) { throw "candle.exe not found at $candle" }
          if (-not (Test-Path $light))  { throw "light.exe not found at $light" }

          New-Item -ItemType Directory -Force -Path target\wix | Out-Null

          # Quote -d... args. Without quotes, PowerShell parses
          # `-dVersion=3.15.1` as `-dVersion=3` followed by `.15.1` (the
          # dots in the version string break tokenization), so candle
          # ends up seeing `.15.1` as a source filename and errors with
          # CNDL0103. Quoting forces the whole assignment to be one
          # string literal.
          & $candle -arch x64 `
            "-dVersion=$env:RELEASE_VERSION" `
            "-dCargoTargetBinDir=target\release" `
            -out target\wix\corporate.wixobj `
            wix-corporate\corporate.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle failed with exit $LASTEXITCODE" }

          & $light -sice:ICE38 -sice:ICE64 -sice:ICE91 `
            -ext WixUIExtension `
            -out target\wix\tr300-x86_64-pc-windows-msvc-corporate.msi `
            target\wix\corporate.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light failed with exit $LASTEXITCODE" }

          if (-not (Test-Path "target\wix\tr300-x86_64-pc-windows-msvc-corporate.msi")) {
            throw "Corporate MSI build failed — output file missing"
          }
          Write-Host "✓ Corporate MSI built"

      - name: Install the pinned official Inno Setup 6.7.3
        # The installer bootstrap verifies GitHub's attestation for the pinned
        # upstream artifact. Expose only this job's read-only token, only to
        # this reviewed verification step; later build/packaging steps receive
        # no token.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: '& scripts/install-pinned-inno-setup.ps1'

      - name: Build Global EXE installer
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        shell: pwsh
        run: |
          # /DMyAppVersion overrides the #define in inno/global.iss so the
          # version embedded in the EXE matches the release tag.
          # Quote /D... preprocessor define to survive PowerShell's
          # dot-aware tokenizer (same reason candle args are quoted above).
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$env:RELEASE_VERSION" inno\global.iss
          if (-not (Test-Path "inno\Output\tr300-x86_64-pc-windows-msvc-setup.exe")) {
            throw "Global EXE installer build failed — output missing"
          }
          Write-Host "✓ Global EXE installer built"

      - name: Build Corporate EXE installer
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$env:RELEASE_VERSION" inno\corporate.iss
          if (-not (Test-Path "inno\Output\tr300-x86_64-pc-windows-msvc-corporate-setup.exe")) {
            throw "Corporate EXE installer build failed — output missing"
          }
          Write-Host "✓ Corporate EXE installer built"

      - name: Compute SHA256 sidecars
        shell: pwsh
        run: |
          $files = @(
            "target\wix\tr300-x86_64-pc-windows-msvc-corporate.msi",
            "inno\Output\tr300-x86_64-pc-windows-msvc-setup.exe",
            "inno\Output\tr300-x86_64-pc-windows-msvc-corporate-setup.exe"
          )
          foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path $f -Leaf
            # Matches the cargo-dist sidecar format: lowercase-hex SHA256,
            # space, asterisk, filename. No trailing newline.
            $line = "$hash *$name"
            [System.IO.File]::WriteAllText("$f.sha256", $line)
            Write-Host "  $name  →  $hash"
          }

      - name: Stage the fixed six-file release artifact
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "windows-release-assets"
          New-Item -ItemType Directory -Path $artifactDirectory | Out-Null

          $sources = [ordered]@{
            "tr300-x86_64-pc-windows-msvc-corporate.msi" =
              "target\wix\tr300-x86_64-pc-windows-msvc-corporate.msi"
            "tr300-x86_64-pc-windows-msvc-corporate.msi.sha256" =
              "target\wix\tr300-x86_64-pc-windows-msvc-corporate.msi.sha256"
            "tr300-x86_64-pc-windows-msvc-setup.exe" =
              "inno\Output\tr300-x86_64-pc-windows-msvc-setup.exe"
            "tr300-x86_64-pc-windows-msvc-setup.exe.sha256" =
              "inno\Output\tr300-x86_64-pc-windows-msvc-setup.exe.sha256"
            "tr300-x86_64-pc-windows-msvc-corporate-setup.exe" =
              "inno\Output\tr300-x86_64-pc-windows-msvc-corporate-setup.exe"
            "tr300-x86_64-pc-windows-msvc-corporate-setup.exe.sha256" =
              "inno\Output\tr300-x86_64-pc-windows-msvc-corporate-setup.exe.sha256"
          }
          foreach ($entry in $sources.GetEnumerator()) {
            Copy-Item -LiteralPath $entry.Value -Destination (
              Join-Path $artifactDirectory $entry.Key
            )
          }

          $entries = @(Get-ChildItem -LiteralPath $artifactDirectory -Force)
          if ($entries.Count -ne $sources.Count) {
            throw "Staged artifact must contain exactly $($sources.Count) files"
          }
          foreach ($entry in $entries) {
            if ($entry.PSIsContainer -or -not $sources.Contains($entry.Name) -or $entry.Length -le 0) {
              throw "Unexpected, empty, or non-file artifact entry: $($entry.Name)"
            }
          }
          foreach ($payloadName in @(
            "tr300-x86_64-pc-windows-msvc-corporate.msi",
            "tr300-x86_64-pc-windows-msvc-setup.exe",
            "tr300-x86_64-pc-windows-msvc-corporate-setup.exe"
          )) {
            $payload = Join-Path $artifactDirectory $payloadName
            $sidecar = "$payload.sha256"
            $hash = (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = "$hash *$payloadName"
            $actual = [System.IO.File]::ReadAllText($sidecar)
            if ($actual -cne $expected) {
              throw "Checksum sidecar does not bind the staged payload: $payloadName"
            }
          }

      - name: Upload the fixed internal Windows release artifact
        id: windows-upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-release-assets
          path: |
            ${{ runner.temp }}/windows-release-assets/tr300-x86_64-pc-windows-msvc-corporate.msi
            ${{ runner.temp }}/windows-release-assets/tr300-x86_64-pc-windows-msvc-corporate.msi.sha256
            ${{ runner.temp }}/windows-release-assets/tr300-x86_64-pc-windows-msvc-setup.exe
            ${{ runner.temp }}/windows-release-assets/tr300-x86_64-pc-windows-msvc-setup.exe.sha256
            ${{ runner.temp }}/windows-release-assets/tr300-x86_64-pc-windows-msvc-corporate-setup.exe
            ${{ runner.temp }}/windows-release-assets/tr300-x86_64-pc-windows-msvc-corporate-setup.exe.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-windows-installers:
    name: Publish the fixed Windows installer asset set
    needs:
      - resolve-release
      - build-windows-installers
    if: |
      needs.resolve-release.result == 'success' &&
      needs.build-windows-installers.result == 'success'
    runs-on: ubuntu-22.04
    environment: release-publishing
    permissions:
      actions: read
      contents: write

    steps:
      - name: Revalidate custody and publish the fixed six assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          EXPECTED_SHA: ${{ needs.resolve-release.outputs.source_sha }}
          RELEASE_ID: ${{ needs.resolve-release.outputs.release_id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          ASSET_DIRECTORY: ${{ runner.temp }}/windows-release-assets
          CURRENT_RUN_ID: ${{ github.run_id }}
          INTERNAL_ARTIFACT_ID: ${{ needs.build-windows-installers.outputs.artifact_id }}
          INTERNAL_ARTIFACT_DIGEST: ${{ needs.build-windows-installers.outputs.artifact_digest }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local tag=$1
            local object_type source_sha
            IFS=$'\t' read -r object_type source_sha < <(
              gh api "repos/$EXPECTED_REPOSITORY/git/ref/tags/$tag" \
                --jq '.object | [.type, .sha] | @tsv'
            )
            for _ in 1 2 3 4 5; do
              case "$object_type" in
                commit)
                  printf '%s\n' "$source_sha"
                  return 0
                  ;;
                tag)
                  IFS=$'\t' read -r object_type source_sha < <(
                    gh api "repos/$EXPECTED_REPOSITORY/git/tags/$source_sha" \
                      --jq '.object | [.type, .sha] | @tsv'
                  )
                  ;;
                *)
                  echo "release tag resolves to unsupported object type: $object_type" >&2
                  return 65
                  ;;
              esac
            done
            echo 'release tag did not resolve to a commit' >&2
            return 65
          }

          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "invalid stable release tag: $RELEASE_TAG" >&2
            exit 64
          }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'expected release SHA is malformed' >&2
            exit 65
          }
          [[ "$EXPECTED_REPOSITORY" == QubeTX/qube-machine-report &&
             "$WORKFLOW_SHA" == "$EXPECTED_SHA" ]]
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ &&
             "$CURRENT_RUN_ID" =~ ^[1-9][0-9]*$ &&
             "$INTERNAL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ &&
             "$INTERNAL_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

          asset_names=(
            tr300-x86_64-pc-windows-msvc-corporate.msi
            tr300-x86_64-pc-windows-msvc-corporate.msi.sha256
            tr300-x86_64-pc-windows-msvc-setup.exe
            tr300-x86_64-pc-windows-msvc-setup.exe.sha256
            tr300-x86_64-pc-windows-msvc-corporate-setup.exe
            tr300-x86_64-pc-windows-msvc-corporate-setup.exe.sha256
          )
          work_directory=$(mktemp -d "$RUNNER_TEMP/tr300-windows-publisher.XXXXXXXX")
          trap 'rm -rf "$work_directory"' EXIT
          repository_id=$(gh api "repos/$EXPECTED_REPOSITORY" --jq .id)
          [[ "$repository_id" =~ ^[1-9][0-9]*$ ]]
          validate_artifact() {
            local path=$1
            jq -e --argjson id "$INTERNAL_ARTIFACT_ID" \
              --argjson run "$CURRENT_RUN_ID" --argjson repository "$repository_id" \
              --arg digest "sha256:$INTERNAL_ARTIFACT_DIGEST" --arg sha "$EXPECTED_SHA" '
                .id == $id and .name == "windows-release-assets" and
                .expired == false and (.size_in_bytes > 0 and .size_in_bytes <= 268435456) and
                .digest == $digest and .workflow_run.id == $run and
                .workflow_run.repository_id == $repository and
                .workflow_run.head_repository_id == $repository and
                .workflow_run.head_sha == $sha
              ' "$path" >/dev/null
          }
          gh api "repos/$EXPECTED_REPOSITORY/actions/artifacts/$INTERNAL_ARTIFACT_ID" \
            > "$work_directory/artifact-before.json"
          validate_artifact "$work_directory/artifact-before.json"
          zip_path="$work_directory/windows-assets.zip"
          gh api "repos/$EXPECTED_REPOSITORY/actions/artifacts/$INTERNAL_ARTIFACT_ID/zip" \
            > "$zip_path"
          zip_hash=$(sha256sum "$zip_path"); zip_hash=${zip_hash%% *}
          [[ "$zip_hash" == "$INTERNAL_ARTIFACT_DIGEST" ]]
          mkdir "$ASSET_DIRECTORY"
          chmod 700 "$ASSET_DIRECTORY"
          python3 - "$zip_path" "$ASSET_DIRECTORY" "${asset_names[@]}" <<'PY'
          import os
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          zip_path, output_path, *expected = sys.argv[1:]
          expected_names = set(expected)
          output = Path(output_path)
          with zipfile.ZipFile(zip_path) as source:
              members = source.infolist()
              names = [member.filename for member in members]
              if len(names) != len(expected_names) or set(names) != expected_names:
                  raise SystemExit(f"unexpected Windows artifact members: {names!r}")
              if sum(member.file_size for member in members) > 256 * 1024 * 1024:
                  raise SystemExit("Windows artifact expands beyond the custody limit")
              for member in members:
                  pure = PurePosixPath(member.filename)
                  mode = member.external_attr >> 16
                  if (pure.name != member.filename or pure.is_absolute() or
                      ".." in pure.parts or member.is_dir() or member.file_size <= 0 or
                      member.file_size > 256 * 1024 * 1024 or stat.S_ISLNK(mode)):
                      raise SystemExit(f"unsafe Windows artifact member: {member.filename!r}")
                  destination = output / member.filename
                  flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
                  if hasattr(os, "O_NOFOLLOW"):
                      flags |= os.O_NOFOLLOW
                  descriptor = os.open(destination, flags, 0o600)
                  try:
                      with source.open(member) as src, os.fdopen(descriptor, "wb") as dst:
                          descriptor = -1
                          shutil.copyfileobj(src, dst, length=1024 * 1024)
                  finally:
                      if descriptor >= 0:
                          os.close(descriptor)
          PY
          gh api "repos/$EXPECTED_REPOSITORY/actions/artifacts/$INTERNAL_ARTIFACT_ID" \
            > "$work_directory/artifact-after.json"
          validate_artifact "$work_directory/artifact-after.json"
          cmp "$work_directory/artifact-before.json" "$work_directory/artifact-after.json"

          declare -A expected_names=()
          for name in "${asset_names[@]}"; do
            expected_names["$name"]=1
          done
          mapfile -d '' -t entries < <(
            find "$ASSET_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          [[ ${#entries[@]} -eq ${#asset_names[@]} ]] || {
            echo 'internal artifact does not contain exactly six entries' >&2
            exit 66
          }
          for path in "${entries[@]}"; do
            name=${path##*/}
            [[ -n ${expected_names[$name]+present} && -f "$path" && ! -L "$path" && -s "$path" ]] || {
              echo "unexpected, empty, or non-regular artifact entry: $name" >&2
              exit 66
            }
            unset 'expected_names[$name]'
          done
          [[ ${#expected_names[@]} -eq 0 ]] || {
            echo 'internal artifact is missing a required file' >&2
            exit 66
          }

          for payload_name in \
            tr300-x86_64-pc-windows-msvc-corporate.msi \
            tr300-x86_64-pc-windows-msvc-setup.exe \
            tr300-x86_64-pc-windows-msvc-corporate-setup.exe
          do
            payload="$ASSET_DIRECTORY/$payload_name"
            sidecar="$payload.sha256"
            hash=$(sha256sum -- "$payload")
            hash=${hash%% *}
            expected_sidecar="$hash *$payload_name"
            sidecar_size=$(wc -c < "$sidecar" | tr -d '[:space:]')
            [[ "$hash" =~ ^[0-9a-f]{64}$ && "$sidecar_size" == "${#expected_sidecar}" && "$(< "$sidecar")" == "$expected_sidecar" ]] || {
              echo "checksum sidecar does not bind payload: $payload_name" >&2
              exit 66
            }
          done

          # Rebind immediately before publication so a tag or Release mutation
          # after the build job cannot redirect this privileged write.
          source_sha=$(resolve_tag_commit "$RELEASE_TAG")
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$EXPECTED_SHA" ]] || {
            echo "release tag $RELEASE_TAG no longer targets $EXPECTED_SHA" >&2
            exit 65
          }
          main_sha=$(gh api "repos/$EXPECTED_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$main_sha" == "$EXPECTED_SHA" ]] || {
            echo "release source is no longer current main" >&2
            exit 65
          }
          workflow_id=$(gh api "repos/$EXPECTED_REPOSITORY/actions/workflows/ci.yml" --jq .id)
          gh api "repos/$EXPECTED_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$EXPECTED_SHA&per_page=100" \
            > "$work_directory/ci-runs.json"
          mapfile -t ci_runs < <(
            jq -r --argjson workflow_id "$workflow_id" --arg repository "$EXPECTED_REPOSITORY" \
              --arg sha "$EXPECTED_SHA" '
                .workflow_runs[] |
                select(.workflow_id == $workflow_id and .name == "CI" and
                       .path == ".github/workflows/ci.yml" and .event == "push" and
                       .status == "completed" and .conclusion == "success" and
                       .repository.full_name == $repository and
                       .head_repository.full_name == $repository and
                       .head_branch == "main" and .head_sha == $sha) | .id
              ' "$work_directory/ci-runs.json"
          )
          [[ ${#ci_runs[@]} -eq 1 && "${ci_runs[0]}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$EXPECTED_REPOSITORY/releases/$RELEASE_ID" \
            > "$work_directory/release-before.json"
          jq -e --argjson id "$RELEASE_ID" --arg tag "$RELEASE_TAG" \
            --arg sha "$EXPECTED_SHA" '
              .id == $id and .tag_name == $tag and .target_commitish == $sha and
              .draft == true and .prerelease == false
            ' "$work_directory/release-before.json" >/dev/null

          mapfile -t existing_assets < <(
            jq -r '.assets[].name' "$work_directory/release-before.json"
          )
          has_existing_asset() {
            local needle=$1
            local existing
            for existing in "${existing_assets[@]}"; do
              [[ "$existing" == "$needle" ]] && return 0
            done
            return 1
          }
          for sentinel in dist-manifest.json tr300-x86_64-pc-windows-msvc.msi; do
            has_existing_asset "$sentinel" || {
              echo "upstream release lost required asset: $sentinel" >&2
              exit 65
            }
          done
          for name in "${asset_names[@]}"; do
            ! has_existing_asset "$name" || {
              echo "release asset already exists; refusing to clobber: $name" >&2
              exit 65
            }
          done

          # Tagged release bytes are immutable. These are six fixed paths and
          # replacement is intentionally disabled; any same-name race fails closed.
          gh release upload "$RELEASE_TAG" --repo "$EXPECTED_REPOSITORY" \
            "$ASSET_DIRECTORY/tr300-x86_64-pc-windows-msvc-corporate.msi" \
            "$ASSET_DIRECTORY/tr300-x86_64-pc-windows-msvc-corporate.msi.sha256" \
            "$ASSET_DIRECTORY/tr300-x86_64-pc-windows-msvc-setup.exe" \
            "$ASSET_DIRECTORY/tr300-x86_64-pc-windows-msvc-setup.exe.sha256" \
            "$ASSET_DIRECTORY/tr300-x86_64-pc-windows-msvc-corporate-setup.exe" \
            "$ASSET_DIRECTORY/tr300-x86_64-pc-windows-msvc-corporate-setup.exe.sha256"
          echo "Uploaded 6 immutable assets to $RELEASE_TAG"
